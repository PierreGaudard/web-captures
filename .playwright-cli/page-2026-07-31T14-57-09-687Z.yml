        - paragraph [ref=e121]: Ces modèles sont tous tarifés par AMV, comme les générations précédentes de la marque, dont les 310 et les 368.
        - paragraph [ref=e122]:
          - text: "Dans tous les cas, la formule ne dépend pas du permis : les mêmes garanties s'appliquent à tous les assurés, sans formule réservée aux"
          - link "jeunes conducteurs" [ref=e123] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-moto/assurance-moto-jeune-conducteur/
          - text: ". Sur les modèles les plus sportifs de la gamme, en revanche, un permis récent reste une limite : l'assurance suppose d'avoir plus de 30 ans ou de justifier d'antécédents d'assurance."
        - heading "Les formules d'assurance moto Zontes" [level=2] [ref=e124]
        - paragraph [ref=e125]: "AMV propose les formules de garanties et options adaptées à votre Zontes et à l'usage que vous en faites. Un seul contrat et jusqu'à quatre formules : à vous de choisir selon la valeur de votre moto, sa fréquence d'utilisation et votre budget."
        - paragraph [ref=e126]: La formule Responsabilité civile, couverture minimale obligatoire, couvre les dommages causés aux tiers lors d'un sinistre responsable. C'est le minimum obligatoire pour rouler sur la route tout en maîtrisant son budget. Elle peut suffire pour une Zontes de faible valeur.
        - paragraph [ref=e127]: "La formule Vol / Incendie protège en plus votre moto contre le vol et l'incendie, avec une indemnisation à la valeur de remplacement à dire d'expert ou à la valeur à neuf durant les 6 premiers mois. Elle serait à envisager si votre Zontes stationne majoritairement sur la voie publique. À noter également : chez AMV, le gravage du deux-roues, associé à un antivol agréé SRA, permet de diviser la franchise vol par 2."
        - paragraph [ref=e128]: La formule Dommages collision, la garantie distinctive d'AMV, couvre les dommages causés à votre moto lors d'une collision avec un tiers identifié, déduction faite, en cas de sinistre responsable, de la franchise prévue au contrat. Elle permet une meilleure couverture tout en maîtrisant votre budget.
        - paragraph [ref=e129]: La formule Tous risques couvre les dommages subis par votre deux-roues quelles que soient les circonstances. Elle serait recommandée pour une Zontes neuve, récente ou financée à crédit.
        - paragraph [ref=e130]: "Et dès la première formule, votre équipement de pilote est protégé : casque, gants et gilet airbag sont garantis s'ils sont détériorés lors d'un événement couvert."
