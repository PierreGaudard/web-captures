      - generic [ref=e40]:
        - paragraph [ref=e41]: AMV, spécialiste de l'assurance deux-roues, assure les motos Zontes, des 125 cm³ accessibles dès le permis A1 aux 703 bicylindres, en passant par les 350 compatibles permis A2. Un seul contrat, jusqu'à quatre formules, des options au choix. Le casque, les gants et le gilet airbag sont couverts dès la première formule, et le devis en ligne ne prend que quelques minutes.
        - list [ref=e42]:
          - listitem [ref=e43]: "La gamme Zontes est assurable : 125 Urban, Roadster R, Hyper Trail, C2 et Scrambler X, 350 GK et 350 T, 703 T, 703 F Adventure et 703 RR."
          - listitem [ref=e44]: Jusqu'à quatre formules au choix, selon les modèles, de la Responsabilité civile à la formule Tous risques.
          - listitem [ref=e45]: La garantie Dommages collision permet une couverture renforcée en maîtrisant votre budget.
          - listitem [ref=e46]: "Le tarif est personnalisé : modèle, cylindrée, date de première mise en circulation, lieu de stationnement, niveau de couverture et sinistralité déclarée."
          - listitem [ref=e47]: Devis en ligne gratuit, souscription rapide avec peu de justificatifs.
        - heading "Zontes, la marque chinoise qui monte sur le marché français" [level=2] [ref=e48]
        - paragraph [ref=e49]: "Zontes est la marque moto du groupe industriel chinois Guangdong Tayo Motorcycle Technology, fondé en 2003. Elle est distribuée en France par GD France, distributeur exclusif depuis 2019, et s'appuie aujourd'hui sur plus de 130 concessions en France métropolitaine et en Outre-mer. Son positionnement tient en peu de mots : des 125, des 350 et des 703 richement dotées, avec écran TFT couleur, démarrage sans clé ou bulle réglable selon les versions, à des tarifs inférieurs à ceux des constructeurs européens."
        - paragraph [ref=e50]: "Une gamme récente et technologique, qui s'assure comme n'importe quelle autre moto : la couverture d'une Zontes se choisit selon sa valeur, sa fréquence d'utilisation et votre budget, pas par défaut."
        - heading "Quelle assurance selon votre modèle Zontes ?" [level=2] [ref=e51]
        - paragraph [ref=e52]: "Chaque famille de modèles répond à des besoins différents, et le choix de la formule dépend surtout de la valeur de votre moto :"
        - list [ref=e53]:
          - listitem [ref=e54]: "Les 125 cm³, de la 125 Urban à la 125 Scrambler X en passant par la 125 Roadster R : des motos souvent utilisées en ville et stationnées sur la voie publique."
          - listitem [ref=e55]: La 125 Hyper Trail et la 125 C2, dans un registre plus trail et néo-rétro, avec les mêmes contraintes de stationnement.
          - listitem [ref=e56]: "Les 350, comme la 350 GK et la 350 T, accessibles dès le permis A2 sans bridage : des machines polyvalentes, utilisées au quotidien comme sur route."
          - listitem [ref=e57]: Les 703, comme la 703 T et la 703 F Adventure, taillées pour les longs trajets et les voyages, et dont la valeur plus élevée justifierait en général une couverture plus complète.
          - listitem [ref=e58]: La 703 RR, la sportive de la gamme, pour laquelle l'assurance est accessible si vous avez plus de 30 ans ou des antécédents d'assurance.
        - paragraph [ref=e59]: Vous roulez sur piste ? Le roulage libre sur circuit est assuré ; la compétition, en revanche, n'est couverte par aucune garantie.
        - heading "Quel permis pour conduire une Zontes ?" [level=2] [ref=e60]
        - paragraph [ref=e61]: La gamme se répartit sur trois niveaux de permis, ce qui explique en partie son succès auprès des nouveaux motards.
        - paragraph [ref=e62]: Une 125 cm³ se conduit avec le permis A1, mais également avec le permis B détenu depuis au moins 2 ans, après une formation de 7 heures. Les 350, elles, sont accessibles dès le permis A2 sans bridage, puisqu'elles restent sous la limite de 35 kW. Les 703 existent en version bridée à 35 kW pour le permis A2, contre 55 kW en version libre, la puissance complète étant réservée aux titulaires du permis A ou aux motards passés par la passerelle.
