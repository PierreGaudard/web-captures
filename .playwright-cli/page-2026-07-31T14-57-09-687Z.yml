              - cell "Individuelle Pilote (option)" [ref=e150]
              - cell "Capital jusqu'à 800 000 € en cas d'invalidité permanente ; capital versé aux ayants droit en cas de décès" [ref=e151]
            - row "Option Plus (option) Équipement moto couvert en vol comme en dommages, accessoires hors-série et top case, dans la limite de 5 000 €" [ref=e152]:
              - cell "Option Plus (option)" [ref=e153]
              - cell "Équipement moto couvert en vol comme en dommages, accessoires hors-série et top case, dans la limite de 5 000 €" [ref=e154]
        - paragraph [ref=e155]: La Défense pénale et recours suite à accident, associée à la Protection juridique, vous accompagne en cas de litige lié, notamment à un accident, jusqu'à 20 000 € au total.
        - heading "Les options pour une protection sur-mesure" [level=2] [ref=e156]
        - paragraph [ref=e157]: Votre contrat se complète d'options dédiées au pilote et aux équipements, pour ajuster la protection à votre Zontes et à votre pratique.
        - paragraph [ref=e158]: L'Option Individuelle Pilote vous verse un capital, pouvant aller jusqu'à 800 000 euros en cas d'invalidité permanente, ou à vos ayants droit en cas de décès, même lors d'un accident responsable. Sur une 703 comme sur une 125 du quotidien, cette protection du pilote lui-même prend tout son sens.
        - paragraph [ref=e159]: "Avec l'Option Plus, votre deux-roues acheté neuf, volé ou détruit suite à un sinistre est remboursé à sa valeur d'achat pendant un an et demi à compter de la date d'achat. L'ensemble de votre équipement moto est couvert en vol comme en dommages, mais également les accessoires hors-série, comme le top case par exemple, dans la limite de 5 000 € : un vrai plus pour une 703 T équipée pour le voyage ou une 125 Scrambler X personnalisée."
        - paragraph [ref=e160]: "AMV propose aussi une Assistance 0 km en option, pour un dépannage sur mesure : votre moto est dépannée ou remorquée jusqu'à la concession la plus proche, vous et votre passager êtes rapatriés. La crevaison est incluse."
        - heading "Quel est le prix d'une assurance moto Zontes ?" [level=2] [ref=e161]
        - paragraph [ref=e162]: "Assurer sa moto n'est pas une option : le code des assurances impose au minimum la Responsabilité civile pour tout véhicule terrestre à moteur. Reste à savoir ce que représente ce coût pour une Zontes."
        - paragraph [ref=e163]: "Le montant d'une assurance moto Zontes est personnalisé. Il est établi à partir, entre autres, du modèle à assurer, de sa cylindrée, de sa date de première mise en circulation, du lieu de stationnement, du niveau de couverture choisi et de la sinistralité déclarée. À profil identique, une 125 Urban ne s'assurerait donc pas au même tarif qu'une 703 RR, dont la valeur est nettement supérieure. La formule retenue pèse tout autant : une Responsabilité civile revient logiquement moins chère qu'une Tous risques, pour une protection bien moindre en cas de sinistre."
        - paragraph [ref=e164]: Le devis en ligne AMV, gratuit et sans engagement, vous donne en quelques minutes le tarif de chaque formule pour votre modèle, avant de choisir la couverture qui correspond à votre budget.
        - heading "Pourquoi assurer votre Zontes chez AMV ?" [level=2] [ref=e165]
        - paragraph [ref=e166]: AMV, spécialiste de l'assurance deux-roues fondée en 1974 par un passionné de moto, pour les motards, compte plus d'1 million d'assurés et affiche une note de satisfaction de 4,7 sur 5 via Avis Vérifiés. Nos plus de 350 conseillers, basés à Bordeaux, connaissent les spécificités de la gamme Zontes, du monocylindre 125 aux bicylindres 703, et un conseiller dédié vous suit en cas de sinistre.
        - paragraph [ref=e167]:
          - text: "Marque récente sur le marché français, Zontes n'est pas toujours référencée chez les assureurs généralistes : chez AMV, chaque modèle de la gamme l'est, pour un devis précis en quelques clics. Souscrire prend peu de temps : un devis en ligne gratuit, peu de justificatifs là où d'autres assureurs réclament davantage de pièces, et une couverture qui peut prendre effet immédiatement, sous réserve de certaines conditions. Si vous le souhaitez, vous pouvez ensuite gérer votre contrat en toute autonomie depuis Mon Espace AMV. Découvrez également notre"
          - link "assurance moto" [ref=e168] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance/moto/
          - text: pour
          - link "l'ensemble des constructeurs" [ref=e169] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-moto/assurance-moto-par-constructeur/
          - text: .
      - generic [ref=e170]:
        - heading "Questions fréquentes sur l'assurance moto Zontes" [level=2] [ref=e171]
        - heading "Quel est le prix d'une assurance pour une Zontes 125 ou une 703 ?" [level=3] [ref=e172]
        - paragraph [ref=e173]: "Il n'existe pas de tarif unique : chaque cotisation est calculée selon, notamment, le modèle, sa cylindrée, sa date de première mise en circulation, le lieu de stationnement, le niveau de couverture et la sinistralité déclarée. Une 125 Urban se situe en général sur des niveaux de tarif plus abordables qu'une 703 F Adventure ou une 703 RR. Le devis en ligne vous donne un tarif personnalisé pour votre Zontes en quelques minutes."
        - heading "Quelle assurance choisir pour une Zontes ?" [level=3] [ref=e174]
        - paragraph [ref=e175]: Le choix dépend surtout de la valeur de votre moto. Pour une Zontes de faible valeur, la formule Responsabilité civile peut suffire. Pour un modèle neuf, récent ou financé à crédit, la formule Tous risques offrirait la protection la plus complète. Entre les deux, la formule Vol / Incendie serait pertinente si votre moto stationne majoritairement dehors, et la formule Dommages collision renforce votre couverture en cas d'accident avec un tiers identifié, tout en maîtrisant votre budget.
        - heading "Peut-on assurer une Zontes 125 avec le permis B ?" [level=3] [ref=e176]
        - paragraph [ref=e177]: "Oui. Une 125 cm³ se conduit avec le permis A1, A2 ou A, mais également avec le permis B détenu depuis au moins 2 ans, après une formation de 7 heures. Elle s'assure alors comme n'importe quelle 125. Le tarif reste personnalisé, sans formule spécifique aux jeunes conducteurs : les mêmes garanties s'appliquent à tous les assurés."
        - heading "Une Zontes 703 bridée en A2 s'assure-t-elle comme une 703 non bridée ?" [level=3] [ref=e178]
        - paragraph [ref=e179]:
          - text: Les 703 existent en version bridée à 35 kW pour le
          - link "permis A2" [ref=e180] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-moto/assurance-moto-permis-a2/
          - text: ", contre 55 kW en version libre, et les mêmes formules restent disponibles dans les deux cas. Signalez simplement la version que vous conduisez au moment du devis. Seule la 703 RR, la sportive de la gamme, suppose d'avoir plus de 30 ans ou des antécédents d'assurance."
        - heading "Faut-il fournir beaucoup de documents pour assurer une Zontes ?" [level=3] [ref=e181]
        - paragraph [ref=e182]: "Non. La souscription chez AMV demande peu de justificatifs, là où d'autres assureurs en réclament davantage. Le permis, la carte grise ou le relevé d'information ne sont pas des pièces à fournir en tant que telles : ce sont les renseignements qu'ils contiennent qui sont nécessaires pour établir votre tarif. Vous recevez ensuite votre attestation d'assurance par e-mail."
