      - generic [ref=e98]:
        - generic [ref=e99]: Nouveau contenu optimisé
        - generic [ref=e100]:
          - generic [ref=e101]: H2
          - text: Nos formules d'assurance moto Honda
        - paragraph [ref=e102]: AMV propose quatre formules pour couvrir votre Honda selon votre profil, votre budget et la valeur de votre moto. Chaque formule peut être complétée par des options à la carte.
        - generic [ref=e103]:
          - generic [ref=e104]: H3
          - text: Formule Responsabilité civile (au tiers)
        - paragraph [ref=e105]: "La formule de base couvre la responsabilité civile (dommages matériels et corporels causés à autrui), l'assistance juridique et la protection de vos équipements essentiels : casque jusqu'à 250 euros, gants jusqu'à 70 euros et gilet airbag jusqu'à 500 euros. C'est la formule au tiers la plus accessible pour rouler en toute légalité, idéale pour réaliser des économies sur une Honda ancienne ou de faible valeur marchande."
        - generic [ref=e106]:
          - generic [ref=e107]: H3
          - text: Formule Vol / Incendie
        - paragraph [ref=e108]: En complément du socle de la première formule, cette couverture prend en charge les dommages de votre Honda en cas de vol, de tentative de vol ou d'incendie. Une protection pertinente pour un modèle récent, en particulier si vous stationnez votre deux-roues en extérieur.
        - generic [ref=e109]:
          - generic [ref=e110]: H3
          - text: Formule Dommages collision
        - paragraph [ref=e111]: Cette formule assure la prise en charge des dommages subis par votre Honda lors d'une collision avec un tiers identifié, remboursés à la valeur de remplacement. Elle convient aux deux-roues de valeur intermédiaire.
        - generic [ref=e112]:
          - generic [ref=e113]: H3
          - text: Formule Tous risques
        - paragraph [ref=e114]: La formule Tous risques offre une couverture complète des dommages subis par votre Honda, avec ou sans tiers identifié, y compris en cas de sinistre responsable. C'est la solution recommandée pour une Honda neuve, récente ou financée à crédit.
        - generic [ref=e115]:
          - generic [ref=e116]: H2
          - text: Les options pour personnaliser votre contrat
        - paragraph [ref=e117]: Chaque formule se complète par des options pour ajuster votre couverture à votre pratique et à votre véhicule.
        - generic [ref=e118]:
          - generic [ref=e119]: H3
          - text: Individuelle pilote
        - paragraph [ref=e120]: L'option Individuelle pilote verse un capital en cas de décès ou d'invalidité permanente consécutifs à un accident, même responsable. Elle protège le conducteur, là où l'assurance de base couvre les tiers.
        - generic [ref=e121]:
          - generic [ref=e122]: H3
          - text: Assistance 0 km
        - paragraph [ref=e123]: L'assistance 0 km intervient sans franchise kilométrique, 24h/24 et 7j/7, même devant chez vous, en cas de panne, d'accident, de vol, de crevaison, de perte de clés ou d'enlèvement par la fourrière. Dépannage, remorquage et rapatriement sont pris en charge pour vous, votre Honda et votre passager, en France métropolitaine et dans la plupart des pays d'Europe.
        - generic [ref=e124]:
          - generic [ref=e125]: H3
          - text: Option plus
        - paragraph [ref=e126]: L'Option plus étend la couverture à l'équipement vestimentaire de protection et aux accessoires hors-série montés sur votre Honda (top case, sacoches, échappement…), à concurrence de 5 000 euros, et prolonge la garantie valeur à neuf jusqu'à 18 mois.
        - generic [ref=e127]:
          - generic [ref=e128]: H2
          - text: Découvrez l'assurance pour les modèles Honda
        - paragraph [ref=e129]: "Premier constructeur mondial de deux-roues, Honda couvre tous les usages : roadsters et sportives (CB650R, Hornet CB750, CBR650R, CBR1000RR-R), trails et routières (Africa Twin CRF1100L, NC750X, NT1100), customs (Rebel, Gold Wing) et scooters (Forza, PCX, X-ADV). AMV assure l'ensemble de la gamme Honda, des petites cylindrées bridables en permis A2 aux modèles de forte puissance, sans oublier les machines de collection. Si vous possédez plusieurs deux-roues, AMV peut regrouper vos contrats."
        - generic [ref=e130]:
          - generic [ref=e131]: H2
          - text: Pourquoi choisir AMV pour assurer votre Honda ?
        - paragraph [ref=e132]: "Leader et assureur spécialiste de l'assurance moto et scooter en France depuis plus de 50 ans, AMV assure plus d'un million de motards et affiche une note de satisfaction de 4,7/5 selon Avis Vérifiés. Fondée en 1974 par un passionné, pour les motards, l'entreprise connaît les spécificités de chaque marque et de chaque modèle, de la moto sportive au scooter urbain. Cette expertise deux-roues couvre des situations que les assureurs généralistes ignorent : vol de casque, équipement endommagé lors d'un accident, panne en pleine balade. Plus de 350 conseillers basés à Bordeaux vous accompagnent par téléphone, par e-mail ou via votre Espace Client, avec un interlocuteur dédié en cas de sinistre."
        - generic [ref=e133]:
          - generic [ref=e134]: H2
          - text: Comment obtenir votre devis d'assurance moto Honda ?
        - paragraph [ref=e135]: Obtenir votre devis d'assurance moto Honda en ligne se fait en quelques étapes. Renseignez les informations sur votre Honda (modèle, puissance, année) et votre profil (expérience, bonus-malus, région) pour recevoir un tarif personnalisé en quelques minutes. Si le prix vous convient, vous souscrivez en quelques clics et recevez votre attestation par mail. Vous gérez ensuite votre contrat, vos garanties et vos sinistres depuis Mon Espace AMV, à tout moment.
      - generic [ref=e136]:
        - generic [ref=e137]: Nouveau contenu optimisé
        - generic [ref=e138]:
          - generic [ref=e139]: H2
          - text: Questions fréquentes sur l'assurance moto Honda
        - generic [ref=e140]:
          - generic [ref=e141]: H3
          - text: Quelle assurance choisir pour une moto Honda ?
        - paragraph [ref=e142]: Le choix dépend de la valeur de votre Honda, de votre usage et de votre budget. Une formule Responsabilité civile peut suffire pour une Honda ancienne ou de faible valeur. Pour une Honda récente ou financée à crédit, la formule Tous risques offre la meilleure protection. Si vous stationnez en extérieur, la formule Vol / Incendie mérite d'être envisagée.
        - generic [ref=e143]:
          - generic [ref=e144]: H3
          - text: Combien coûte l'assurance d'une moto Honda ?
        - paragraph [ref=e145]: Le prix dépend du modèle, de la cylindrée et de la puissance, de votre profil de conducteur, de la zone de stationnement et du niveau de couverture choisi. Une petite cylindrée au tiers coûte moins cher qu'une sportive en Tous risques. Comparer les formules vous aide à obtenir le meilleur prix sans rogner sur les garanties utiles. Un devis en ligne AMV, gratuit et sans engagement, vous donne un tarif adapté en quelques minutes.
        - generic [ref=e146]:
          - generic [ref=e147]: H3
          - text: AMV assure-t-il tous les modèles Honda ?
        - paragraph [ref=e148]: "Oui. AMV assure l'ensemble de la gamme Honda : roadsters, sportives, trails, routières, customs et scooters, des petites cylindrées aux modèles de forte puissance. Chaque deux-roues Honda bénéficie d'une formule adaptée à ses caractéristiques et à votre profil."
        - generic [ref=e149]:
          - generic [ref=e150]: H3
          - text: Peut-on assurer une Honda avec un permis A2 ?
        - paragraph [ref=e151]: Oui. De nombreux modèles Honda sont accessibles ou bridables en permis A2. AMV assure les jeunes conducteurs et propose des formules adaptées, avec les garanties essentielles pour la période probatoire.
      - generic [ref=e152]:
        - heading "Questions fréquentes" [level=2] [ref=e153]
        - generic [ref=e154]:
          - generic [ref=e155] [cursor=pointer]:
            - generic [ref=e156]:
              - generic [ref=e157]: Qu'est-ce qui a lancé le succès de Honda sur la scène automobile et motocycliste ?
              - img [ref=e158]
            - paragraph [ref=e160]: Le succès de Honda prend sa source avec le lancement du "Type A", un véhicule économique équipé d'un moteur de générateur monté sur une bicyclette, qui a connu un grand succès et a marqué le début de la renommée de la marque.
          - generic [ref=e161] [cursor=pointer]:
            - generic [ref=e162]:
              - generic [ref=e163]: Quels ont été les étapes marquants de Honda dans l'industrie de la compétition motocycliste ?
              - img [ref=e164]
            - paragraph [ref=e166]: Honda a marqué la compétition motocycliste de son empreinte en remportant tous les titres mondiaux "constructeur" en 1967 et en introduisant des modèles emblématiques tels que la CB 750 Four, surnommée familièrement "Quatre pattes", qui a été un succès commercial majeur des années 1970.
          - generic [ref=e167] [cursor=pointer]:
            - generic [ref=e168]:
              - generic [ref=e169]: Comment Honda a-t-il continué à innover au fil des décennies ?
              - img [ref=e170]
            - paragraph [ref=e172]: Honda a maintenu son statut de constructeur innovant en introduisant des modèles révolutionnaires tels que la Gold Wing dans les années 1970, la première moto turbocompressée en série en 1982, et les Honda VFR en 1986, témoignant de sa constante quête d'excellence et de sa capacité à anticiper les tendances de l'industrie.
        - generic [ref=e173]:
          - generic [ref=e174] [cursor=pointer]:
            - generic [ref=e175]:
              - generic [ref=e176]: Quelle assurance moto choisir ?
              - img [ref=e177]
            - paragraph [ref=e179]: Pour choisir avec soin votre assurance moto, il est primordial de comparer les tarifs, les garanties et les franchises proposées. AMV, assureur spécialisé dans le domaine de la moto, est une option à prendre en sérieuse considération. Fort de son expertise, AMV offre des solutions adaptées aux besoins spécifiques des motards, assurant ainsi une couverture complète et fiable pour leurs deux-roues. Grâce à son expertise du secteur, AMV peut offrir des services sur mesure et des conseils avisés, assurant la tranquillité d'esprit des motocyclistes tout au long de leurs aventures sur la route.
          - generic [ref=e180] [cursor=pointer]:
            - generic [ref=e181]:
              - generic [ref=e182]: Quel est le prix d'une assurance moto ?
              - img [ref=e183]
            - paragraph [ref=e185]: Le coût d'une assurance moto chez AMV intègre plusieurs facteurs tels que le modèle de la moto, l'expérience du conducteur (permis, sinistres, bonus), le lieu de stationnement habituel et le niveau de garanties désiré. Chez AMV, nous offrons des tarifs compétitifs adaptés à chaque profil de conducteur et à chaque type de moto. Nos conseillers spécialisés sont là pour vous aider à choisir la couverture qui répond le mieux à vos besoins et à votre budget. N'hésitez pas à nous contacter pour obtenir un devis personnalisé et découvrez comment nous pouvons protéger au mieux votre moto. Chez AMV, nous sommes fiers d'accompagner les motards depuis près de 50 ans et de leur proposer une assurance sur mesure pour rouler en toute sérénité.
          - generic [ref=e186] [cursor=pointer]:
            - generic [ref=e187]:
              - generic [ref=e188]: Quelle formule assurance moto choisir ?
              - img [ref=e189]
            - paragraph [ref=e191]: Le choix de la formule d'assurance moto dépend entièrement de vos besoins spécifiques ainsi que de votre budget. Si vous possédez une moto récente, il est fortement recommandé de souscrire à une garantie dommages tous risques, cela vous permettra de couvrir les frais de réparation en cas d'accident responsable. AMV, en tant qu'assureur spécialisé dans l'assurance moto, propose différentes garanties et options adaptées à chaque profil. N'hésitez pas à réaliser un devis sur amv.fr ou nous contacter pour obtenir des informations détaillées sur les formules d'assurance moto proposées afin de trouver celle qui répond le mieux à vos besoins personnels
          - generic [ref=e192] [cursor=pointer]:
            - generic [ref=e193]:
              - generic [ref=e194]: Comment obtenir un devis d'assurance moto ?
              - img [ref=e195]
            - paragraph [ref=e197]: Pour obtenir un devis d'assurance moto rapidement, AMV est votre partenaire de confiance. Spécialiste de l'assurance moto depuis 50 ans, AMV propose des solutions adaptées à vos besoins. Rendez-vous sur amv.fr et complétez simplement notre formulaire pour découvrir votre tarif en seulement 3 minutes. Faites confiance à AMV et roulez en toute sérénité avec la protection dont vous avez besoin.
