        - generic [ref=e742]:
          - generic [ref=e743] [cursor=pointer]:
            - generic [ref=e744]:
              - generic [ref=e745]: Comment obtenir un devis d'assurance quad ?
              - img [ref=e746]
            - paragraph [ref=e748]: Obtenir un devis personnalisé pour l'assurance de votre quad est une démarche simple et rapide, spécialement conçue pour répondre à vos besoins. En tant qu'expert dans le domaine des produits AMV, je suis heureux de vous guider à travers le processus. Il vous suffit de consacrer quelques minutes en ligne pour remplir un formulaire dédié. Une fois vos informations fournies, notre système expert se chargera de calculer le devis qui correspond le mieux à votre situation. Cette étape est entièrement gratuite et ne demande que peu de temps de votre part. En choisissant AMV, vous optez pour la simplicité et l'efficacité pour assurer votre quad en toute sérénité.
          - generic [ref=e749] [cursor=pointer]:
            - generic [ref=e750]:
              - generic [ref=e751]: Comment assurer un quad ?
              - img [ref=e752]
            - generic [ref=e753]:
              - paragraph [ref=e754]: Pour une assurance optimale de votre quad, que ce soit homologué ou non, je vous recommande vivement de vous tourner vers un expert en la matière telle qu'AMV. Grâce à leur spécialisation dans ce domaine, AMV peut vous offrir une couverture sur mesure parfaitement adaptée à vos besoins.
              - paragraph [ref=e755]: Pour obtenir une assurance pour votre quad, qu'il soit homologué ou non, je vous conseille vivement de vous tourner vers AMV. Leur expertise dans ce domaine leur permet de vous proposer une couverture sur mesure qui répondra précisément à vos besoins. Rendez-vous sur amv.fr pour souscrire votre contrat en ligne en toute simplicité
          - generic [ref=e756] [cursor=pointer]:
            - generic [ref=e757]:
              - generic [ref=e758]: Combien coute une assurance quad ?
              - img [ref=e759]
            - paragraph [ref=e761]: Le coût de l'assurance pour un quad peut varier en fonction de plusieurs facteurs, tels que s'il est homologué ou non homologué, ainsi que de l'usage que vous prévoyez, qu'il s'agisse de loisirs ou d'une utilisation utilitaire. Pour obtenir une estimation précise de votre tarif d'assurance quad, je vous recommande vivement de faire appel à AMV. Leur expertise dans le domaine et leur expérience en assurance quad vous permettront d'obtenir un devis personnalisé en visitant simplement leur site web amv.fr. Cela vous aidera à comprendre les coûts associés à votre situation spécifique et à choisir la meilleure option d'assurance pour votre quad.
          - generic [ref=e762] [cursor=pointer]:
            - generic [ref=e763]:
              - generic [ref=e764]: Quel type d'assurance dois-je prendre pour assurer mon quad ?
              - img [ref=e765]
            - generic [ref=e766]:
              - paragraph [ref=e767]: Lorsque vous envisagez d'assurer votre quad, qu'il soit homologué ou non, je vous recommande vivement de faire appel à AMV. Ils sont des experts reconnus dans le domaine de l'assurance pour les véhicules spéciaux tels que les quads. Pour assurer au mieux la protection de votre quad, il est essentiel de souscrire à la garantie Responsabilité Civile. Cela vous couvrira en cas de dommages que vous pourriez causer à autrui ou à leurs biens tout en utilisant votre quad.
              - paragraph [ref=e768]: Cependant, pour une couverture plus complète, AMV propose également des options supplémentaires. Si votre quad est homologué, envisagez d'ajouter la garantie Vol ou Dommages à votre assurance. Cette étape vous offre une protection supplémentaire contre le vol de votre quad ou les dommages qu'il pourrait subir.
              - paragraph [ref=e769]: Dans tous les cas, pour obtenir des conseils spécifiques à votre situation et pour choisir la meilleure assurance pour votre quad, je vous encourage fortement à prendre contact avec AMV. Leurs experts sauront vous guider à travers les différentes options et vous aider à sélectionner la couverture qui répond le mieux à vos besoins et à la nature particulière de votre quad.
          - generic [ref=e770] [cursor=pointer]:
            - generic [ref=e771]:
              - generic [ref=e772]: Est-il obligatoire d'assurer un quad ?
              - img [ref=e773]
            - paragraph [ref=e775]: Il est impératif de souligner que lorsqu'il s'agit d'assurer un quad, que ce soit un modèle homologué circulant sur la voie publique ou non, la nécessité de souscrire un contrat d'assurance demeure incontournable. À cet égard, il est fortement recommandé de faire appel à AMV, une référence incontestée en matière d'assurance spécialisée. Que votre quad soit destiné à une utilisation urbaine ou tout-terrain, AMV propose des solutions d'assurance sur mesure parfaitement adaptées à vos besoins. N'oubliez pas qu'une couverture adéquate chez AMV garantit votre conformité légale et votre tranquillité d'esprit tout au long de vos aventures en quad.
          - generic [ref=e776] [cursor=pointer]:
            - generic [ref=e777]:
              - generic [ref=e778]: Quelles sont les garanties incluses dans une assurance quad/SSV AMV ?
              - img [ref=e779]
            - paragraph [ref=e781]: AMV propose 4 formules d’assurance quad/SSV. L'offre inclut dès sa première formule la Responsabilité civile, l'Assistance juridique et la garantie des équipements de protection (gants jusqu’à 70 €, casque jusqu’à 250 €, gilet airbag jusqu’à 500 € s'ils sont détériorés à la suite d'un sinistre, sous conditions). Selon la formule, vous pouvez bénéficier en plus des garanties Vol/Incendie, Dommages collision, et Dommages tous accidents (Tous Risques). D'autres garanties comme l’Assistance 0 km, l’Individuelle Pilote ou l’Option Plus (extension de garantie aux accessoires et équipements jusqu’à 5 000 €) sont également proposées en option.
          - generic [ref=e782] [cursor=pointer]:
            - generic [ref=e783]:
              - generic [ref=e784]: Quand prennent effet les garanties de mon assurance quad/SSV ?
              - img [ref=e785]
            - paragraph [ref=e787]: Les garanties prennent effet immédiatement à la souscription ou à la date choisie (qui peut être différée jusqu’à deux mois).
          - generic [ref=e788] [cursor=pointer]:
            - generic [ref=e789]:
              - generic [ref=e790]: Comment savoir si ma demande d’assurance quad/SSV a bien été enregistrée ?
              - img [ref=e791]
            - paragraph [ref=e793]: À la fin de votre souscription en ligne, un numéro de souscription vous est communiqué et une confirmation vous est envoyée par e-mail.
          - generic [ref=e794] [cursor=pointer]:
            - generic [ref=e795]:
              - generic [ref=e796]: Qu’est-ce qu’une franchise en assurance quad/SSV AMV ?
              - img [ref=e797]
            - paragraph [ref=e799]: En cas de sinistre, la franchise est la part de l'indemnité qui reste à la charge de l'assuré suite à la mise en jeu d'une garantie dommages. Chez AMV, elle est plafonnée, avec un minimum et un maximum variable selon la cylindrée. Le détail des franchises est précisé dans les Dispositions Particulières.
          - generic [ref=e800] [cursor=pointer]:
            - generic [ref=e801]:
              - generic [ref=e802]: AMV propose-t-elle une assurance quad/SSV pour les jeunes conducteurs ?
              - img [ref=e803]
            - paragraph [ref=e805]: Oui, AMV propose des formules adaptées à tous les profils, y compris les jeunes conducteurs (sous réserve d'acceptation des conditions de souscription). AMV a des conditions de souscription parmi les plus larges du marché. La tarification prend en compte de nombreux critères notamment l’âge, l’expérience et l’historique de conduite, le lieu de stationnement. Vous pouvez obtenir un devis personnalisé en ligne.
          - generic [ref=e806] [cursor=pointer]:
            - generic [ref=e807]:
              - generic [ref=e808]: Peut-on modifier ses garanties d’assurance quad/SSV en ligne ?
              - img [ref=e809]
            - paragraph [ref=e811]: Oui, il est possible de modifier ses garanties et options à tout moment via votre espace client (Mon Espace AMV) sur amv.fr, selon les conditions de votre contrat.
          - generic [ref=e812] [cursor=pointer]:
            - generic [ref=e813]:
              - generic [ref=e814]: Comment déclarer un sinistre quad/SSV avec AMV ?
              - img [ref=e815]
            - paragraph [ref=e817]: Vous pouvez déclarer un sinistre directement depuis votre espace client (Mon Espace AMV) sur le site amv.fr. Un gestionnaire dédié s'occupe de la gestion de votre dossier.
          - generic [ref=e818] [cursor=pointer]:
            - generic [ref=e819]:
              - generic [ref=e820]: AMV propose-t-elle une assistance 0 km quad/SSV ?
              - img [ref=e821]
            - paragraph [ref=e823]: Oui, l’option Assistance 0 km est proposée dès la formule 2. Elle inclut une assistance sans franchise kilométrique, en cas de panne, accident, vol, tentative de vol, crevaison, perte de clés ou mise en fourrière, pour votre quad/SSV, le pilote et le passager.
          - generic [ref=e824] [cursor=pointer]:
            - generic [ref=e825]:
              - generic [ref=e826]: Quels équipements sont couverts par l’assurance quad/SSV AMV ?
              - img [ref=e827]
            - paragraph [ref=e829]: Dès la formule de base, AMV couvre le casque, les gants et le gilet airbag détériorié suite à un sinistre, sous conditions, dans la limite des plafonds indiqués. Avec l’Option Plus, la couverture est étendue à l’ensemble de l’équipement vestimentaire de protection du motard et aux accessoires hors-série montés sur le quad/SSV, jusqu’à 5 000 €, sous conditions.
          - link "Consulter toutes les questions fréquentes" [ref=e832] [cursor=pointer]:
            - /url: /besoin-daide/
            - img [ref=e834]
            - text: Consulter toutes les questions fréquentes
