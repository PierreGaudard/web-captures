            - heading "Quelle moto 125 peut-on assurer chez AMV ?" [level=2] [ref=e88]
            - paragraph [ref=e89]:
              - text: "AMV assure toutes les motos 125cc, quels que soient la marque et le modèle : roadster (Yamaha MT-125, Honda CB125R), sportive (Yamaha YZF-R125, Aprilia RS 125), trail ou custom, thermique ou électrique. Que vous rouliez au quotidien ou le week-end, votre"
              - link "assurance moto" [ref=e90] [cursor=pointer]:
                - /url: https://www.amv.fr/assurance/moto/
              - text: s'adapte à votre machine et à votre usage. Vous hésitez encore entre une moto et un
              - link "scooter 125cc" [ref=e91] [cursor=pointer]:
                - /url: https://www.amv.fr/assurance-scooter/assurance-scooter-125cm3/
              - text: "? Les deux se conduisent avec les mêmes permis et s'assurent avec les mêmes formules chez AMV."
            - 'heading "Moto 125 ou scooter 125 : quelles différences pour l''assurance ?" [level=2] [ref=e92]'
            - paragraph [ref=e93]: "La moto 125cc et le scooter 125cc partagent les mêmes permis et les mêmes formules d'assurance, mais pas tout à fait le même profil de risque. Le scooter, davantage utilisé en ville pour les trajets domicile-travail, stationne plus souvent sur la voie publique et circule davantage en trafic dense. La moto 125cc, souvent choisie par passion (roadster ou sportive), se conduit aussi sur route le week-end et sa valeur peut être plus élevée à cylindrée égale. Dans les deux cas, la cotisation est calculée sur le modèle, la sinistralité déclarée et le lieu de stationnement : le devis en ligne vous donne un tarif personnalisé pour votre deux-roues, moto comme scooter."
            - heading "Quel permis pour conduire une moto 125 ?" [level=2] [ref=e94]
            - paragraph [ref=e95]:
              - text: Pour conduire une moto 125cc (cylindrée maximale de 125cc et puissance limitée à 11 kW), vous devez être titulaire du permis de conduire A1 (accessible dès 16 ans), du permis A2 ou du permis A. Les automobilistes peuvent aussi conduire une 125cc avec le permis B détenu depuis au moins 2 ans, après une formation de 7 heures. Détenteur du permis A2 ? Découvrez aussi notre
              - link "assurance moto permis A2" [ref=e96] [cursor=pointer]:
                - /url: https://www.amv.fr/assurance-moto/assurance-moto-permis-a2/
              - text: ", adaptée aux motos jusqu'à 35 kW."
            - heading "Pourquoi choisir AMV pour votre assurance moto 125 ?" [level=2] [ref=e97]
            - paragraph [ref=e98]: "AMV, leader de l'assurance deux-roues en France, a plus d'1 million d'assurés. Avec une note de 4,7/5 via Avis Vérifiés, AMV est recommandé par ses assurés (9 sur 10). En tant qu'assureur spécialiste des motards depuis 1974, AMV connaît les besoins spécifiques des conducteurs de 125cc : trajets urbains, stationnement en extérieur, équipement sollicité au quotidien."
            - heading "Un accompagnement personnalisé" [level=3] [ref=e99]
            - paragraph [ref=e100]: Plus de 350 conseillers basés à Bordeaux vous répondent par téléphone ou en ligne, et leur accompagnement couvre toute la vie du contrat. En cas de sinistre, un conseiller dédié prend en charge votre dossier d'indemnisation. Vous gérez votre contrat en toute autonomie depuis votre espace client Mon Espace AMV, simple et sécurisé.
            - heading "Une souscription simple et rapide" [level=3] [ref=e101]
            - paragraph [ref=e102]: Pour souscrire, munissez-vous de votre permis de conduire et de votre relevé d'information, renseignez les informations sur votre moto 125cc (marque, modèle, année) et votre profil pour obtenir votre devis en ligne en quelques minutes. Vous pouvez alors comparer les formules et choisir celle qui vous correspond. Si le prix vous convient, finalisez la souscription en quelques clics et recevez votre attestation d'assurance par e-mail.
        - img "assurance-moto-125cm" [ref=e103]
      - generic [ref=e105]:
        - generic [ref=e106]:
          - heading "AMV Moto dévoile les secrets des 125cm³" [level=2] [ref=e107]
          - paragraph [ref=e108]
          - paragraph [ref=e109]: AMV Moto vous invite à découvrir l'univers des 125cm³, un segment emblématique qui séduit autant les jeunes conducteurs que les motards aguerris.
          - paragraph [ref=e110]: Pour les novices, la 125cm³ représente le premier pas vers l'aventure sur deux roues, synonyme d'indépendance et de premières sensations fortes. Pour les passionnés aguerris, elle évoque la nostalgie de compétitions mémorables.
          - paragraph [ref=e111]
          - paragraph [ref=e112]: La Yamaha DTMX 125, lancée en 1977, reste un modèle de référence pour ceux qui l'ont connue. Avec son design sobre et élégant, elle est devenue la moto des jeunes à la recherche d'un véhicule rebelle. Honda a suivi cette tendance en introduisant la 125 XLS dès 1978, marquant ainsi l'engouement pour ce segment. Au milieu des années 80, la Suzuki 125 RG Gamma a révolutionné le marché avec une des premières sportives en 125cm³, offrant légèreté et maniabilité. Elle s'est distinguée comme l'une des motos les plus attrayantes en 1985 grâce à son design sportif. L'Aprilia 125 RS, introduite en 1998, est célèbre pour avoir été le tremplin de Valentino Rossi, légende du motoGP. Ce modèle combine performance, fiabilité et un rapport poids/puissance/plaisir exceptionnel, captivant tous ceux qui la croisent.
          - paragraph [ref=e113]: Aujourd'hui, le marché du 125cm³ continue de se renouveler avec des modèles tels que le roadster Honda CB 125 R, qui brille par sa légèreté et ses innovations, et la Mash New Seventy 125, qui séduit par sa simplicité et son style rétro.
        - generic [ref=e115]:
          - heading "Conclusion sur la moto 125cm³" [level=2] [ref=e116]
          - paragraph [ref=e117]
          - paragraph [ref=e118]: Les 125cm³ restent une pierre angulaire de la culture motarde qui traverse les générations. Que l'on recherche la sensation de liberté, l'adrénaline des premières accélérations, ou que l'on souhaite simplement se remémorer les jours de gloire de ce segment, la 125cm³ a une histoire riche et diversifiée qui continue d'inspirer et de fasciner. AMV Moto accompagne avec plaisir chaque motard dans la découverte de cet univers passionnant.
