            - heading "Nos 4 formules d'assurance moto 125" [level=2] [ref=e44]
            - paragraph [ref=e45]: "AMV, spécialiste de l'assurance deux-roues, propose quatre formules adaptées à chaque moto 125cc, selon sa valeur, son usage et votre budget. Choisissez la formule qui vous correspond : dès le premier niveau de couverture, vous bénéficiez de la responsabilité civile, d'une assistance juridique et d'une protection de vos équipements (casque, gants, gilet airbag) en cas de sinistre. Comparez les différentes formules et options et obtenez votre devis en ligne en quelques clics, sans engagement."
            - heading "Formule Responsabilité civile" [level=3] [ref=e46]
            - paragraph [ref=e47]: "La formule de base, l'assurance au tiers, couvre les dommages causés aux tiers lors d'un sinistre responsable (dommages corporels illimités et dommages matériels jusqu'à 100 millions d'euros), inclut une assistance juridique et garantit vos équipements de protection : casque, gants et gilet airbag. La responsabilité civile est la garantie minimum pour circuler en toute légalité. Cette formule est particulièrement adaptée aux motos 125cc de faible valeur marchande, pour lesquelles une couverture étendue pourrait ne pas être rentable."
            - heading "Formule Vol / Incendie" [level=3] [ref=e48]
            - paragraph [ref=e49]: "En complément, cette formule couvre le vol, la tentative de vol et l'incendie, avec une indemnisation à la valeur de remplacement à dire d'expert ou à la valeur à neuf durant les 6 premiers mois. Elle est particulièrement adaptée si vous stationnez majoritairement votre 125cc en extérieur ou sur la voie publique, où le risque de vol est plus élevé. Bon à savoir : chez AMV, le gravage de votre deux-roues divise la franchise vol par deux."
            - heading "Formule Dommages collision" [level=3] [ref=e50]
            - paragraph [ref=e51]: En cas de collision avec un tiers identifié, les dommages causés à votre moto 125cc sont pris en charge et indemnisés à la valeur de remplacement à dire d'expert ou à la valeur à neuf, sous déduction, en cas de sinistre responsable, de la franchise prévue au contrat. Cette formule est adaptée aux trajets quotidiens en circulation dense, où le risque de collision est le plus élevé.
            - heading "Formule Tous risques" [level=3] [ref=e52]
            - paragraph [ref=e53]: La formule la plus complète pour protéger votre moto 125cc. Elle couvre les dommages subis par votre véhicule, quelles que soient les circonstances, y compris en cas de sinistre responsable ou de vandalisme. L'indemnisation est effectuée selon les conditions prévues au contrat d'assurance, après déduction de la franchise applicable. Cette formule est particulièrement recommandée pour les motos 125cc neuves, récentes ou financées à crédit.
            - heading "Les options pour personnaliser votre contrat" [level=2] [ref=e54]
            - paragraph [ref=e55]: Chaque formule peut être complétée par des options afin d'adapter votre couverture à vos besoins, à votre usage et aux caractéristiques de votre moto 125cc.
            - heading "Individuelle pilote" [level=3] [ref=e56]
            - paragraph [ref=e57]: Cette option vous verse un capital pouvant atteindre 800 000 euros en cas d'invalidité permanente, ou à vos ayants droit en cas de décès, même lors d'un accident responsable. Cette garantie corporelle est précieuse au quotidien, la 125cc étant souvent utilisée en ville, où les chutes sont plus fréquentes.
            - heading "Assistance 0 km" [level=3] [ref=e58]
            - paragraph [ref=e59]: "Assistance sans franchise kilométrique, 24h/24 et 7j/7 : panne, accident, vol ou tentative de vol, crevaison, perte ou casse de clés, fourrière. Votre moto est dépannée ou remorquée, et vous êtes rapatrié avec votre passager, en France et dans la plupart des pays d'Europe."
            - heading "Option plus" [level=3] [ref=e60]
            - paragraph [ref=e61]: Étend la couverture aux accessoires hors-série et à l'équipement du conducteur (équipement vestimentaire moto), à concurrence de 5 000 euros, et prolonge la valeur à neuf jusqu'à 18 mois. Intéressante pour les 125cc équipées (top case, sacoches, échappement).
            - heading "Le détail des garanties de votre assurance moto 125" [level=2] [ref=e62]
            - paragraph [ref=e63]: Quelle que soit la formule choisie, elle repose sur un socle de garanties solides. Les plafonds d'indemnisation sont détaillés ci-dessous.
