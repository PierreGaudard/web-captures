      - generic [ref=e141]:
        - generic [ref=e142]: Nouveau contenu optimise
        - heading "Questions fréquentes sur l'assurance moto 125" [level=2] [ref=e143]
        - heading "Quelle assurance choisir pour une moto 125 ?" [level=3] [ref=e144]
        - paragraph [ref=e145]: Le choix dépend de la valeur de votre moto 125cc et de votre budget. Pour un modèle de faible valeur, la formule Responsabilité civile peut suffire. Pour une 125cc neuve ou financée à crédit, la formule Tous risques offre la meilleure protection. Entre les deux, la formule Vol / Incendie peut être pertinente si votre moto est stationnée majoritairement en extérieur.
        - heading "Combien coûte une assurance moto 125 ?" [level=3] [ref=e146]
        - paragraph [ref=e147]: Le prix dépend du modèle de la moto 125cc, de la sinistralité déclarée du conducteur, de l'adresse du domicile ou du lieu de stationnement, et du niveau de couverture choisi. Chez AMV, un devis personnalisé en ligne vous donne un tarif adapté en quelques clics.
        - heading "Peut-on assurer une moto 125 avec un permis B ?" [level=3] [ref=e148]
        - paragraph [ref=e149]: Oui. Avec un permis B détenu depuis au moins 2 ans et une formation de 7 heures, vous pouvez conduire et assurer une moto 125cc. Munissez-vous de votre permis, de votre attestation de formation et de votre relevé d'information pour obtenir votre devis.
        - heading "L'assurance moto 125 est-elle plus chère pour un jeune conducteur ?" [level=3] [ref=e150]
        - paragraph [ref=e151]:
          - text: La 125cc est souvent la première moto des jeunes conducteurs. Une surprime peut atteindre jusqu'à 100 % la première année ; en l'absence de sinistre responsable, elle est limitée à 50 % la deuxième année, puis 25 % la troisième. Retrouvez le détail sur notre page
          - link "assurance moto jeune conducteur" [ref=e152] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-moto/assurance-moto-jeune-conducteur/
          - text: .
        - heading "Une moto 125 doit-elle être assurée même si elle ne roule pas ?" [level=3] [ref=e153]
        - paragraph [ref=e154]: Oui. Tout véhicule terrestre à moteur doit être assuré en responsabilité civile, même stationné dans un garage et même s'il ne circule pas. Le défaut d'assurance est passible d'une amende pouvant aller jusqu'à 3 750 euros.
        - heading "Quels équipements sont couverts par l'assurance moto 125 AMV ?" [level=3] [ref=e155]
        - paragraph [ref=e156]: "Dès la première formule : casque (jusqu'à 250 euros), gants (jusqu'à 70 euros) et gilet airbag (jusqu'à 500 euros) en cas de sinistre. Avec l'Option plus, la couverture s'étend à l'équipement vestimentaire moto et aux accessoires hors-série, jusqu'à 5 000 euros."
        - heading "Comment résilier son assurance moto 125 ?" [level=3] [ref=e157]
        - paragraph [ref=e158]: Après la première année, vous pouvez résilier à tout moment grâce à la loi Hamon, sans frais ni pénalité. Un conseiller AMV vous accompagne dans la démarche et peut effectuer les formalités auprès de votre ancien assureur, que ce soit une compagnie ou une mutuelle.
      - generic [ref=e159]:
