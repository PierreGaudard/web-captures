            - heading "Quel TMAX peut-on assurer chez AMV ?" [level=2] [ref=e93]
            - paragraph [ref=e94]: "Depuis son lancement en 2001, le TMAX incarne l'évolution du maxi-scooter : à chaque génération, Yamaha a fait progresser la puissance, le design et les innovations embarquées (contrôle de traction, modes de conduite, connectivité). AMV assure toutes les générations et toutes les séries :"
            - list [ref=e95]:
              - listitem [ref=e96]: "✓ Yamaha XP 500 TMAX : le modèle d'origine, qui a créé la catégorie du maxi-scooter sportif ;"
              - listitem [ref=e97]: ✓ TMAX 530, y compris les versions SX et DX ;
              - listitem [ref=e98]: "✓ TMAX Iron Max : la série spéciale au design premium, très recherchée en occasion ;"
              - listitem [ref=e99]: ✓ TMAX 560 et sa version haut de gamme Tech Max, la génération actuelle.
            - paragraph [ref=e100]:
              - text: Neuf ou d'occasion, votre
              - link "assurance scooter" [ref=e101] [cursor=pointer]:
                - /url: https://www.amv.fr/assurance/scooter/
              - text: "s'adapte à votre modèle et à votre usage. AMV assure également tous les autres modèles de la marque, du XMAX 125 aux roadsters MT-07 et MT-09, en passant par les FZ6 et FZS Fazer d'occasion : retrouvez-les sur notre page"
              - link "assurance moto Yamaha" [ref=e102] [cursor=pointer]:
