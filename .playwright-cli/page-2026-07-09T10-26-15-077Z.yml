        - generic [ref=e145]: Nouveau contenu optimise
        - heading "Questions fréquentes sur l'assurance TMAX" [level=2] [ref=e146]
        - heading "Quelle est la meilleure assurance pour un TMAX ?" [level=3] [ref=e147]
        - paragraph [ref=e148]: La meilleure assurance pour un TMAX dépend de la valeur de votre maxi-scooter et de votre budget. Si votre TMAX stationne régulièrement sur la voie publique, la formule Vol / Incendie peut constituer un socle pertinent, et la formule Tous risques offre la meilleure protection pour un modèle neuf, récent ou financé à crédit.
        - heading "Combien coûte une assurance TMAX ?" [level=3] [ref=e149]
        - paragraph [ref=e150]: La cotisation dépend du modèle et de la génération du TMAX, de la sinistralité déclarée du conducteur, de l'adresse du domicile ou du lieu de stationnement, et du niveau de couverture choisi. Chez AMV, un devis personnalisé en ligne vous donne un tarif adapté en quelques clics.
        - heading "Quel permis faut-il pour conduire un TMAX ?" [level=3] [ref=e151]
        - paragraph [ref=e152]: "Le TMAX 560 développe une puissance qui le rend accessible avec le permis A2 (dès 18 ans) comme avec le permis A. Le permis B, même avec la formation de 7 heures, ne suffit pas : cette formation ne permet de conduire que des deux-roues de 125cc maximum."
        - heading "Un jeune conducteur peut-il assurer un TMAX ?" [level=3] [ref=e153]
        - paragraph [ref=e154]: Oui, dès 18 ans avec le permis adapté. Une surprime jeune conducteur peut atteindre jusqu'à 100 % la première année ; en l'absence de sinistre responsable, elle est limitée à 50 % la deuxième année, puis 25 % la troisième. Le niveau de couverture et le modèle choisis influencent aussi la prime.
        - heading "L'assurance TMAX couvre-t-elle le vol sans effraction ?" [level=3] [ref=e155]
        - paragraph [ref=e156]: Les conditions d'indemnisation en cas de vol, notamment l'exigence de traces d'effraction pour une tentative de vol, sont détaillées au contrat. Dans tous les cas, utilisez systématiquement un antivol homologué et déclarez tout vol rapidement aux forces de l'ordre, puis à AMV depuis Mon Espace AMV.
        - heading "Comment résilier son assurance TMAX actuelle ?" [level=3] [ref=e157]
        - paragraph [ref=e158]: Après la première année, la loi Hamon vous permet de résilier à tout moment, sans frais ni pénalité. Demandez d'abord votre devis chez AMV, puis mandatez AMV pour effectuer les démarches de résiliation à votre place auprès de votre assureur actuel.
