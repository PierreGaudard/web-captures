              - generic [ref=e47]: ✓
              - generic [ref=e48]: l'assurance TMAX chez AMV couvre toutes les générations du maxi-scooter Yamaha (XP 500, TMAX 530, TMAX 560, séries Iron Max et Tech Max) avec 4 formules, du tiers au tous risques. Si votre TMAX stationne sur la voie publique, où le risque de vol est plus élevé, la garantie Vol / Incendie est particulièrement pertinente. Devis en ligne gratuit en quelques minutes.
            - heading "Nos 4 formules d'assurance TMAX" [level=2] [ref=e49]
            - paragraph [ref=e50]: "Le TMAX Yamaha est la référence des maxi-scooters : puissance, confort et design en font l'un des deux-roues les plus prisés de France. AMV, spécialiste de l'assurance deux-roues, propose quatre formules d'assurance adaptées à chaque TMAX, selon sa valeur, son usage et votre budget. Comparez les différentes formules et options et obtenez votre devis en ligne en quelques clics, sans engagement."
            - heading "Formule Responsabilité civile" [level=3] [ref=e51]
            - paragraph [ref=e52]: "La formule de base, au tiers, couvre les dommages causés aux tiers lors d'un sinistre responsable (dommages corporels illimités et dommages matériels jusqu'à 100 millions d'euros), inclut une assistance juridique et garantit vos équipements de protection : casque, gants et gilet airbag. La responsabilité civile est la garantie obligatoire pour circuler en toute légalité. Elle peut convenir aux TMAX de faible valeur marchande."
            - heading "Formule Vol / Incendie" [level=3] [ref=e53]
            - paragraph [ref=e54]: Cette formule couvre le vol, la tentative de vol et l'incendie, avec une indemnisation à la valeur de remplacement à dire d'expert ou à la valeur à neuf durant les 6 premiers mois. Elle est particulièrement pertinente si votre TMAX stationne majoritairement en extérieur ou sur la voie publique, où le risque de vol est plus élevé.
            - heading "Formule Dommages collision" [level=3] [ref=e55]
            - paragraph [ref=e56]: En cas de collision avec un tiers identifié, les dommages causés à votre maxi-scooter sont pris en charge et indemnisés à la valeur de remplacement à dire d'expert ou à la valeur à neuf, sous déduction, en cas de sinistre responsable, de la franchise prévue au contrat. Adaptée à un usage quotidien en circulation dense.
            - heading "Formule Tous risques" [level=3] [ref=e57]
            - paragraph [ref=e58]: La formule la plus complète pour protéger votre TMAX. Elle couvre les dommages subis par votre véhicule, quelles que soient les circonstances, y compris en cas de sinistre responsable ou de vandalisme. L'indemnisation est effectuée selon les conditions prévues au contrat, après déduction de la franchise applicable. Compte tenu du prix d'un TMAX neuf, c'est la formule particulièrement recommandée pour un modèle récent ou financé à crédit.
            - heading "Les options pour personnaliser votre contrat" [level=2] [ref=e59]
            - paragraph [ref=e60]: Chaque formule peut être complétée par des options afin d'adapter votre couverture à vos besoins et aux caractéristiques de votre TMAX.
            - heading "Individuelle pilote" [level=3] [ref=e61]
            - paragraph [ref=e62]: Cette option vous verse un capital pouvant atteindre 800 000 euros en cas d'invalidité permanente, ou à vos ayants droit en cas de décès, même lors d'un accident responsable. Pour un maxi-scooter utilisé au quotidien, cette option est précieuse.
            - heading "Assistance 0 km" [level=3] [ref=e63]
            - paragraph [ref=e64]: "Assistance sans franchise kilométrique, 24h/24 et 7j/7 : panne, accident, vol ou tentative de vol, crevaison, perte ou casse de clés, fourrière. Votre TMAX est dépanné ou remorqué, et vous êtes rapatrié avec votre passager, en France et dans la plupart des pays d'Europe."
            - heading "Option plus" [level=3] [ref=e65]
            - paragraph [ref=e66]: Étend la couverture aux accessoires hors-série et à l'équipement vestimentaire moto, à concurrence de 5 000 euros, et prolonge la valeur à neuf jusqu'à 18 mois. Intéressante pour les TMAX équipés (top case, sacoches, échappement).
            - heading "Le détail des garanties de votre assurance TMAX" [level=2] [ref=e67]
            - paragraph [ref=e68]: Quelle que soit la formule choisie, elle repose sur un socle de garanties solides. Les plafonds d'indemnisation sont détaillés ci-dessous.
