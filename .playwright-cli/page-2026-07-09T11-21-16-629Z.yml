          - heading "Assurance CFMOTO" [level=1] [ref=e38]
        - img "assurance-cfmoto" [ref=e39]
      - generic [ref=e41]:
        - paragraph [ref=e43]: Pour la saison 2024, CFMOTO prend un nouveau virage dans le monde de la compétition motocycliste. Après avoir été associé au team PruestelGP en 2022 et 2023, la marque chinoise se tourne vers de nouveaux horizons en s'engageant aux côtés du team Aspar en Moto2 et Moto3. Un partenariat qui ne vise que le titre, ni plus ni moins !
        - generic [ref=e44]:
          - 'heading "CFMOTO et Aspar : Une alliance prometteuse pour dompter les circuits Moto2 et Moto3 en 2024" [level=4] [ref=e45]':
            - strong [ref=e46]: "CFMOTO et Aspar : Une alliance prometteuse pour dompter les circuits Moto2 et Moto3 en 2024"
          - paragraph [ref=e47]
          - paragraph [ref=e48]: Il est indéniable que CFMOTO a saisi toute l'importance d'une présence active dans les championnats du monde pour sa réputation et son image de marque, même si elle ne propose pas de motos sportives dans sa gamme et n'a pas de prototypes pour les Grands Prix. Jusqu'à l'année précédente, CFMOTO était associé aux KTM de Joel Kelso et Xavier Artigas en Moto3, mais pour 2024, la marque franchit une nouvelle étape en rejoignant la prestigieuse écurie de Jorge Martinez.
          - paragraph [ref=e49]
          - paragraph [ref=e50]: Ce nouveau partenariat offre à CFMOTO l'opportunité d'être représenté dans deux catégories majeures, avec de réelles chances de victoire. C'est un pas en avant significatif qui laisse entrevoir la possibilité à terme de voir CFMOTO lancer sa propre équipe en Grand Prix.
          - paragraph [ref=e51]
          - paragraph [ref=e52]: "Jorge Martinez, également connu sous le nom d'Aspar, exprime clairement les ambitions communes pour la saison à venir : remporter les titres en Moto3 et Moto2. Pour lui, cette collaboration avec CFMOTO est une motivation supplémentaire, et il se dit très heureux de pouvoir compter sur leur soutien. Il promet de tout mettre en œuvre pour rendre fier CFMOTO et lui offrir de nombreuses victoires tout au long de la saison."
          - paragraph [ref=e53]
          - paragraph [ref=e54]: Du côté de CFMOTO Racing, Su Zhen, le responsable du développement, partage cet enthousiasme. Il est convaincu que le partenariat avec Aspar propulsera CFMOTO Racing vers de nouveaux sommets. Il anticipe déjà des victoires et des podiums à foison et envisage même des possibilités de coopération au-delà du paddock pour renforcer davantage cette collaboration fructueuse.
          - paragraph [ref=e55]
          - paragraph [ref=e56]: En somme, l'alliance entre CFMOTO et Aspar pour la saison 2024 s'annonce prometteuse. Les deux entités partagent des objectifs communs et une détermination sans faille à conquérir les circuits et à écrire une nouvelle page d'histoire dans le monde de la compétition motocycliste.
        - generic [ref=e57]:
          - heading "Conclusion sur CFMOTO" [level=4] [ref=e58]:
            - strong [ref=e59]: Conclusion sur CFMOTO
          - paragraph [ref=e60]
          - paragraph [ref=e61]: En conclusion, l'association entre CFMOTO et Aspar pour la saison 2024 marque un tournant décisif dans le monde de la compétition motocycliste. Avec des objectifs ambitieux et une détermination sans faille, ces deux partenaires s'engagent à conquérir les circuits de Moto2 et Moto3. Portés par une vision commune et une volonté de succès, CFMOTO et Aspar incarnent l'esprit de compétition et la recherche incessante de l'excellence. Leur collaboration promet non seulement des victoires sur la piste, mais également une expansion des opportunités de coopération au-delà du monde des Grands Prix. Ensemble, ils tracent la voie vers un avenir radieux, où l'innovation, la passion et le talent se conjuguent pour repousser les limites de la performance motocycliste.
