            - paragraph [ref=e46]: Vous roulez en scooter Kymco et recherchez un contrat assurance adapté à votre modèle et à votre budget ? AMV, assureur spécialiste du deux-roues depuis plus de 50 ans, propose des formules sur mesure pour assurer votre scooter Kymco. Réalisez votre devis gratuit en ligne, comparez les formules et bénéficiez d'une couverture immédiate, sous réserve de certaines conditions.
