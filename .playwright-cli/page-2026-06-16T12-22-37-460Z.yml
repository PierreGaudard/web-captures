      - generic [ref=e98]:
        - generic [ref=e99]: Nouveau contenu optimisé
        - generic [ref=e100]:
          - generic [ref=e101]: H2
          - text: Nos formules d'assurance scooter Kymco
        - paragraph [ref=e102]: AMV propose quatre formules pour couvrir votre Kymco selon votre profil, votre budget et la valeur de votre scooter. Chaque formule peut être complétée par des options à la carte.
        - generic [ref=e103]:
          - generic [ref=e104]: H3
          - text: Formule Responsabilité civile (au tiers)
        - paragraph [ref=e105]: "La formule de base couvre la responsabilité civile (dommages matériels et corporels causés à autrui), l'assistance juridique et la protection de vos équipements essentiels : casque jusqu'à 250 euros, gants jusqu'à 70 euros et gilet airbag jusqu'à 500 euros. C'est la formule au tiers la plus accessible pour rouler en toute légalité, idéale pour réaliser des économies sur un Kymco ancien ou de faible valeur."
        - generic [ref=e106]:
          - generic [ref=e107]: H3
          - text: Formule Vol / Incendie
        - paragraph [ref=e108]: En complément du socle de la première formule, cette couverture prend en charge les dommages de votre Kymco en cas de vol, de tentative de vol ou d'incendie. Une protection particulièrement utile pour un scooter récent stationné en extérieur, le vol étant fréquent en milieu urbain.
        - generic [ref=e109]:
          - generic [ref=e110]: H3
          - text: Formule Dommages collision
        - paragraph [ref=e111]: Cette formule assure la prise en charge des dommages subis par votre Kymco lors d'une collision avec un tiers identifié, remboursés à la valeur de remplacement. Elle convient aux scooters de valeur intermédiaire.
        - generic [ref=e112]:
          - generic [ref=e113]: H3
          - text: Formule Tous risques
        - paragraph [ref=e114]: La formule Tous risques offre une couverture complète des dommages subis par votre Kymco, avec ou sans tiers identifié, y compris en cas de sinistre responsable. C'est la solution recommandée pour un Kymco neuf, récent ou de forte valeur comme un maxi-scooter.
        - generic [ref=e115]:
          - generic [ref=e116]: H2
          - text: Les options pour personnaliser votre contrat
        - paragraph [ref=e117]: Chaque formule se complète par des options pour ajuster votre couverture à votre pratique et à votre véhicule.
        - generic [ref=e118]:
          - generic [ref=e119]: H3
          - text: Individuelle pilote
        - paragraph [ref=e120]: L'option Individuelle pilote verse un capital en cas de décès ou d'invalidité permanente consécutifs à un accident, même responsable. Elle protège le conducteur, là où l'assurance de base couvre les tiers.
        - generic [ref=e121]:
          - generic [ref=e122]: H3
          - text: Assistance 0 km
        - paragraph [ref=e123]: L'assistance 0 km intervient sans franchise kilométrique, 24h/24 et 7j/7, même devant chez vous, en cas de panne, d'accident, de vol, de crevaison, de perte de clés ou d'enlèvement par la fourrière. Dépannage, remorquage et rapatriement sont pris en charge pour vous, votre Kymco et votre passager, en France métropolitaine et dans la plupart des pays d'Europe.
        - generic [ref=e124]:
          - generic [ref=e125]: H3
          - text: Option plus
        - paragraph [ref=e126]: L'Option plus étend la couverture à l'équipement vestimentaire de protection et aux accessoires hors-série montés sur votre Kymco (top case, pare-brise…), à concurrence de 5 000 euros, et prolonge la garantie valeur à neuf jusqu'à 18 mois.
        - generic [ref=e127]:
          - generic [ref=e128]: H2
          - text: Découvrez l'assurance pour les modèles Kymco
        - paragraph [ref=e129]: "Marque taïwanaise reconnue, Kymco propose une gamme de scooters complète : modèles urbains et 50 cm³ (Agility, Like), scooters GT et 125 cm³ (People, X-Town), maxi-scooters de forte cylindrée (Downtown, AK 550, CV3). AMV assure l'ensemble de la gamme Kymco, du modèle accessible dès le permis AM (ex-BSR) aux scooters puissants nécessitant un permis A1 ou A2. Si vous roulez aussi en moto ou possédez plusieurs deux-roues, AMV peut regrouper vos contrats pour en simplifier la gestion."
        - generic [ref=e130]:
          - generic [ref=e131]: H2
          - text: Pourquoi choisir AMV pour assurer votre Kymco ?
        - paragraph [ref=e132]: "Leader et assureur spécialiste de l'assurance moto et scooter en France depuis plus de 50 ans, AMV assure plus d'un million de motards et scootéristes, et affiche une note de satisfaction de 4,7/5 selon Avis Vérifiés. Fondée en 1974 par un passionné, l'entreprise connaît les spécificités de chaque marque et de chaque modèle, du scooter urbain au maxi-scooter. Cette expertise deux-roues couvre des situations que les assureurs généralistes ignorent : vol de casque, équipement endommagé, panne en pleine circulation. Plus de 350 conseillers basés à Bordeaux vous accompagnent par téléphone, par e-mail ou via votre Espace Client, avec un interlocuteur dédié en cas de sinistre."
        - generic [ref=e133]:
          - generic [ref=e134]: H2
          - text: Comment obtenir votre devis d'assurance scooter Kymco ?
        - paragraph [ref=e135]: Obtenir votre devis d'assurance scooter Kymco en ligne se fait en quelques étapes. Renseignez les informations sur votre Kymco (modèle, cylindrée, année) et votre profil (expérience, bonus-malus, région) pour recevoir un tarif personnalisé en quelques minutes. Si le prix vous convient, vous souscrivez en quelques clics et recevez votre attestation par mail. Vous gérez ensuite votre contrat, vos garanties et vos sinistres depuis Mon Espace AMV, à tout moment.
      - generic [ref=e136]:
        - generic [ref=e137]: Nouveau contenu optimisé
        - generic [ref=e138]:
          - generic [ref=e139]: H2
          - text: Questions fréquentes sur l'assurance scooter Kymco
        - generic [ref=e140]:
          - generic [ref=e141]: H3
          - text: Quelle assurance choisir pour un scooter Kymco ?
        - paragraph [ref=e142]: Le choix dépend de la valeur de votre Kymco, de votre usage et de votre budget. Une formule Responsabilité civile peut suffire pour un Kymco ancien ou un 50 cm³ d'occasion. Pour un scooter récent ou un maxi-scooter de valeur, la formule Tous risques offre la meilleure protection. En ville, la formule Vol / Incendie mérite d'être envisagée.
        - generic [ref=e143]:
          - generic [ref=e144]: H3
          - text: Combien coûte l'assurance d'un scooter Kymco ?
        - paragraph [ref=e145]: Le prix dépend du modèle et de la cylindrée, de votre profil de conducteur, de la zone de stationnement et du niveau de couverture choisi. Un 50 cm³ au tiers coûte moins cher qu'un maxi-scooter en Tous risques. Un devis en ligne AMV, gratuit et sans engagement, vous donne un tarif adapté en quelques minutes et vous permet de comparer les garanties.
        - generic [ref=e146]:
          - generic [ref=e147]: H3
          - text: AMV assure-t-il tous les modèles Kymco ?
        - paragraph [ref=e148]: "Oui. AMV assure l'ensemble de la gamme Kymco : scooters 50 cm³, 125 cm³ et maxi-scooters de forte cylindrée, du modèle urbain au GT. Chaque deux-roues Kymco bénéficie d'une formule adaptée à ses caractéristiques et à votre profil de conducteur."
        - generic [ref=e149]:
          - generic [ref=e150]: H3
          - text: Peut-on assurer un Kymco 50 cm³ avec le permis AM (ex-BSR) ?
        - paragraph [ref=e151]: Oui. Les scooters Kymco 50 cm³ sont accessibles dès 14 ans avec le permis AM (ex-BSR). AMV assure les jeunes conducteurs et propose des formules adaptées, avec les garanties essentielles pour une première assurance deux-roues.
      - generic [ref=e152]:
        - heading "Questions fréquentes" [level=2] [ref=e153]
        - generic [ref=e154]:
          - generic [ref=e155] [cursor=pointer]:
            - generic [ref=e156]:
              - generic [ref=e157]: Quels sont les avantages d'acheter un scooter Kymco par rapport à d'autres marques?
              - img [ref=e158]
            - paragraph [ref=e160]: Kymco est reconnu pour offrir un excellent rapport qualité-prix. Les scooters Kymco sont réputés pour leur fiabilité, leur durabilité, et leur conception innovante. La marque propose une large gamme de modèles adaptés à divers besoins, que ce soit pour un usage urbain quotidien ou des déplacements de plus longue distance. De plus, Kymco bénéficie d'un réseau de distribution et de service après-vente bien établi, garantissant un entretien facile et un accès aux pièces de rechange.
          - generic [ref=e161] [cursor=pointer]:
            - generic [ref=e162]:
              - generic [ref=e163]: Pourquoi choisir un scooter électrique Kymco plutôt qu'un modèle à essence ?
              - img [ref=e164]
            - paragraph [ref=e166]: Les scooters électriques Kymco offrent plusieurs avantages par rapport aux modèles à essence, principalement une réduction des coûts liés à l'énergie électrique et l'entretien. Ils sont également plus silencieux et respectueux de l'environnement, avec zéro émission de CO2. De plus, Kymco propose des modèles électriques avec des fonctionnalités innovantes, comme des batteries amovibles et des systèmes de gestion d'énergie intelligente, ce qui rend l'utilisation encore plus pratique et économique.
          - generic [ref=e167] [cursor=pointer]:
            - generic [ref=e168]:
              - generic [ref=e169]: Quels sont les principaux modèles de scooters proposés par Kymco et à qui s'adressent-ils ?
              - img [ref=e170]
            - paragraph [ref=e172]: Kymco propose une large gamme de scooters, allant des modèles urbains compacts aux scooters de plus grande cylindrée pour les trajets plus longs. Par exemple, le Kymco Agility est idéal pour les citadins à la recherche d'un scooter économique et maniable, tandis que le Kymco Xciting est un maxi-scooter conçu pour ceux qui recherchent confort et performance sur de plus longues distances. Kymco propose également des modèles électriques, comme le Kymco Like EV, pour les utilisateurs soucieux de l'environnement.
        - generic [ref=e173]:
          - generic [ref=e174] [cursor=pointer]:
            - generic [ref=e175]:
              - generic [ref=e176]: Quelle assurance scooter choisir ?
              - img [ref=e177]
            - paragraph [ref=e179]: Pour choisir avec soin votre assurance scooter, il est primordial de comparer les tarifs, les garanties et les franchises proposées. AMV, assureur spécialisé dans le domaine de la moto, est une option à prendre en sérieuse considération. Fort de son expertise, AMV offre des solutions adaptées aux besoins spécifiques des conducteurs de scooter, assurant ainsi une couverture complète et fiable pour leurs véhicules tout-terrain. Grâce à son expertise du secteur, AMV peut offrir des services sur mesure et des conseils avisés, assurant la tranquillité d'esprit des motocyclistes et passionnés de tout-terrain tout au long de leurs aventures sur la route.
          - generic [ref=e180] [cursor=pointer]:
            - generic [ref=e181]:
              - generic [ref=e182]: Quel est le prix d'une assurance scooter ?
              - img [ref=e183]
            - paragraph [ref=e185]: Le coût d'une assurance scooter chez AMV intègre plusieurs facteurs tels que le modèle du scooter, l'expérience du conducteur (permis, sinistres, bonus), le lieu de stationnement habituel et le niveau de garanties désiré. Chez AMV, nous offrons des tarifs compétitifs adaptés à chaque profil de conducteur et à chaque type de scooter. Nos conseillers spécialisés sont là pour vous aider à choisir la couverture qui répond le mieux à vos besoins et à votre budget. N'hésitez pas à nous contacter pour obtenir un devis personnalisé et découvrez comment nous pouvons protéger au mieux votre scooter. Chez AMV, nous sommes fiers d'accompagner les conducteurs de scooter depuis près de 50 ans et de leur proposer une assurance sur mesure pour rouler en toute sérénité.
          - generic [ref=e186] [cursor=pointer]:
            - generic [ref=e187]:
              - generic [ref=e188]: Quelle formule assurance scooter choisir ?
              - img [ref=e189]
            - paragraph [ref=e191]: Le choix de la formule d'assurance scooter dépend entièrement de vos besoins spécifiques ainsi que de votre budget. Si vous possédez un scooter récent, il est fortement recommandé de souscrire à une garantie dommages tous risques, cela vous permettra de couvrir les frais de réparation en cas d'accident responsable. AMV, en tant qu'assureur spécialisé dans l'assurance scooter, propose différentes garanties et options adaptées à chaque profil. N'hésitez pas à réaliser un devis sur amv.fr ou nous contacter pour obtenir des informations détaillées sur les formules d'assurance quad proposées afin de trouver celle qui répond le mieux à vos besoins personnels
          - generic [ref=e192] [cursor=pointer]:
            - generic [ref=e193]:
              - generic [ref=e194]: Comment obtenir un devis d'assurance scooter ?
              - img [ref=e195]
            - paragraph [ref=e197]: Pour obtenir un devis d'assurance scooter rapidement, AMV est votre partenaire de confiance. Spécialiste de l'assurance quad depuis 50 ans, AMV propose des solutions adaptées à vos besoins. Rendez-vous sur amv.fr et complétez simplement notre formulaire pour découvrir votre tarif en seulement 3 minutes. Faites confiance à AMV et roulez en toute sérénité avec la protection dont vous avez besoin.
