        - paragraph [ref=e86]
        - paragraph [ref=e87]: En cas de sinistre, AMV met à votre disposition un service d'assistance réactif, disponible 24 heures sur 24 et 7 jours sur 7, si vous avez opté pour cette option. Vous pouvez ainsi compter sur une assistance en toutes circonstances, qu'il s'agisse d'un accident, d'un vol ou d'une panne.
        - paragraph [ref=e88]
        - paragraph [ref=e89]: Experts de l'assurance moto, les conseillers AMV sont des passionnés de deux-roues, appréhendant ainsi aisément vos besoins spécifiques en tant que pilote de scooter. Ils sauront vous accompagner et vous conseiller au mieux tout au long de votre contrat.
