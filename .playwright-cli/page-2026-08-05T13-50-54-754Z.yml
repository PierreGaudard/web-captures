        - heading "Assurance moto Kove" [level=1] [ref=e38]
      - generic [ref=e39]:
        - paragraph [ref=e40]: AMV, spécialiste de l'assurance deux-roues, assure les motos Kove, de la 450 Rally homologuée route aux trails bicylindres 800X, en passant par la 510X et le roadster NK 125R. Un seul contrat, jusqu'à quatre formules, des options au choix. Le casque, les gants et le gilet airbag sont couverts dès la première formule, et le devis en ligne ne prend que quelques minutes.
        - list [ref=e41]:
          - listitem [ref=e42]: "La gamme Kove est assurable : 450 Rally, trails 800X, 510X et roadster NK 125R."
          - listitem [ref=e43]: Jusqu'à quatre formules au choix, selon les modèles, de la Responsabilité civile à la formule Tous risques.
          - listitem [ref=e44]: La garantie Dommages collision permet une couverture renforcée en maîtrisant votre budget.
          - listitem [ref=e45]: "Le tarif est personnalisé : modèle, cylindrée, date de première mise en circulation, lieu de stationnement, niveau de couverture et sinistralité déclarée."
          - listitem [ref=e46]: Roulage libre sur circuit autorisé, compétition jamais couverte.
        - heading "Kove, la marque chinoise venue du rallye-raid" [level=2] [ref=e47]
        - paragraph [ref=e48]: "Kove est une marque chinoise adossée au groupe industriel Summit Motor Co., qui produit aujourd'hui environ 35 000 machines par an. Elle s'est fait connaître par la compétition : sa 450 Rally, dans sa version course, a été engagée au Dakar avec une équipe de plusieurs pilotes internationaux, une trajectoire rare pour un constructeur aussi jeune. La gamme s'est ensuite élargie vers la route et l'aventure, avec les trails bicylindres 800X, la 510X et le roadster NK 125R, distribués en France depuis 2025."
        - paragraph [ref=e49]: "Des machines conçues pour l'usage intensif et le franchissement, qui s'assurent avec la même exigence : la couverture d'une Kove se choisit selon sa valeur, sa fréquence d'utilisation et votre budget, pas par défaut."
        - heading "Quels modèles Kove peut-on assurer ?" [level=2] [ref=e50]
        - paragraph [ref=e51]: "AMV assure la gamme moto Kove, du roadster NK 125R aux maxi-trails 800X. Le choix de la formule dépend ensuite surtout de la valeur de votre moto, de sa fréquence d'utilisation et de votre budget :"
        - list [ref=e52]:
          - listitem [ref=e53]: "La NK 125R, souvent utilisée en ville, stationne fréquemment sur la voie publique : la formule Vol / Incendie serait alors à envisager, et le gravage du deux-roues, associé à un antivol agréé SRA, divise la franchise vol par 2."
          - listitem [ref=e54]: "Une 800X préparée pour l'aventure reçoit sabot moteur, protections et bagagerie : l'Option Plus couvre les accessoires hors-série et le top case dans la limite de 5 000 €, et l'Assistance 0 km couvre les pannes loin de chez soi."
          - listitem [ref=e55]: Une 450 Rally qui alterne bitume et chemins reste couverte sur les voies ouvertes à la circulation publique. Le roulage libre sur circuit est autorisé, la compétition n'est jamais couverte, et une machine non homologuée ne peut recevoir qu'une formule Responsabilité civile dédiée.
        - heading "Quel permis pour conduire une Kove ?" [level=2] [ref=e56]
        - paragraph [ref=e57]: La gamme couvre les trois grands niveaux de permis moto. La NK 125R se conduit avec le permis A1, mais également avec le permis B détenu depuis au moins 2 ans, après une formation de 7 heures. La 450 Rally Standard et la 510X sont homologuées A2, sans passer par une version bridée artificiellement. Les trails 800X et leur bicylindre de 799 cm³ demandent le permis A dans leur version de puissance libre.
        - paragraph [ref=e58]: "Toute la gamme est tarifée par AMV : la NK 125R, la 450 Rally Standard, la 510 X, les trails 800 X Pro, 800 X GT et 800 X Rally, ainsi que la 350 RR et la 625 X GT. Quel que soit votre permis, la formule reste la même : AMV n'a pas de formule dédiée aux jeunes conducteurs, ce sont les mêmes garanties pour tous les assurés, et c'est la tarification qui est personnalisée."
        - heading "Les formules d'assurance moto Kove" [level=2] [ref=e59]
        - paragraph [ref=e60]: "AMV propose les formules de garanties et options adaptées à votre Kove et à l'usage que vous en faites. Un seul contrat et jusqu'à quatre formules : à vous de choisir selon la valeur de votre moto, sa fréquence d'utilisation et votre budget."
        - paragraph [ref=e61]: La formule Responsabilité civile, couverture minimale obligatoire, couvre les dommages causés aux tiers lors d'un sinistre responsable. C'est le minimum obligatoire pour rouler sur la route tout en maîtrisant son budget.
        - paragraph [ref=e62]: "La formule Vol / Incendie protège en plus votre moto contre le vol et l'incendie, avec une indemnisation à la valeur de remplacement à dire d'expert ou à la valeur à neuf durant les 6 premiers mois. Elle serait à envisager si votre Kove stationne majoritairement sur la voie publique. À noter également : chez AMV, le gravage du deux-roues, associé à un antivol agréé SRA, permet de diviser la franchise vol par 2."
        - paragraph [ref=e63]: La formule Dommages collision, la garantie distinctive d'AMV, couvre les dommages causés à votre moto lors d'une collision avec un tiers identifié, déduction faite, en cas de sinistre responsable, de la franchise prévue au contrat. Elle permet une meilleure couverture tout en maîtrisant votre budget.
        - paragraph [ref=e64]: La formule Tous risques couvre les dommages subis par votre deux-roues quelles que soient les circonstances. Elle serait recommandée pour une Kove neuve, récente ou financée à crédit.
        - paragraph [ref=e65]: "Et dès la première formule, votre équipement de pilote est protégé : casque, gants et gilet airbag sont garantis s'ils sont détériorés lors d'un événement couvert."
