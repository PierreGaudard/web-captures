            - row "Individuelle Pilote (option) Capital (jusqu'à 800 000 €) en cas de déficit fonctionnel ou de décès consécutif à un accident." [ref=e84]:
              - cell "Individuelle Pilote (option)" [ref=e85]
              - cell "Capital (jusqu'à 800 000 €) en cas de déficit fonctionnel ou de décès consécutif à un accident." [ref=e86]
            - row "Option Plus (option) Équipement moto couvert en vol comme en dommages, accessoires hors-série et top case, dans la limite de 5 000 €" [ref=e87]:
              - cell "Option Plus (option)" [ref=e88]
              - cell "Équipement moto couvert en vol comme en dommages, accessoires hors-série et top case, dans la limite de 5 000 €" [ref=e89]
        - paragraph [ref=e90]: La Défense pénale et recours suite à accident, associée à la Protection juridique, vous accompagne en cas de litige lié, notamment à un accident, jusqu'à 20 000 € au total.
        - heading "Les options pour une protection sur-mesure" [level=2] [ref=e91]
        - paragraph [ref=e92]: Votre contrat se complète d'options dédiées au pilote et aux équipements, pour ajuster la protection à votre Kove et à votre pratique.
        - paragraph [ref=e93]: L'option Individuelle pilote permet le versement d'un capital à l'assuré en cas de déficit fonctionnel permanent ou à ses ayants droit en cas de décès, consécutifs à un accident, même responsable. C'est une garantie dédiée au pilote.
        - paragraph [ref=e94]: Sur des machines qui quittent régulièrement le bitume, cette protection du pilote lui-même mérite d'être étudiée.
        - paragraph [ref=e95]: "Avec l'Option Plus, votre deux-roues acheté neuf, volé ou détruit suite à un sinistre est remboursé à sa valeur d'achat pendant un an et demi à compter de la date d'achat. L'ensemble de votre équipement moto est couvert en vol comme en dommages, mais également les accessoires hors-série, comme le top case par exemple, dans la limite de 5 000 € : un vrai plus pour un trail équipé de sacoches, d'un sabot moteur ou de protections."
        - paragraph [ref=e96]: "AMV propose aussi une Assistance 0 km en option, pour un dépannage sur mesure : votre moto est dépannée ou remorquée jusqu'à la concession la plus proche, vous et votre passager êtes rapatriés. La crevaison est incluse. Une option utile quand la panne arrive loin de chez soi, au retour d'un raid ou d'un week-end en montagne : l'assistance intervient sur les routes carrossables, pas en plein désert."
        - heading "Quel est le prix d'une assurance moto Kove ?" [level=2] [ref=e97]
        - paragraph [ref=e98]: "Assurer sa moto n'est pas une option : le code des assurances impose au minimum la Responsabilité civile pour tout véhicule terrestre à moteur. Reste à savoir ce que représente ce coût pour une Kove."
        - paragraph [ref=e99]: "Le montant d'une assurance moto Kove est personnalisé. Il est établi à partir, entre autres, du modèle à assurer, de sa cylindrée, de sa date de première mise en circulation, du lieu de stationnement, du niveau de couverture choisi et de la sinistralité déclarée. À profil identique, une NK 125R ne s'assurerait donc pas au même tarif qu'une 800X, dont la cylindrée et la valeur sont supérieures. La formule retenue pèse tout autant : une Responsabilité civile revient logiquement moins chère qu'une Tous risques, pour une protection bien moindre en cas de sinistre."
        - paragraph [ref=e100]: Le devis en ligne AMV, gratuit et sans engagement, vous donne en quelques minutes le tarif de chaque formule pour votre modèle, avant de choisir la couverture qui correspond à votre budget.
        - heading "Pourquoi assurer votre Kove chez AMV ?" [level=2] [ref=e101]
        - paragraph [ref=e102]: AMV, spécialiste de l'assurance deux-roues fondée en 1974 par un passionné de moto, pour les motards, compte plus d'1 million d'assurés et affiche une note de satisfaction de 4,7 sur 5 via Avis Vérifiés. Nos plus de 350 conseillers, basés à Bordeaux, suivent les marques qui arrivent sur le marché français, et un conseiller dédié vous suit en cas de sinistre.
        - paragraph [ref=e103]:
          - text: "Marque récente sur le marché français, Kove n'est pas toujours référencée chez les assureurs généralistes : chez AMV, chaque modèle de la gamme l'est, du roadster 125 au trail 800X Pro, pour un devis précis en quelques clics. Souscrire prend peu de temps : un devis en ligne gratuit, peu de justificatifs là où d'autres assureurs réclament davantage de pièces, et une couverture qui peut prendre effet immédiatement, sous réserve de certaines conditions. Si vous le souhaitez, vous pouvez ensuite gérer votre contrat en toute autonomie depuis Mon Espace AMV. Découvrez également notre"
          - link "assurance moto" [ref=e104] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance/moto/
          - text: pour
          - link "l'ensemble des constructeurs" [ref=e105] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-moto/assurance-moto-par-constructeur/
          - text: .
      - generic [ref=e107]:
        - generic [ref=e108] [cursor=pointer]:
          - generic [ref=e109]:
            - generic [ref=e110]: quel est le prix d'une assurance pour une kove 450 rally ou une 800x ?
            - img [ref=e111]
          - paragraph [ref=e113]: "Il n'existe pas de tarif unique : chaque cotisation est calculée selon, notamment, le modèle, sa cylindrée, sa date de première mise en circulation, le lieu de stationnement, le niveau de couverture et la sinistralité déclarée. À profil identique, une 450 Rally et une 800X ne se situent pas sur les mêmes niveaux de tarif, ne serait-ce que par leur cylindrée et leur valeur. Le devis en ligne vous donne un tarif personnalisé pour votre Kove en quelques minutes."
        - generic [ref=e114] [cursor=pointer]:
          - generic [ref=e115]:
            - generic [ref=e116]: quelle assurance choisir pour une kove ?
            - img [ref=e117]
          - paragraph [ref=e119]: Le choix dépend surtout de la valeur de votre moto. Pour une Kove de faible valeur, la formule Responsabilité civile peut suffire. Pour un modèle neuf, récent ou financé à crédit, la formule Tous risques offrirait la protection la plus complète. Entre les deux, la formule Vol / Incendie serait pertinente si votre moto stationne majoritairement dehors, et la formule Dommages collision renforce votre couverture en cas d'accident avec un tiers identifié, tout en maîtrisant votre budget.
        - generic [ref=e120] [cursor=pointer]:
          - generic [ref=e121]:
            - generic [ref=e122]: une kove 450 rally est-elle accessible au permis a2 ?
            - img [ref=e123]
          - paragraph [ref=e125]:
            - text: Oui, la 450 Rally Standard est homologuée route et accessible au
            - link "permis A2" [ref=e126]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-permis-a2/
            - text: ", tout comme la 510X. Le tarif reste personnalisé, sans formule spécifique aux jeunes conducteurs : les mêmes garanties s'appliquent à tous les assurés."
        - generic [ref=e127] [cursor=pointer]:
          - generic [ref=e128]:
            - generic [ref=e129]: une kove utilisee en tout-terrain est-elle couverte ?
            - img [ref=e130]
          - paragraph [ref=e132]: Une Kove homologuée route reste couverte sur les chemins ouverts à la circulation publique, et le roulage libre sur circuit est également assuré. En revanche, la compétition, entraînements chronométrés et courses, n'est couverte par aucune garantie. Et si votre machine n'est pas homologuée pour la route, seule une formule Responsabilité civile dédiée est proposée.
        - generic [ref=e133] [cursor=pointer]:
          - generic [ref=e134]:
            - generic [ref=e135]: faut-il fournir beaucoup de documents pour assurer une kove ?
            - img [ref=e136]
          - paragraph [ref=e138]: "Non. La souscription chez AMV demande peu de justificatifs, là où d'autres assureurs en réclament davantage. Le permis, la carte grise ou le relevé d'information ne sont pas des pièces à fournir en tant que telles : ce sont les renseignements qu'ils contiennent qui sont nécessaires pour établir votre tarif. Vous recevez ensuite votre attestation d'assurance par e-mail."
