      - generic [ref=e110]:
        - generic [ref=e111]: Nouveau contenu optimise
        - heading "Questions fréquentes sur l'assurance CFMOTO" [level=2] [ref=e112]
        - heading "Combien coûte une assurance moto CFMOTO ?" [level=3] [ref=e113]
        - paragraph [ref=e114]: Le tarif dépend du modèle, de la sinistralité déclarée du conducteur, de l'adresse du domicile ou du lieu de stationnement, et du niveau de couverture choisi. Le devis en ligne vous donne un tarif personnalisé pour votre modèle CFMOTO en quelques clics.
        - heading "Peut-on assurer une CFMOTO avec un permis A2 ?" [level=3] [ref=e115]
        - paragraph [ref=e116]: Oui. Plusieurs modèles de la gamme sont accessibles au permis A2, comme la 450SR ou les versions bridées à 35 kW (47,5 ch) des roadsters et trails. Les formules et options sont les mêmes quel que soit votre permis ; seul le tarif tient compte de votre sinistralité déclarée.
        - heading "Comment assurer un quad CFMOTO ?" [level=3] [ref=e117]
        - paragraph [ref=e118]: "L'assurance quad CFMOTO et SSV (gammes CFORCE et ZFORCE) se souscrit aussi simplement que l'assurance moto : devis en ligne avec les informations du véhicule, puis souscription en quelques clics. Pour un modèle homologué route, vous choisissez parmi les formules présentées sur notre page assurance quad ; pour un modèle non homologué, une formule Responsabilité civile dédiée est proposée, en usage privé."
        - heading "Une CFMOTO d'occasion peut-elle être assurée en tous risques ?" [level=3] [ref=e119]
        - paragraph [ref=e120]: "Oui. La formule Tous risques n'est pas réservée aux véhicules neufs : elle peut couvrir une CFMOTO d'occasion récente ou de valeur. Pour un modèle de faible valeur marchande, la formule Responsabilité civile ou Vol / Incendie peut suffire."
      - generic [ref=e121]:
