            - generic [ref=e44]:
              - generic [ref=e45]: ✓
              - generic [ref=e46]: AMV assure toute la gamme CFMOTO, motos (450SR, 450NK, 800NK, trails 450MT et 800MT) avec 4 formules du tiers au tous risques et des options dédiées aux équipements, ainsi que les quads et SSV (CFORCE, ZFORCE). Devis d'assurance CFMOTO gratuit en ligne, en quelques minutes.
            - heading "Assurer votre CFMOTO chez AMV" [level=2] [ref=e47]
            - paragraph [ref=e48]: CFMOTO s'est imposée comme l'une des marques qui montent sur le marché français du deux-roues et du quad, avec un rapport équipement-prix qui séduit de plus en plus de conducteurs. AMV, spécialiste de l'assurance deux-roues depuis 1974, propose une assurance adaptée à chaque modèle CFMOTO, moto comme quad. Obtenez votre devis en ligne en quelques clics, sans engagement, et choisissez la formule qui correspond à votre machine et à votre budget.
            - heading "Quels modèles CFMOTO peut-on assurer ?" [level=2] [ref=e49]
            - paragraph [ref=e50]:
              - text: "AMV assure l'ensemble de la gamme moto CFMOTO : les roadsters NK (450NK, 800NK), la sportive 450SR, les trails 450MT et 800MT, ainsi que les modèles accessibles au permis A2. Neuve ou d'occasion, votre CFMOTO bénéficie des mêmes formules et options que toutes les motos assurées chez AMV. Et comme CFMOTO est aussi très présente sur le quad et le SSV (gammes CFORCE et ZFORCE), AMV assure également ces véhicules : rendez-vous sur notre page"
              - link "assurance quad" [ref=e51] [cursor=pointer]:
                - /url: https://www.amv.fr/assurance/quad/
              - text: pour un quad CFMOTO.
            - heading "Nos formules d'assurance moto CFMOTO" [level=2] [ref=e52]
            - paragraph [ref=e53]: "Quatre niveaux de couverture, à choisir selon la valeur de votre CFMOTO et votre budget :"
            - list [ref=e54]:
              - listitem [ref=e55]: "✓ Responsabilité civile : la formule au tiers couvre les dommages causés aux tiers lors d'un sinistre responsable, inclut une assistance juridique et garantit vos équipements de protection (casque, gants, gilet airbag). Elle peut convenir aux modèles de faible valeur marchande."
              - listitem [ref=e56]: "✓ Vol / Incendie : ajoute la couverture du vol, de la tentative de vol et de l'incendie, avec indemnisation à la valeur de remplacement à dire d'expert ou à la valeur à neuf durant les 6 premiers mois. Particulièrement adaptée si votre CFMOTO est stationnée majoritairement en extérieur ou dans un lieu non clos."
              - listitem [ref=e57]: "✓ Dommages collision : prend en charge les dommages causés à votre moto lors d'une collision avec un tiers identifié, sous déduction, en cas de sinistre responsable, de la franchise prévue au contrat."
              - listitem [ref=e58]: "✓ Tous risques : la protection la plus complète, qui couvre les dommages subis par votre véhicule quelles que soient les circonstances, y compris en cas de sinistre responsable ou de vandalisme. Recommandée pour une CFMOTO neuve, récente ou financée à crédit."
            - paragraph [ref=e59]: "Chaque formule peut être complétée par des options : l'Individuelle pilote (capital jusqu'à 800 000 euros versé en cas d'invalidité permanente, ou aux ayants droit en cas de décès), l'Assistance 0 km (dépannage sans franchise kilométrique, 24h/24) et l'Option plus (équipement vestimentaire moto et accessoires hors-série jusqu'à 5 000 euros, valeur à neuf prolongée à 18 mois)."
            - heading "Pourquoi assurer votre CFMOTO chez AMV ?" [level=2] [ref=e60]
            - paragraph [ref=e61]:
              - text: "AMV, leader de l'assurance deux-roues en France, a plus d'1 million d'assurés, avec une note de 4,7/5 via Avis Vérifiés. AMV propose des tarifs ajustés au modèle exact de votre CFMOTO et un accompagnement de spécialiste : plus de 350 conseillers basés à Bordeaux, un conseiller dédié en cas de sinistre, et la gestion de votre contrat depuis Mon Espace AMV. Marque récente sur le marché français, CFMOTO n'est pas toujours référencée chez les assureurs généralistes : chez AMV, spécialiste de l'assurance deux-roues, chaque modèle de la gamme l'est, de la 450SR au quad CFORCE, pour un devis précis en quelques clics. Retrouvez aussi toutes les marques sur notre page"
              - link "assurance moto" [ref=e62] [cursor=pointer]:
                - /url: https://www.amv.fr/assurance/moto/
              - text: .
            - heading "Comment obtenir votre devis d'assurance CFMOTO ?" [level=2] [ref=e63]
            - paragraph [ref=e64]: "Munissez-vous de votre permis de conduire et de votre relevé d'information, renseignez les informations sur votre CFMOTO (modèle, année) et votre profil pour obtenir votre devis en ligne en quelques minutes. Comparez les formules, choisissez celle qui vous correspond, et si le tarif vous convient, finalisez la souscription en quelques clics : vous recevez votre attestation d'assurance par e-mail."
        - img "assurance-cfmoto" [ref=e65]
      - generic [ref=e67]:
        - paragraph [ref=e69]: Pour la saison 2024, CFMOTO prend un nouveau virage dans le monde de la compétition motocycliste. Après avoir été associé au team PruestelGP en 2022 et 2023, la marque chinoise se tourne vers de nouveaux horizons en s'engageant aux côtés du team Aspar en Moto2 et Moto3. Un partenariat qui ne vise que le titre, ni plus ni moins !
        - generic [ref=e70]:
          - 'heading "CFMOTO et Aspar : Une alliance prometteuse pour dompter les circuits Moto2 et Moto3 en 2024" [level=4] [ref=e71]':
            - strong [ref=e72]: "CFMOTO et Aspar : Une alliance prometteuse pour dompter les circuits Moto2 et Moto3 en 2024"
          - paragraph [ref=e73]
          - paragraph [ref=e74]: Il est indéniable que CFMOTO a saisi toute l'importance d'une présence active dans les championnats du monde pour sa réputation et son image de marque, même si elle ne propose pas de motos sportives dans sa gamme et n'a pas de prototypes pour les Grands Prix. Jusqu'à l'année précédente, CFMOTO était associé aux KTM de Joel Kelso et Xavier Artigas en Moto3, mais pour 2024, la marque franchit une nouvelle étape en rejoignant la prestigieuse écurie de Jorge Martinez.
          - paragraph [ref=e75]
          - paragraph [ref=e76]: Ce nouveau partenariat offre à CFMOTO l'opportunité d'être représenté dans deux catégories majeures, avec de réelles chances de victoire. C'est un pas en avant significatif qui laisse entrevoir la possibilité à terme de voir CFMOTO lancer sa propre équipe en Grand Prix.
          - paragraph [ref=e77]
          - paragraph [ref=e78]: "Jorge Martinez, également connu sous le nom d'Aspar, exprime clairement les ambitions communes pour la saison à venir : remporter les titres en Moto3 et Moto2. Pour lui, cette collaboration avec CFMOTO est une motivation supplémentaire, et il se dit très heureux de pouvoir compter sur leur soutien. Il promet de tout mettre en œuvre pour rendre fier CFMOTO et lui offrir de nombreuses victoires tout au long de la saison."
          - paragraph [ref=e79]
          - paragraph [ref=e80]: Du côté de CFMOTO Racing, Su Zhen, le responsable du développement, partage cet enthousiasme. Il est convaincu que le partenariat avec Aspar propulsera CFMOTO Racing vers de nouveaux sommets. Il anticipe déjà des victoires et des podiums à foison et envisage même des possibilités de coopération au-delà du paddock pour renforcer davantage cette collaboration fructueuse.
          - paragraph [ref=e81]
          - paragraph [ref=e82]: En somme, l'alliance entre CFMOTO et Aspar pour la saison 2024 s'annonce prometteuse. Les deux entités partagent des objectifs communs et une détermination sans faille à conquérir les circuits et à écrire une nouvelle page d'histoire dans le monde de la compétition motocycliste.
        - generic [ref=e83]:
          - heading "Conclusion sur CFMOTO" [level=4] [ref=e84]:
            - strong [ref=e85]: Conclusion sur CFMOTO
          - paragraph [ref=e86]
          - paragraph [ref=e87]: En conclusion, l'association entre CFMOTO et Aspar pour la saison 2024 marque un tournant décisif dans le monde de la compétition motocycliste. Avec des objectifs ambitieux et une détermination sans faille, ces deux partenaires s'engagent à conquérir les circuits de Moto2 et Moto3. Portés par une vision commune et une volonté de succès, CFMOTO et Aspar incarnent l'esprit de compétition et la recherche incessante de l'excellence. Leur collaboration promet non seulement des victoires sur la piste, mais également une expansion des opportunités de coopération au-delà du monde des Grands Prix. Ensemble, ils tracent la voie vers un avenir radieux, où l'innovation, la passion et le talent se conjuguent pour repousser les limites de la performance motocycliste.
