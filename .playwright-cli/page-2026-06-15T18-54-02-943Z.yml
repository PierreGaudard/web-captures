      - generic [ref=e111]:
        - generic [ref=e112]: Nouveau contenu optimisé
        - generic [ref=e113]:
          - generic [ref=e114]: H2
          - text: Pourquoi assurer sa Kawasaki chez AMV ?
        - paragraph [ref=e115]: "Une Kawasaki se conduit avec plaisir. Encore faut-il bien l'assurer. AMV, spécialiste du deux-roues depuis cinquante ans, propose une assurance en ligne simple et rapide : quelques clics suffisent pour être couvert, sans vous déplacer en agence. Plus d'1 million d'assurés font confiance à AMV, noté 4,7/5 par Avis Vérifiés, tiers de confiance. Les conseillers AMV sont des passionnés de deux-roues. Ils comprennent les besoins d'un motard Kawasaki et vous orientent vers la couverture la plus juste. En cas de sinistre, accident, vol ou panne, l'assistance reste joignable 24h/24 et 7j/7 selon l'option choisie."
        - generic [ref=e116]:
          - generic [ref=e117]: H2
          - text: Les formules d'assurance moto Kawasaki
        - paragraph [ref=e118]: AMV propose une gamme complète de formules d'assurance moto Kawasaki, de la couverture essentielle à la protection tous risques. Vous choisissez le niveau de garanties selon la valeur de votre moto, sa cylindrée, son usage et votre profil de conducteur. Quelle que soit la formule, la responsabilité civile, l'assistance et la protection juridique sont incluses.
        - paragraph [ref=e119]: "L'assurance au tiers couvre la responsabilité civile : c'est la garantie minimale obligatoire, qui indemnise les dommages causés à un tiers. Elle peut convenir à une Kawasaki ancienne, de faible valeur ou peu utilisée, et reste la formule la moins chère."
        - paragraph [ref=e120]: "La formule intermédiaire ajoute le vol, la tentative de vol et l'incendie. Elle est recommandée si vous garez votre moto en extérieur : les Kawasaki sportives et de forte cylindrée figurent parmi les modèles les plus convoités par les voleurs."
        - paragraph [ref=e121]: La formule tous risques indemnise les dommages subis par votre deux-roues, même en cas de sinistre responsable, et couvre le vandalisme. C'est la protection la plus complète, recommandée pour une Kawasaki récente, une Ninja ou une Z de fortes cylindrées, ou une moto financée à crédit.
        - generic [ref=e122]:
          - generic [ref=e123]: H2
          - text: Quelle assurance selon votre modèle Kawasaki ?
        - paragraph [ref=e124]: "La gamme Kawasaki couvre des usages très différents, et le contrat se choisit en fonction du type de moto. AMV assure toutes les Kawasaki, quelle que soit la cylindrée :"
        - list [ref=e125]:
          - listitem [ref=e126]: "Roadsters Z (Z650, Z900, Z H2) : des motos polyvalentes pour la ville et la route, à assurer selon leur valeur et leur puissance."
          - listitem [ref=e127]: "Sportives Ninja (Ninja 400, Ninja 650, Ninja ZX-6R, ZX-10R, H2) : forte cylindrée et performances élevées, la formule tous risques est souvent recommandée."
          - listitem [ref=e128]: "Trails Versys (Versys 650, Versys 1000) : pensés pour les longs trajets et le voyage, avec une assistance étendue utile."
          - listitem [ref=e129]: "Customs Vulcan : des motos de balade au style néo-rétro, prisées pour le loisir le week-end."
          - listitem [ref=e130]:
            - text: "Rétros W et Eliminator : des modèles au caractère classique, parfois éligibles à une"
            - link "assurance moto de collection" [ref=e131] [cursor=pointer]:
              - /url: https://www.amv.fr/legende/vehicule-collection/assurance-moto-collection.aspx
            - text: après 30 ans.
        - paragraph [ref=e132]: Pour chaque modèle, le tarif et les garanties s'ajustent à la cylindrée, à l'usage et au profil du conducteur. Un conseiller AMV vous aide à trouver la couverture la plus juste pour votre Kawasaki.
        - generic [ref=e133]:
          - generic [ref=e134]: H2
          - text: Des garanties et options adaptées à votre moto
        - paragraph [ref=e135]: Au-delà des formules, AMV permet de personnaliser votre contrat avec des options selon votre usage. L'assistance 0 km intervient même devant chez vous, sans franchise kilométrique, pour une panne, un accident ou un vol. La garantie des équipements protège votre casque, vos gants et votre blouson en cas de sinistre. La garantie individuelle du conducteur vous verse un capital en cas de décès ou d'invalidité permanente, même en cas d'accident responsable. Vous adaptez ainsi votre protection à votre Kawasaki, au quotidien comme pour le loisir le week-end.
        - paragraph [ref=e136]: La protection juridique, incluse dès la première formule, prend en charge la défense de vos intérêts en cas de litige lié à votre moto, qu'il s'agisse d'un désaccord après un accident ou d'un conflit avec un réparateur. Combinée à l'assistance, elle vous évite bien des démarches en cas de coup dur.
        - generic [ref=e137]:
          - generic [ref=e138]: H2
          - text: Protéger sa Kawasaki contre le vol
        - paragraph [ref=e139]: "Les Kawasaki sportives, Ninja ou Z, comptent parmi les motos les plus recherchées par les voleurs. La garantie vol, disponible dès la formule intermédiaire, prend alors tout son sens. Quelques précautions aident à en bénéficier dans les meilleures conditions : antivol homologué (bloque-disque, chaîne, U), stationnement dans un lieu fermé, gravage du deux-roues. Elles réduisent le risque et peuvent alléger votre tarif. En cas de vol, l'indemnisation dépend de la formule souscrite et de la valeur du véhicule au moment du sinistre."
        - generic [ref=e140]:
          - generic [ref=e141]: H2
          - text: Quel est le prix d'une assurance moto Kawasaki ?
        - paragraph [ref=e142]: "Le coût d'une assurance moto Kawasaki dépend de plusieurs facteurs : le modèle et la cylindrée de la moto, l'expérience du conducteur (ancienneté du permis, bonus, antécédents de sinistres), le lieu de stationnement habituel et le niveau de garanties choisi. Une Ninja de forte cylindrée ne s'assure pas au même tarif qu'une petite Z d'entrée de gamme. Chez AMV, le devis personnalisé en ligne tient compte de tous ces éléments et vous donne un tarif adapté à votre profil en quelques minutes, gratuitement et sans engagement."
        - generic [ref=e143]:
          - generic [ref=e144]: H2
          - text: Comment souscrire votre assurance moto Kawasaki en ligne ?
        - paragraph [ref=e145]: Pour assurer votre moto Kawasaki, la souscription chez AMV est simple et rapide. Munissez-vous de votre permis de conduire et de la carte grise de votre Kawasaki, renseignez le modèle, la cylindrée et votre profil de conducteur, puis obtenez votre devis gratuit en 3 minutes. Si le tarif vous convient, finalisez la souscription en quelques clics et recevez votre attestation d'assurance par e-mail. Vous bénéficiez d'une couverture immédiate, sous réserve de certaines conditions, pour prendre la route sans attendre.
