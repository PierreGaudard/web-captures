          - generic [ref=e177] [cursor=pointer]:
            - generic [ref=e178]:
              - generic [ref=e179]: Quels ont été les défis majeurs auxquels Kawasaki a dû faire face au cours de son histoire ?
              - img [ref=e180]
            - paragraph [ref=e182]: Kawasaki a dû surmonter divers défis, allant des débuts difficiles en raison de la transition des voiliers aux navires occidentaux, aux périodes de récession, des guerres mondiales, en passant par les chocs pétroliers des années 1970. La surcapacité dans la construction navale et la concurrence internationale ont également été des obstacles, mais l'entreprise a démontré une résilience exceptionnelle.
          - generic [ref=e183] [cursor=pointer]:
            - generic [ref=e184]:
              - generic [ref=e185]: Comment Kawasaki Heavy Industries, Ltd s'est-elle adaptée aux changements économiques et technologiques récents ?
