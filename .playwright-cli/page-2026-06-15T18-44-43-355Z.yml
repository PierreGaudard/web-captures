      - generic [ref=e761]:
        - heading "H2 Quel scooter peut-on assurer chez AMV ?" [level=2] [ref=e762]:
          - generic [ref=e763]: H2
          - text: Quel scooter peut-on assurer chez AMV ?
        - paragraph [ref=e764]: AMV, spécialiste de l'assurance deux-roues, assure tous les types de scooters, quelle que soit la cylindrée ou la motorisation. Que vous utilisiez votre deux-roues en ville ou sur route, AMV a un contrat adapté à votre profil.
        - heading "H3 Scooter 50 cm3" [level=3] [ref=e765]:
          - generic [ref=e766]: H3
          - text: Scooter 50 cm3
        - paragraph [ref=e767]:
          - text: Le
          - link "scooter 50 cm3" [ref=e768] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-scooter/assurance-scooter-50cm3/
          - text: "est idéal pour les trajets urbains courts. Accessible dès 14 ans avec le permis AM (ex-BSR), il ne nécessite pas le permis de conduire classique. AMV propose des formules adaptées aux conducteurs de 50 cm3, y compris les jeunes qui prennent la route pour la première fois. Parmi les modèles courants : Piaggio Zip, Peugeot Kisbee, Yamaha Neos, MBK Booster."
        - heading "H3 Scooter 125 cm3" [level=3] [ref=e769]:
          - generic [ref=e770]: H3
          - text: Scooter 125 cm3
        - paragraph [ref=e771]:
          - text: Le
          - link "scooter 125" [ref=e772] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-scooter/assurance-scooter-125cm3/
          - text: est le choix privilégié pour les déplacements domicile-travail et les trajets périurbains. Accessible avec le permis B et une formation de 7 heures, ou avec le permis A1, il offre un bon compromis entre performance et coût d'assurance. AMV assure tous les scooters 125, comme le Honda Forza 125, le Yamaha XMAX 125 ou le Piaggio Medley.
        - heading "H3 Maxi-scooter et trois-roues" [level=3] [ref=e773]:
          - generic [ref=e774]: H3
          - text: Maxi-scooter et trois-roues
        - paragraph [ref=e775]: Pour les conducteurs qui recherchent confort et puissance sur de longs trajets, le maxi-scooter est la solution. AMV assure les maxi-scooters de toutes cylindrées (300, 400, 530 cm3 et plus) ainsi que les scooters trois-roues. Que vous rouliez en Yamaha TMAX, Honda Forza 350 ou Piaggio MP3, votre contrat couvre l'ensemble de vos besoins.
        - heading "H3 Scooter électrique" [level=3] [ref=e776]:
          - generic [ref=e777]: H3
          - text: Scooter électrique
        - paragraph [ref=e778]:
          - text: Le
          - link "scooter électrique" [ref=e779] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-scooter/assurance-scooter-electrique/
          - text: se développe rapidement en ville. AMV assure tous les modèles de scooters électriques dans les mêmes conditions que les scooters thermiques. Les garanties et les options sont identiques, et la cotisation tient compte des spécificités de la motorisation électrique.
        - 'heading "H2 Le vol de scooter : pourquoi bien se protéger" [level=2] [ref=e780]':
          - generic [ref=e781]: H2
          - text: "Le vol de scooter : pourquoi bien se protéger"
        - paragraph [ref=e782]: Le scooter, souvent stationné dans la rue, est particulièrement exposé au vol. Pour un usage urbain quotidien, la formule Vol / Incendie ou une formule plus complète est vivement conseillée. Au-delà de l'assurance, un bon antivol (U ou chaîne) et un stationnement dans un lieu fermé ou surveillé réduisent fortement le risque. En cas de vol, AMV vous indemnise à la valeur de remplacement à dire d'expert, ou à la valeur à neuf pendant les premiers mois suivant l'achat.
        - heading "H2 L'assurance scooter pour vos trajets du quotidien" [level=2] [ref=e783]:
          - generic [ref=e784]: H2
          - text: L'assurance scooter pour vos trajets du quotidien
        - paragraph [ref=e785]: "Le scooter est avant tout un véhicule urbain et périurbain : trajets domicile-travail, circulation dense, stationnement facile. AMV adapte votre contrat à cet usage quotidien, avec l'assistance 0 km qui intervient dès le domicile en cas de panne, et des garanties pensées pour la ville. Que vous rouliez en 50 cm3 pour de courts trajets ou en maxi-scooter pour des distances plus longues, votre couverture suit votre rythme."
        - heading "H2 Comment souscrire une assurance scooter ?" [level=2] [ref=e786]:
          - generic [ref=e787]: H2
          - text: Comment souscrire une assurance scooter ?
        - paragraph [ref=e788]: Pour souscrire une assurance scooter chez AMV, la démarche est rapide. Renseignez les informations sur votre scooter (modèle, cylindrée, année) et votre profil (expérience, bonus-malus, zone géographique) pour recevoir votre devis en ligne en quelques minutes. Si le prix vous convient, finalisez la souscription en quelques clics et recevez votre attestation d'assurance par mail. Les garanties prennent effet immédiatement ou à la date de votre choix. Vous pouvez aussi contacter un conseiller par téléphone.
        - generic [ref=e789]:
          - generic [ref=e790]: Questions fréquentes
          - heading "Des questions sur votre assurance scooter ? Nous y répondons ici" [level=2] [ref=e791]:
            - text: Des questions sur votre assurance scooter ?
            - text: Nous y répondons ici
        - generic [ref=e793]:
          - generic [ref=e794] [cursor=pointer]:
            - generic [ref=e795]:
              - generic [ref=e796]: Quelle est la meilleure assurance pour un scooter ?
              - img [ref=e797]
            - generic [ref=e798]:
              - paragraph [ref=e799]: Trouvez la meilleure assurance scooter avec AMV, le spécialiste incontesté de l'assurance deux-roues. Bénéficiez de tarifs compétitifs et de garanties sur mesure, parfaitement adaptées à vos besoins. Faites confiance à notre expertise et notre expérience en tant que leader de l'assurance scooter depuis de nombreuses années. Vous pouvez être assuré de bénéficier d'une protection optimale pour vous et votre scooter grâce à notre service de qualité et notre engagement envers nos clients. Roulez en toute sérénité en choisissant AMV comme partenaire pour assurer votre scooter.
              - paragraph [ref=e800]: La meilleure assurance scooter dépend de votre usage, de la valeur de votre véhicule et de votre budget. Pour un scooter ancien ou de faible valeur, la formule Responsabilité civile pourrait suffire. Pour un scooter neuf ou financé à crédit, la formule Tous risques offre la meilleure protection. AMV, spécialiste de l'assurance deux-roues depuis plus de 50 ans, propose des formules adaptées à chaque profil.
          - generic [ref=e801] [cursor=pointer]:
            - generic [ref=e802]:
              - generic [ref=e803]: Comment faire pour assurer un scooter de 50cc ?
              - img [ref=e804]
            - generic [ref=e805]:
              - paragraph [ref=e806]: Pour assurer votre scooter 50cc au meilleur prix, AMV est le choix idéal. Grâce à l'assurance en ligne proposée par AMV, vous bénéficiez rapidement d'une couverture efficace pour votre scooter. Sur amv.fr, vous pouvez obtenir une assurance pour votre scooter 50cc en un temps record (sous conditions). Faites confiance à AMV, le spécialiste de l'assurance scooter, pour protéger votre véhicule en toute simplicité et tranquillité d'esprit. Profitez des avantages offerts par AMV et roulez en toute sécurité sur les routes.
              - paragraph [ref=e807]: Pour assurer un scooter 50 cm3, vous avez besoin de votre BSR ou permis AM (pour les conducteurs nés après le 1er janvier 1988), de la carte grise du véhicule et d'un relevé d'informations si vous étiez déjà assuré. Chez AMV, le devis est gratuit et la souscription se fait en ligne en quelques minutes.
          - generic [ref=e808] [cursor=pointer]:
            - generic [ref=e809]:
              - generic [ref=e810]: Comment obtenir un devis d'assurance scooter ?
              - img [ref=e811]
            - paragraph [ref=e813]: Vous recherchez une assurance scooter fiable et adaptée à vos besoins spécifiques ? AMV est l'assureur de confiance qu'il vous faut ! Obtenez rapidement un devis personnalisé et gratuit en ligne en quelques clics seulement. Que vous soyez jeune conducteur ou expérimenté, que vous possédiez un scooter 50cc, 125cc ou un scooter 3 roues, AMV propose des solutions d'assurance sur mesure pour protéger efficacement votre scooter et vous-même sur la route. Profitez de leurs 50 années d'expérience dans le domaine de l'assurance deux-roues et assurez-vous sereinement avec AMV. N'attendez plus, munissez-vous simplement de votre permis et de votre carte grise pour obtenir votre devis personnalisé dès maintenant !
          - generic [ref=e814] [cursor=pointer]:
            - generic [ref=e815]:
              - generic [ref=e816]: Est-il obligatoire d'assurer un scooter ?
              - img [ref=e817]
            - generic [ref=e818]:
              - paragraph [ref=e819]: Lorsqu'on possède un scooter, il est obligatoire de souscrire à une assurance, comme pour tout autre véhicule motorisé. La garantie Responsabilité Civile constitue le niveau minimal obligatoire pour être en règle. Dans ce contexte, AMV se démarque en tant qu'assureur spécialisé dans les scooters. Fort de son expertise et de son expérience, AMV propose des solutions d'assurance adaptées aux besoins spécifiques des conducteurs de scooters, avec des couvertures étendues et des tarifs compétitifs. Que vous utilisiez votre scooter pour vos déplacements quotidiens (trajets domicile/travail) ou pour vos loisirs, AMV offre une tranquillité d'esprit incomparable en cas d'accident ou de sinistre. Faire confiance à AMV, c'est opter pour une assurance scooter de qualité, pensée pour vous offrir la meilleure protection sur la route.
              - paragraph [ref=e820]: Oui. Tout véhicule terrestre à moteur doit être assuré au minimum en responsabilité civile, même stationné dans un garage et même s'il ne circule pas. Le défaut d'assurance est passible d'une amende pouvant aller jusqu'à 3 750 euros. Cette obligation s'applique à tous les scooters, quelle que soit leur cylindrée.
          - generic [ref=e821] [cursor=pointer]:
            - generic [ref=e822]:
              - generic [ref=e823]: Combien coûte une assurance scooter ?
              - img [ref=e824]
            - generic [ref=e825]:
              - paragraph [ref=e826]: L'assureur AMV offre une gamme complète d'assurances pour tous les scooters, avec des tarifs compétitifs et adaptés à chaque profil de conducteur. En fonction du niveau de garanties choisi, du modèle du scooter, de son lieu de stationnement habituel et si besoin du bonus du conducteur, AMV propose des offres personnalisées pour que ses clients prennent la route sereinement en étant bien assurés. Avec une solide réputation dans le domaine de l'assurance scooter, AMV est un partenaire de confiance pour protéger efficacement son deux-roues et rouler en toute sérénité.
              - paragraph [ref=e827]: "Le prix d'une assurance scooter dépend de plusieurs critères :"
              - list [ref=e828]:
                - listitem [ref=e829]: le modèle du scooter, sa cylindrée et sa puissance
                - listitem [ref=e830]: l'âge et l'expérience du conducteur
                - listitem [ref=e831]: la zone géographique et le lieu de stationnement
                - listitem [ref=e832]: le niveau de couverture choisi
              - paragraph [ref=e833]: Chez AMV, un devis personnalisé en ligne vous donne un tarif adapté en quelques clics.
          - generic [ref=e834] [cursor=pointer]:
            - generic [ref=e835]:
              - generic [ref=e836]: Quelles sont les garanties incluses dans une assurance scooter AMV ?
              - img [ref=e837]
            - paragraph [ref=e839]: AMV propose 4 formules d’assurance scooter. L'offre inclut dès sa première formule la Responsabilité civile, l'Assistance juridique et la garantie des équipements de protection (gants jusqu’à 70 €, casque jusqu’à 250 €, gilet airbag jusqu’à 500 € s'ils sont détériorés à la suite d'un sinistre, sous conditions). Selon la formule, vous pouvez bénéficier en plus des garanties Vol/Incendie, Dommages collision, et Dommages tous accidents (Tous Risques). D'autres garanties comme l’Assistance 0 km, l’Individuelle Pilote ou l’Option Plus (extension de garantie aux accessoires et équipements jusqu’à 5 000 €) sont également proposées en option.
          - generic [ref=e840] [cursor=pointer]:
            - generic [ref=e841]:
              - generic [ref=e842]: Quand prennent effet les garanties de mon assurance scooter ?
              - img [ref=e843]
            - paragraph [ref=e845]: Les garanties prennent effet immédiatement à la souscription ou à la date choisie (qui peut être différée jusqu’à deux mois).
          - generic [ref=e846] [cursor=pointer]:
            - generic [ref=e847]:
              - generic [ref=e848]: Comment savoir si ma demande d’assurance scooter a bien été enregistrée ?
              - img [ref=e849]
            - paragraph [ref=e851]: À la fin de votre souscription en ligne, un numéro de souscription vous est communiqué et une confirmation vous est envoyée par e-mail.
          - generic [ref=e852] [cursor=pointer]:
            - generic [ref=e853]:
              - generic [ref=e854]: Qu’est-ce qu’une franchise en assurance scooter AMV ?
              - img [ref=e855]
            - paragraph [ref=e857]: En cas de sinistre, la franchise est la part de l'indemnité qui reste à la charge de l'assuré suite à la mise en jeu d'une garantie dommages. Chez AMV, elle est plafonnée, avec un minimum et un maximum variable selon la cylindrée. Le détail des franchises est précisé dans les Dispositions Particulières.
          - generic [ref=e858] [cursor=pointer]:
            - generic [ref=e859]:
              - generic [ref=e860]: AMV propose-t-elle une assurance scooter pour les jeunes conducteurs ?
              - img [ref=e861]
            - generic [ref=e862]:
              - paragraph [ref=e863]: Oui, AMV propose des formules adaptées à tous les profils, y compris les jeunes conducteurs (sous réserve d'acceptation des conditions de souscription). AMV a des conditions de souscription parmi les plus larges du marché. La tarification prend en compte de nombreux critères notamment l’âge, l’expérience et l’historique de conduite, le lieu de stationnement. Vous pouvez obtenir un devis personnalisé en ligne.
              - paragraph [ref=e864]: Oui. AMV assure tous les profils, y compris les jeunes conducteurs et les novices. Une surprime jeune conducteur s'applique les premières années puis diminue progressivement sans sinistre responsable. La tarification tient compte de votre expérience et de votre bonus-malus. Que vous preniez la route pour la première fois ou rouliez depuis des années, AMV a une formule pour vous.
          - generic [ref=e865] [cursor=pointer]:
            - generic [ref=e866]:
              - generic [ref=e867]: Peut-on modifier ses garanties d’assurance scooter en ligne ?
              - img [ref=e868]
            - paragraph [ref=e870]: Oui, il est possible de modifier ses garanties et options à tout moment via votre espace client (Mon Espace AMV) sur amv.fr, selon les conditions de votre contrat.
          - generic [ref=e871] [cursor=pointer]:
            - generic [ref=e872]:
              - generic [ref=e873]: Comment déclarer un sinistre scooter avec AMV ?
              - img [ref=e874]
            - generic [ref=e875]:
              - paragraph [ref=e876]: Vous pouvez déclarer un sinistre directement depuis votre espace client (Mon Espace AMV) sur le site amv.fr. Un gestionnaire dédié s'occupe de la gestion de votre dossier.
              - paragraph [ref=e877]: Déclaration directement depuis Mon Espace AMV sur amv.fr, 24h/24. Suite à votre déclaration, un gestionnaire dédié prend en charge votre dossier et vous accompagne dans toutes les démarches d'indemnisation.
          - generic [ref=e878] [cursor=pointer]:
            - generic [ref=e879]:
              - generic [ref=e880]: AMV propose-t-elle une assistance 0 km scooter ?
              - img [ref=e881]
            - paragraph [ref=e883]: Oui, l’option Assistance 0 km est proposée dès la formule 2. Elle inclut une assistance sans franchise kilométrique, en cas de panne, accident, vol, tentative de vol, crevaison, perte de clés ou mise en fourrière, pour votre scooter, le pilote et le passager.
          - generic [ref=e884] [cursor=pointer]:
            - generic [ref=e885]:
              - generic [ref=e886]: Quels équipements sont couverts par l’assurance scooter AMV ?
              - img [ref=e887]
            - generic [ref=e888]:
              - paragraph [ref=e889]: Dès la formule de base, AMV couvre le casque, les gants et le gilet airbag détériorié suite à un sinistre, sous conditions, dans la limite des plafonds indiqués. Avec l’Option Plus, la couverture est étendue à l’ensemble de l’équipement vestimentaire de protection du motard et aux accessoires hors-série montés sur le scooter, jusqu’à 5 000 €, sous conditions.
              - paragraph [ref=e890]: "Dès la première formule : casque (jusqu'à 250 euros), gants (jusqu'à 70 euros) et gilet airbag (jusqu'à 500 euros) en cas de sinistre. Avec l'Option plus, couverture étendue à l'ensemble de l'équipement vestimentaire et aux accessoires hors-série montés sur votre scooter, jusqu'à 5 000 euros."
          - generic [ref=e891]:
            - generic [ref=e892]: H3
            - text: Comment assurer un scooter 125 cm3 ?
          - paragraph [ref=e893]: Pour assurer un scooter 125, vous devez être titulaire du permis A1 ou du permis B avec une formation complémentaire de 7 heures. Munissez-vous de votre permis de conduire, de la carte grise et de votre relevé d'informations. AMV assure tous les scooters 125 cm3, du Honda PCX au Yamaha NMAX, avec des formules adaptées à votre usage.
          - generic [ref=e894]:
            - generic [ref=e895]: H3
            - text: L'assurance scooter couvre-t-elle le passager ?
          - paragraph [ref=e896]: Oui. La responsabilité civile couvre les dommages causés à votre passager, et l'option Individuelle pilote peut être étendue pour le protéger en cas d'accident. L'assistance 0 km prend également en charge le passager lors d'un dépannage ou d'un rapatriement.
          - generic [ref=e897]:
            - generic [ref=e898]: H3
            - text: Quelle assurance pour un scooter d'occasion ?
          - paragraph [ref=e899]: Pour un scooter d'occasion de faible valeur, la formule Responsabilité civile ou Vol / Incendie peut généralement suffire. Pour un scooter d'occasion récent et de valeur, une formule Dommages collision ou Tous risques reste pertinente. AMV vous aide à choisir la formule qui correspond à la valeur réelle de votre véhicule assuré.
          - generic [ref=e900]:
            - generic [ref=e901]: H3
            - text: Comment résilier son assurance scooter ?
          - paragraph [ref=e902]: Après la première année, vous pouvez résilier votre assurance scooter à tout moment grâce à la loi Hamon, sans frais ni pénalité. Avant la première échéance, la résiliation est possible dans certains cas (vente du scooter, changement de situation). Un conseiller AMV vous accompagne dans la démarche.
          - generic [ref=e903]:
            - generic [ref=e904]: H3
            - text: Peut-on modifier ses garanties d'assurance scooter en cours de contrat ?
          - paragraph [ref=e905]: Oui. Vous pouvez faire évoluer vos garanties et vos options à tout moment depuis votre espace client Mon Espace AMV, en fonction de votre usage et de la saison. La modification prend effet selon les conditions de votre contrat.
          - generic [ref=e906]:
            - generic [ref=e907]: H3
            - text: Le scooter électrique est-il plus cher à assurer ?
          - paragraph [ref=e908]: Pas nécessairement. Chez AMV, le scooter électrique s'assure dans les mêmes conditions qu'un scooter thermique, avec les mêmes formules et garanties. La cotisation dépend surtout de la valeur du véhicule, de votre profil et du niveau de couverture choisi, pas du type de motorisation.
          - generic [ref=e909]:
            - generic [ref=e910]: H3
            - text: L'assurance scooter couvre-t-elle les trajets domicile-travail ?
          - paragraph [ref=e911]: Oui. Les trajets domicile-travail font partie de l'usage couvert par votre assurance scooter AMV, comme l'ensemble de vos déplacements urbains et périurbains du quotidien. L'assistance 0 km vous dépanne sur ces trajets, dès le bas de chez vous.
