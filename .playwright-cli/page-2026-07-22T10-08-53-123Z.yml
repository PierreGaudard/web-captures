          - listitem [ref=e64]:
            - text: Les sportives, comme la
            - link "Panigale V4 R" [ref=e65] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-ducati/assurance-panigale-v4-r/
            - text: ", dont la valeur justifierait en général la formule la plus complète."
        - paragraph [ref=e66]: "Sur les modèles les plus puissants de la gamme, deux règles s'appliquent : l'assurance des hypersportives est accessible si vous avez plus de 30 ans ou des antécédents d'assurance, et un jeune permis ne pourrait pas être assuré sur une sportive. Côté piste, le roulage libre sur circuit est assuré ; la compétition, elle, n'est couverte par aucune garantie."
        - heading "Les formules d'assurance moto Ducati" [level=2] [ref=e67]
        - paragraph [ref=e68]: "AMV propose les formules de garanties et options adaptées à votre Ducati et à l'usage que vous en faites. Un seul contrat d'assurance moto, quatre formules : à vous de choisir selon la valeur de votre moto, sa fréquence d'utilisation et votre budget."
        - paragraph [ref=e69]: La formule Responsabilité civile, couverture minimale obligatoire, couvre les dommages causés aux tiers lors d'un sinistre responsable. Elle pourrait convenir à une Ducati de faible valeur.
        - paragraph [ref=e70]: "La formule Vol / Incendie ajoute la protection de votre moto contre le vol et l'incendie, avec une indemnisation à la valeur de remplacement à dire d'expert ou à la valeur à neuf durant les 6 premiers mois. Elle serait à envisager si votre Ducati stationne majoritairement sur la voie publique, où le risque est plus élevé. Le gravage du deux-roues, lui, divise la franchise vol par 2 chez AMV : sur une moto de valeur, l'économie n'a rien d'anecdotique."
        - paragraph [ref=e71]: La formule Dommages collision, la garantie distinctive d'AMV, couvre les dommages causés à votre moto lors d'une collision avec un tiers identifié, déduction faite, en cas de sinistre responsable, de la franchise prévue au contrat. Elle permet une meilleure couverture tout en maîtrisant votre budget.
        - paragraph [ref=e72]: La formule Tous risques couvre les dommages subis par votre deux-roues quelles que soient les circonstances. C'est la formule que choisissent la plupart des propriétaires de Ducati neuves, récentes ou financées à crédit, la remise en état d'une moto premium représentant des coûts élevés.
        - paragraph [ref=e73]: "Votre équipement de pilote, enfin, est couvert dès la première formule : casque, gants et gilet airbag sont garantis s'ils sont détériorés lors d'un événement couvert."
