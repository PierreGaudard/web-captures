        - heading "Questions fréquentes sur l'assurance moto Ducati" [level=2] [ref=e162]
        - heading "Quel est le prix d'une assurance moto Ducati ?" [level=3] [ref=e163]
        - paragraph [ref=e164]: "Il n'existe pas de tarif unique : chaque cotisation est calculée selon le modèle, sa date de première mise en circulation, le lieu de stationnement, le niveau de couverture et la sinistralité déclarée. La gamme Ducati étant large, le tarif d'un Scrambler se situe en général bien en dessous de celui d'une Panigale ou d'une Streetfighter V4. Le devis en ligne, gratuit, vous donne un tarif personnalisé pour votre Ducati en quelques minutes."
        - heading "Quelle formule d'assurance choisir pour une Ducati ?" [level=3] [ref=e165]
        - paragraph [ref=e166]: Le choix dépend surtout de la valeur de votre moto. La plupart des Ducati récentes justifieraient une formule Tous risques, la remise en état d'une moto premium représentant des coûts élevés. La formule Vol / Incendie serait pertinente si votre moto stationne dehors, et la formule Dommages collision renforce la couverture en cas d'accident avec un tiers identifié, tout en maîtrisant votre budget. Votre conseiller AMV peut vous orienter selon votre modèle.
        - heading "Peut-on assurer une Ducati avec un permis A2 ?" [level=3] [ref=e167]
        - paragraph [ref=e168]:
          - text: "Oui, sur les modèles compatibles : certaines versions bridées à 35 kW, comme sur le Scrambler ou le Monster, conviennent au"
          - link "permis A2" [ref=e169] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-moto/assurance-moto-permis-a2/
          - text: . En revanche, un jeune permis ne pourrait pas être assuré sur une sportive comme la Panigale, et l'assurance des hypersportives est accessible si vous avez plus de 30 ans ou des antécédents d'assurance. Le devis en ligne s'adapte au modèle exact que vous renseignez.
        - heading "Comment protéger sa Ducati contre le vol ?" [level=3] [ref=e170]
        - paragraph [ref=e171]: "La garantie Vol / Incendie, disponible dès la deuxième formule, indemnise votre moto à la valeur de remplacement à dire d'expert, ou à la valeur à neuf durant les 6 premiers mois. Le montant d'indemnisation est identique quelle que soit la formule : ce sont la valeur du véhicule et la franchise qui le déterminent. Chez AMV, le gravage de votre deux-roues divise la franchise vol par 2. Un stationnement en lieu clos reste par ailleurs un bon réflexe de prévention, particulièrement en ville."
      - generic [ref=e172]:
