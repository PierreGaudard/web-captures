          - text: .
      - generic [ref=e113]:
        - paragraph [ref=e115]: Ducati Motor Holding S.p.A., le célèbre constructeur italien de motos basé à Bologne en Émilie-Romagne, incarne l'essence même de l'ingénierie et de la passion motocycliste. L'histoire fascinante de cette entreprise remonte à 1926, lorsque la famille Ducati, originaire de la Sardaigne, créa la « Società Scientifica Radio Brevetti Ducati » avec pour objectif initial la production de condensateurs électriques et de composants pour la transmission radio.
        - generic [ref=e116]:
          - 'heading "Ducati : l''épopée italienne de l''ingénierie moto, de la renaissance après la guerre à la conquête mondiale avec Audi." [level=4] [ref=e117]':
            - strong [ref=e118]: "Ducati : l'épopée italienne de l'ingénierie moto, de la renaissance après la guerre à la conquête mondiale avec Audi."
          - paragraph [ref=e119]
          - paragraph [ref=e120]: L'entreprise a traversé des épreuves pendant la Seconde Guerre mondiale, avec l'occupation allemande de son usine à Borgo Panigale en 1943, suivie de sa destruction lors des bombardements alliés en 1944. Cependant, les frères Ducati ont montré une résilience remarquable en relançant leur activité après la guerre. En 1946, ils ont produit le Cucciolo, un moteur auxiliaire destiné à s'adapter sur le cadre des bicyclettes. Malheureusement, cette tentative n'a pas connu le succès escompté, entraînant des difficultés financières qui ont conduit à la faillite en 1949. Les frères Ducati se sont retirés, laissant l'entreprise sous le contrôle de l'État italien jusqu'en 1983.
          - paragraph [ref=e121]
          - paragraph [ref=e122]: La renaissance de Ducati a eu lieu en 1983, lorsque les frères Castiglioni, propriétaires de Cagiva, ont racheté la société. Cependant, en 1996, Ducati a été confronté à de nouveaux défis financiers et a été acquis par le fonds d'investissement américain Texas Pacific Group. Ce n'est qu'en 2006 que la marque est redevenue entièrement italienne, grâce à l'acquisition par le fonds d'investissement italien InvestIndustrial.
          - paragraph [ref=e123]
          - paragraph [ref=e124]: Le tournant majeur s'est produit en 2012, lorsque le constructeur automobile allemand Audi, filiale du Groupe Volkswagen, a acquis Ducati pour la somme impressionnante de 860 millions d'euros. Cette acquisition a consolidé la position de Ducati sur le marché mondial de la moto, ouvrant de nouvelles perspectives et renforçant sa réputation d'excellence.
          - paragraph [ref=e125]
          - paragraph [ref=e126]: Ducati est célèbre pour ses moteurs bicylindres en « V » à 90° et sa distribution desmodromique, des caractéristiques techniques qui distinguent ses motos sur le plan de la performance. La renommée de Ducati s'est consolidée au fil de ses nombreuses victoires en compétition moto, que ce soit dans les Grand-Prix ou en Endurance.
          - paragraph [ref=e127]
          - paragraph [ref=e128]: Au fil des décennies, Ducati a élargi sa gamme de produits, passant des machines utilitaires des années 1940 aux motos sportives emblématiques des années 1960 et 1970. Les modèles tels que la 750 GT, la Desmosedici RR, la Multistrada et la Panigale ont marqué des époques et défini de nouvelles normes en matière de design et de performances.
          - paragraph [ref=e129]
          - paragraph [ref=e130]: La production de Ducati ne se limite pas seulement aux motos sportives, mais englobe également des segments tels que les gros trails routiers, les motos néo-rétro et les machines de tourisme. L'innovation continue avec des modèles tels que la 1199 Panigale, qui a introduit des changements notables, abandonnant certaines traditions au profit de l'efficacité et de la performance.
          - paragraph [ref=e131]
          - paragraph [ref=e132]: Aujourd'hui, Ducati continue de susciter l'admiration des amateurs de motos du monde entier, avec son mariage réussi de puissance, de style et de technologie. Avec une histoire riche et une vision constante d'aller au-delà des limites, Ducati reste une icône dans le monde des motos, une fusion parfaite entre l'art italien et l'ingénierie de pointe.
        - generic [ref=e133]:
          - heading "Conclusion" [level=4] [ref=e134]:
            - strong [ref=e135]: Conclusion
          - paragraph [ref=e136]
          - paragraph [ref=e137]: Ainsi, l'histoire captivante de Ducati s'étend sur plusieurs décennies, ponctuée de défis surmontés, de renaissances audacieuses et de triomphes sur les circuits du monde entier. De ses modestes débuts dans la production de composants radio à son acquisition par Audi, Ducati a transcendé les frontières pour devenir une légende de l'ingénierie motocycliste italienne. Avec son héritage riche, sa passion indomptable et son engagement envers l'innovation, Ducati continue de réinventer l'avenir de la moto.
