        - paragraph [ref=e98]: La Défense pénale et recours suite à accident, associée à la Protection juridique, vous accompagne en cas de litige lié à un accident, jusqu'à 20 000 € au total.
        - heading "Les options pour une protection à la hauteur de votre Ducati" [level=2] [ref=e99]
        - paragraph [ref=e100]: Des options viennent compléter ces formules, côté pilote comme côté équipements.
        - paragraph [ref=e101]: "L'Option Individuelle Pilote verse un capital, jusqu'à 800 000 euros, en cas d'invalidité permanente, ou à vos ayants droit en cas de décès, même lors d'un accident responsable. Sur des motos aux performances élevées, cette protection du pilote lui-même n'a rien d'accessoire : la Responsabilité civile ne couvre que les dommages causés aux autres."
        - paragraph [ref=e102]: "Avec l'Option Plus, votre deux-roues acheté neuf, volé ou détruit suite à un sinistre est remboursé à sa valeur d'achat pendant un an et demi à compter de la date d'achat. L'ensemble de votre équipement moto est couvert en vol comme en dommages, mais également les accessoires hors-série et top case, dans la limite de 5 000 € : pertinent pour une Panigale équipée d'un échappement ou de protections de carénage, comme pour une Multistrada avec ses valises."
        - paragraph [ref=e103]: "AMV propose aussi une assistance en option, pour un dépannage sur mesure : votre moto est dépannée ou remorquée jusqu'à la concession la plus proche, le pilote et son passager sont rapatriés. La crevaison est incluse."
        - heading "Quel est le prix d'une assurance moto Ducati ?" [level=2] [ref=e104]
        - paragraph [ref=e105]: Le tarif d'une assurance Ducati est personnalisé. Il est établi à partir du modèle assuré, de sa date de première mise en circulation, du lieu de stationnement, du niveau de couverture choisi et de la sinistralité déclarée. À profil identique, un Scrambler ne s'assurerait donc pas au même prix qu'une Panigale V4 R, dont la valeur est plusieurs fois supérieure.
        - paragraph [ref=e106]: Pour connaître le coût exact pour votre moto, le devis en ligne AMV, gratuit et sans engagement, vous donne en quelques minutes le tarif de chaque formule. Vous pouvez ainsi ajuster la couverture à votre budget avant de souscrire.
        - heading "Pourquoi assurer votre Ducati chez AMV ?" [level=2] [ref=e107]
        - paragraph [ref=e108]: AMV, spécialiste de l'assurance deux-roues fondée en 1974 par un passionné de moto, pour les motards, compte plus d'1 million d'assurés et affiche une note de satisfaction de 4,7 sur 5 via Avis Vérifiés. Nos plus de 350 conseillers, basés à Bordeaux, connaissent les spécificités de la gamme Ducati et vous accompagnent en toute confiance, du devis à la gestion des sinistres.
        - paragraph [ref=e109]:
          - text: "Côté démarches : un devis gratuit en quelques clics, peu de justificatifs là où d'autres assureurs réclament davantage de pièces, et une couverture qui peut prendre effet immédiatement, sous réserve de certaines conditions. Vous gérez ensuite votre contrat en toute autonomie depuis Mon Espace AMV. Découvrez également notre"
          - link "assurance moto" [ref=e110] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance/moto/
          - text: pour l'ensemble des
