        - generic [ref=e41]: Nouveau contenu optimise
        - paragraph [ref=e42]: "Du Scrambler à la Panigale en passant par le Monster et la Multistrada, AMV, spécialiste de l'assurance deux-roues, assure toute la gamme Ducati. Un seul contrat, quatre formules et des options au choix : le devis en ligne, gratuit, donne en quelques clics le tarif de chaque formule pour votre modèle. Les motos de Borgo Panigale affichant souvent une valeur élevée, le choix de la couverture compte autant que celui du modèle."
        - list [ref=e43]:
          - listitem [ref=e44]: "Toute la gamme Ducati est assurable : Monster, Multistrada, Diavel, Scrambler, Streetfighter et Panigale."
          - listitem [ref=e45]: Quatre formules au choix, de la Responsabilité civile à la formule Tous risques, souvent pertinente vu la valeur des modèles.
          - listitem [ref=e46]: Le casque, les gants et le gilet airbag sont couverts dès la première formule.
          - listitem [ref=e47]: "Le tarif est personnalisé : modèle, date de mise en circulation, lieu de stationnement, niveau de couverture et sinistralité déclarée."
          - listitem [ref=e48]: Devis gratuit en ligne, souscription rapide avec peu de justificatifs.
        - heading "Ducati, l'excellence motocycliste italienne" [level=2] [ref=e49]
        - paragraph [ref=e50]: Fondée en 1926 à Bologne par les frères Ducati, l'entreprise s'est d'abord consacrée aux composants radio avant de trouver sa voie dans la moto, depuis son site historique de Borgo Panigale. Ducati Motor Holding, propriété du groupe allemand Audi depuis 2012, s'est bâti une renommée mondiale grâce à ses moteurs bicylindres en V, sa distribution desmodromique et ses succès en compétition. Du roadster Monster à l'hypersportive Panigale, chaque moto Ducati conjugue design italien et technologies de pointe.
        - paragraph [ref=e51]: "Une Ducati reste avant tout une moto de valeur : sa couverture se dimensionne en conséquence, et une protection étendue se justifierait dans la plupart des cas."
        - heading "Quelle assurance selon votre modèle Ducati ?" [level=2] [ref=e52]
        - paragraph [ref=e53]: "Le choix de la formule dépend surtout de la valeur de votre moto et de sa fréquence d'utilisation :"
