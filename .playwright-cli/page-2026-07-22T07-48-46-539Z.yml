        - paragraph [ref=e104]: "La Défense pénale et recours suite à accident, associée à la Protection juridique, vous accompagne en cas de litige lié à un accident : ces garanties interviennent jusqu'à 20 000 € au total."
        - heading "Les options pour compléter la couverture" [level=2] [ref=e105]
        - paragraph [ref=e106]: Au-delà des formules, AMV vous laisse le choix parmi des options complémentaires dédiées au conducteur et aux équipements, pour une protection ajustée à vos besoins.
        - paragraph [ref=e107]: "L'Option Individuelle Pilote verse un capital, jusqu'à 800 000 euros, en cas d'invalidité permanente, ou à vos ayants droit en cas de décès, même lors d'un accident responsable. Pour un jeune conducteur qui découvre la route, cette protection du conducteur lui-même mérite réflexion : la Responsabilité civile ne couvre que les dommages causés aux autres."
        - paragraph [ref=e108]: "AMV propose également une assistance en option, pour un dépannage sur mesure : la prise en charge comprend le dépannage ou le remorquage de votre scooter jusqu'à la concession la plus proche, tandis que le conducteur et son passager sont rapatriés. La crevaison est incluse dans l'assistance, un incident fréquent sur les cyclos."
        - heading "Quel prix pour une assurance scooter 50cc ?" [level=2] [ref=e109]
        - paragraph [ref=e110]: Les tarifs d'une assurance scooter 50cc varient d'un assuré à l'autre, car chaque cotisation est personnalisée. Chez AMV, le tarif est établi à partir du modèle assuré, de sa date de première mise en circulation, du lieu de stationnement, du niveau de couverture choisi et de la sinistralité déclarée. À profil identique, un cyclo récent d'une grande marque ne s'assurerait donc pas au même prix que des modèles plus abordables.
        - paragraph [ref=e111]:
          - text: "À noter pour les 50cc : la motorisation joue sur le tarif. Un scooter"
          - link "électrique" [ref=e112] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-scooter/assurance-scooter-electrique/
          - text: bénéficie ainsi d'une assurance moins chère que son équivalent thermique.
        - paragraph [ref=e113]: "Le choix de la formule reste le principal levier pour ajuster votre budget : une Responsabilité civile seule pour un cyclo de faible valeur, une formule Vol / Incendie ou Tous risques pour un modèle neuf que vous souhaitez protéger davantage. Pour obtenir un devis, quelques minutes suffisent en ligne : gratuit et sans engagement, il vous permet de comparer le tarif de chaque formule pour votre scooter et de choisir en connaissance de cause."
        - heading "Pourquoi assurer votre scooter 50cc chez AMV ?" [level=2] [ref=e114]
        - paragraph [ref=e115]: AMV, spécialiste de l'assurance deux-roues fondée en 1974 par un passionné de moto, pour les motards, compte plus d'1 million d'assurés et affiche une note de satisfaction de 4,7 sur 5 via Avis Vérifiés. Nos plus de 350 conseillers, basés à Bordeaux, connaissent les spécificités des cyclos et accompagnent chaque année de nombreux parents dans l'assurance du premier deux-roues de leur enfant.
        - paragraph [ref=e116]: "Les avantages de notre assurance cyclo en un coup d'œil :"
