        - paragraph [ref=e42]: "En résumé : l'assurance scooter 50cc est obligatoire dès la mise en circulation du véhicule, avec au minimum une garantie Responsabilité civile. Chez AMV, spécialiste de l'assurance deux-roues depuis plus de 50 ans, le 50cc dispose d'une offre dédiée en trois formules, avec le casque, les gants et le gilet airbag couverts dès la première. Le devis en ligne est gratuit et prend quelques minutes."
