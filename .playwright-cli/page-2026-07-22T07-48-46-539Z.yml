        - heading "Le scooter 50cc, un premier deux-roues accessible dès 14 ans" [level=2] [ref=e49]
        - paragraph [ref=e50]:
          - text: "En France, le scooter 50cc appartient à la catégorie des cyclomoteurs : sa cylindrée ne dépasse pas 50 cm³ et sa vitesse est limitée à 45 km/h. L'assurance cyclo couvre d'ailleurs différents véhicules de cette famille : scooters, mobylettes et petites motos de moins de 50cc. Pour beaucoup de jeunes, ce type de deux-roues représente le premier contact avec la conduite, bien avant la voiture ou la"
          - link "moto 50cc" [ref=e51] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-moto/assurance-moto-50cm3/
          - text: .
        - paragraph [ref=e52]:
          - text: La conduite d'un scooter 50cc est possible dès 14 ans, à condition d'être titulaire du
          - link "permis AM" [ref=e53] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-scooter/assurance-scooter-permis-am/
          - text: ", qui a remplacé le"
          - link "BSR" [ref=e54] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-scooter/assurance-scooter-permis-bsr/
          - text: "en 2013. Cette formation de 8 heures, accessible en auto-école, comprend une partie théorique et une pratique en circulation. Seules les personnes nées avant le 31 décembre 1987 en sont dispensées : elles peuvent conduire un cyclo sans permis ni formation."
        - paragraph [ref=e55]: "Un point mérite l'attention des parents : si votre enfant conduit le scooter dès 14 ans, la souscription du contrat d'assurance, elle, s'effectue par une personne majeure. C'est donc généralement vous qui assurez le scooter 50cc de votre adolescent, en le désignant comme conducteur."
        - heading "Pourquoi assurer son scooter 50cc est obligatoire" [level=2] [ref=e56]
        - paragraph [ref=e57]: "Comme tout véhicule terrestre à moteur, un scooter 50cc doit être assuré au minimum en Responsabilité civile pour circuler, et ce dès sa mise en circulation. Cette obligation vaut aussi pour un cyclo qui roule peu, ou qui reste stationné sur la voie publique : tant que le véhicule est en état de rouler, son assurance reste obligatoire, comme pour les autres véhicules du foyer."
        - paragraph [ref=e58]: "Conduire sans assurance expose à une amende pouvant atteindre 3 750 €, accompagnée de peines complémentaires comme la confiscation du véhicule. Depuis 2024, la carte verte n'existe plus : en cas de contrôle, les forces de l'ordre vérifient directement l'immatriculation dans le fichier des véhicules assurés, et vous trouvez votre attestation d'assurance à tout moment dans votre espace client."
        - generic [ref=e59]:
          - generic [ref=e60]: ✓
          - generic [ref=e61]: Le saviez-vous ? La carte grise est également obligatoire pour un scooter 50cc, même s'il ne nécessite pas de permis B pour être conduit.
        - heading "Les formules AMV pour assurer votre scooter 50cc" [level=2] [ref=e62]
        - paragraph [ref=e63]: Chez AMV, le 50cc bénéficie d'une offre dédiée, distincte de l'assurance des scooters 125cc et maxi-scooters. Elle compte trois formules d'assurance, du minimum légal à la couverture la plus complète, pour adapter la protection à la valeur de votre cyclo et à votre budget.
        - heading "Formule Responsabilité civile" [level=3] [ref=e64]
        - paragraph [ref=e65]: "Elle constitue la couverture minimale obligatoire : elle couvre les dommages causés aux tiers lors d'un sinistre responsable. Elle peut suffire pour un scooter de faible valeur, acheté d'occasion par exemple."
        - heading "Formule Vol / Incendie" [level=3] [ref=e66]
        - paragraph [ref=e67]: "Elle ajoute la protection du scooter lui-même contre le vol, l'incendie et les événements associés. Les 50cc stationnant souvent dans la rue, devant le lycée ou au pied d'un immeuble, cette garantie serait à envisager si votre scooter dort majoritairement sur la voie publique. En cas de vol, votre scooter est remboursé à la valeur de remplacement à dire d'expert, ou à la valeur à neuf durant les 6 premiers mois du véhicule. Bon à savoir : le gravage de votre deux-roues divise la franchise vol par 2 chez AMV."
        - heading "Formule Tous risques" [level=3] [ref=e68]
        - paragraph [ref=e69]: Elle couvre les dommages subis par votre scooter quelles que soient les circonstances, y compris en cas de chute sans tiers ou d'accident responsable. Elle serait recommandée pour un cyclo neuf ou récent, dont la remise en état représenterait des frais importants. L'indemnisation s'effectue selon les conditions du contrat, déduction faite, en cas de sinistre responsable, de la franchise prévue.
        - paragraph [ref=e70]: "Quelle que soit la formule que vous choisissez, votre équipement bénéficie d'une prise en charge dès la première : le casque, les gants et le gilet airbag sont couverts s'ils sont détériorés lors d'un événement garanti. Un vrai plus pour les jeunes conducteurs, dont l'équipement représente souvent un investissement conséquent."
