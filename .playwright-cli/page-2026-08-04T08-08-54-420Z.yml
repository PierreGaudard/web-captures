      - generic [ref=e42]:
        - 'heading "Moto avec permis A2 : contrat d’assurance et garanties" [level=2] [ref=e43]'
        - paragraph [ref=e44]
        - paragraph [ref=e45]: Intermédiaire entre le permis A1 et le permis A, le permis moto A2 est réservé aux individus de plus de 18 ans. Il ne permet pas de conduire toutes les cylindrées, mais uniquement les deux-roues dont la puissance est inférieure ou égale à 35 kw, ou les trois-roues dotés d'une puissance maximale de 15 kw.
        - paragraph [ref=e46]
        - paragraph [ref=e47]: Si le coût d’une assurance moto pour un conducteur ayant son permis A2 est généralement plus élevé que celle d’un motard expérimenté, notamment en raison du manque d’expérience, il est tout à fait possible de bénéficier d’un tarif intéressant en jouant sur les garanties, en choisissant bien votre moto, et en la protégeant correctement.
        - paragraph [ref=e48]
        - paragraph [ref=e49]: "Selon vos besoins réels, AMV propose de nombreuses options d’assurance moto dédiées aux titulaires du permis A2 :"
        - list [ref=e50]:
          - listitem [ref=e51]: Une souscription 100 % en ligne accessible 24h/24 et 7j/7,
          - listitem [ref=e52]: Une gestion personnalisée en cas de sinistre,
          - listitem [ref=e53]: Une équipe de plus de 300 conseillers à votre écoute,
          - listitem [ref=e54]: Plus de 750 000 contrats d’assurance en cours,
          - listitem [ref=e55]: Plus de 50 ans d’expérience au service des passionnés de deux-roues.
      - generic [ref=e56]:
        - heading "Comment assurer sa moto ?" [level=2] [ref=e57]
        - paragraph [ref=e58]
        - paragraph [ref=e59]:
          - text: Bien
          - link "assurer votre moto" [ref=e60] [cursor=pointer]:
            - /url: /assurance/moto/
          - text: est essentiel pour prendre la route en toute sérénité. Pour cela, pourquoi ne pas opter pour l'assurance en ligne proposée par AMV, un assureur de confiance spécialiste de l'assurance moto depuis 50 ans.
        - paragraph [ref=e61]
        - paragraph [ref=e62]: AMV propose la souscription simple et rapide en ligne vous permettant de bénéficier d'une couverture immédiate, sous réserve de certaines conditions. Plus besoin de vous déplacer en agence, quelques clics suffisent pour être assuré.
        - paragraph [ref=e63]
        - paragraph [ref=e64]:
          - text: AMV propose une
          - link "gamme complète de formules d'assurance moto" [ref=e65] [cursor=pointer]:
            - /url: /assurance/moto/
          - text: ", adaptées à vos besoins et à votre budget. Quel que soit le type de moto que vous possédez, que ce soit une sportive, une routière, ou encore un scooter, AMV vous propose des solutions sur mesure pour une protection optimale."
        - paragraph [ref=e66]
        - paragraph [ref=e67]: En cas de sinistre, AMV met à votre disposition un service d'assistance réactif, disponible 24 heures sur 24 et 7 jours sur 7, si vous avez opté pour cette option. Vous pouvez ainsi compter sur une assistance en toutes circonstances, qu'il s'agisse d'un accident, d'un vol ou d'une panne.
        - paragraph [ref=e68]
        - paragraph [ref=e69]: Experts de l'assurance moto, les conseillers AMV sont des passionnés de deux-roues, appréhendant ainsi aisément vos besoins spécifiques en tant que motard. Ils sauront vous accompagner et vous conseiller au mieux tout au long de votre contrat.
        - paragraph [ref=e70]
        - paragraph [ref=e71]:
          - text: En choisissant
          - link "AMV comme assureur pour votre moto" [ref=e72] [cursor=pointer]:
            - /url: https://www.amv.fr/
          - text: ", vous bénéficiez d'une assurance fiable et de qualité, sans perte de temps. N'attendez plus, rendez-vous sur amv.fr pour souscrire votre assurance moto en ligne et prendre la route en toute tranquillité dès maintenant !"
