      - generic [ref=e41]:
        - generic [ref=e42]:
          - heading "AMV Moto dévoile les secrets des 125cm³" [level=2] [ref=e43]
          - paragraph [ref=e44]
          - paragraph [ref=e45]: AMV Moto vous invite à découvrir l'univers des 125cm³, un segment emblématique qui séduit autant les jeunes conducteurs que les motards aguerris.
          - paragraph [ref=e46]: Pour les novices, la 125cm³ représente le premier pas vers l'aventure sur deux roues, synonyme d'indépendance et de premières sensations fortes. Pour les passionnés aguerris, elle évoque la nostalgie de compétitions mémorables.
          - paragraph [ref=e47]
          - paragraph [ref=e48]: La Yamaha DTMX 125, lancée en 1977, reste un modèle de référence pour ceux qui l'ont connue. Avec son design sobre et élégant, elle est devenue la moto des jeunes à la recherche d'un véhicule rebelle. Honda a suivi cette tendance en introduisant la 125 XLS dès 1978, marquant ainsi l'engouement pour ce segment. Au milieu des années 80, la Suzuki 125 RG Gamma a révolutionné le marché avec une des premières sportives en 125cm³, offrant légèreté et maniabilité. Elle s'est distinguée comme l'une des motos les plus attrayantes en 1985 grâce à son design sportif. L'Aprilia 125 RS, introduite en 1998, est célèbre pour avoir été le tremplin de Valentino Rossi, légende du motoGP. Ce modèle combine performance, fiabilité et un rapport poids/puissance/plaisir exceptionnel, captivant tous ceux qui la croisent.
          - paragraph [ref=e49]: Aujourd'hui, le marché du 125cm³ continue de se renouveler avec des modèles tels que le roadster Honda CB 125 R, qui brille par sa légèreté et ses innovations, et la Mash New Seventy 125, qui séduit par sa simplicité et son style rétro.
        - generic [ref=e51]:
          - heading "Conclusion sur la moto 125cm³" [level=2] [ref=e52]
          - paragraph [ref=e53]
          - paragraph [ref=e54]: Les 125cm³ restent une pierre angulaire de la culture motarde qui traverse les générations. Que l'on recherche la sensation de liberté, l'adrénaline des premières accélérations, ou que l'on souhaite simplement se remémorer les jours de gloire de ce segment, la 125cm³ a une histoire riche et diversifiée qui continue d'inspirer et de fasciner. AMV Moto accompagne avec plaisir chaque motard dans la découverte de cet univers passionnant.
      - generic [ref=e55]:
        - heading "Comment assurer sa moto ?" [level=2] [ref=e56]
        - paragraph [ref=e57]
        - paragraph [ref=e58]:
          - text: Bien
          - link "assurer votre moto" [ref=e59] [cursor=pointer]:
            - /url: /assurance/moto/
          - text: est essentiel pour prendre la route en toute sérénité. Pour cela, pourquoi ne pas opter pour l'assurance en ligne proposée par AMV, un assureur de confiance spécialiste de l'assurance moto depuis 50 ans.
        - paragraph [ref=e60]
        - paragraph [ref=e61]: AMV propose la souscription simple et rapide en ligne vous permettant de bénéficier d'une couverture immédiate, sous réserve de certaines conditions. Plus besoin de vous déplacer en agence, quelques clics suffisent pour être assuré.
        - paragraph [ref=e62]
        - paragraph [ref=e63]:
          - text: AMV propose une
          - link "gamme complète de formules d'assurance moto" [ref=e64] [cursor=pointer]:
            - /url: /assurance/moto/
          - text: ", adaptées à vos besoins et à votre budget. Quel que soit le type de moto que vous possédez, que ce soit une sportive, une routière, ou encore un scooter, AMV vous propose des solutions sur mesure pour une protection optimale."
        - paragraph [ref=e65]
        - paragraph [ref=e66]: En cas de sinistre, AMV met à votre disposition un service d'assistance réactif, disponible 24 heures sur 24 et 7 jours sur 7, si vous avez opté pour cette option. Vous pouvez ainsi compter sur une assistance en toutes circonstances, qu'il s'agisse d'un accident, d'un vol ou d'une panne.
        - paragraph [ref=e67]
        - paragraph [ref=e68]: Experts de l'assurance moto, les conseillers AMV sont des passionnés de deux-roues, appréhendant ainsi aisément vos besoins spécifiques en tant que motard. Ils sauront vous accompagner et vous conseiller au mieux tout au long de votre contrat.
        - paragraph [ref=e69]
        - paragraph [ref=e70]:
          - text: En choisissant
          - link "AMV comme assureur pour votre moto" [ref=e71] [cursor=pointer]:
            - /url: https://www.amv.fr/
          - text: ", vous bénéficiez d'une assurance fiable et de qualité, sans perte de temps. N'attendez plus, rendez-vous sur amv.fr pour souscrire votre assurance moto en ligne et prendre la route en toute tranquillité dès maintenant !"
