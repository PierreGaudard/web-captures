        - paragraph [ref=e46]
        - paragraph [ref=e47]: Intermédiaire entre le permis A1 et le permis A, le permis moto A2 est réservé aux individus de plus de 18 ans. Il ne permet pas de conduire toutes les cylindrées, mais uniquement les deux-roues dont la puissance est inférieure ou égale à 35 kw, ou les trois-roues dotés d'une puissance maximale de 15 kw.
        - paragraph [ref=e48]
        - paragraph [ref=e49]: Si le coût d’une assurance moto pour un conducteur ayant son permis A2 est généralement plus élevé que celle d’un motard expérimenté, notamment en raison du manque d’expérience, il est tout à fait possible de bénéficier d’un tarif intéressant en jouant sur les garanties, en choisissant bien votre moto, et en la protégeant correctement.
        - paragraph [ref=e50]
        - paragraph [ref=e51]: "Selon vos besoins réels, AMV propose de nombreuses options d’assurance moto dédiées aux titulaires du permis A2 :"
        - list [ref=e52]:
          - listitem [ref=e53]: Une souscription 100 % en ligne accessible 24h/24 et 7j/7,
          - listitem [ref=e54]: Une gestion personnalisée en cas de sinistre,
          - listitem [ref=e55]: Une équipe de plus de 300 conseillers à votre écoute,
          - listitem [ref=e56]: Plus de 750 000 contrats d’assurance en cours,
          - listitem [ref=e57]: Plus de 50 ans d’expérience au service des passionnés de deux-roues.
