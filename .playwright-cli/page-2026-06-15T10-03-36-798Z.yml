        - paragraph [ref=e63]
        - paragraph [ref=e64]: AMV propose la souscription simple et rapide en ligne vous permettant de bénéficier d'une couverture immédiate, sous réserve de certaines conditions. Plus besoin de vous déplacer en agence, quelques clics suffisent pour être assuré.
        - paragraph [ref=e65]
        - paragraph [ref=e66]:
          - text: AMV propose une
