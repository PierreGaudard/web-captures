                - text: Assistance juridique
              - generic [ref=e175]: ▾
            - paragraph [ref=e176]: Défense pénale et recours suite à accident, à concurrence de 2 300 €. Protection juridique en cas de conflit relatif au véhicule assuré (achat, entretien, réparation, vente ou financement) et pour les conséquences d'une infraction aux règles de la circulation.
