      - generic [ref=e80]:
        - heading "H2 Qu'est-ce que le permis moto A2 ?" [level=2] [ref=e81]:
          - generic [ref=e82]: H2
          - text: Qu'est-ce que le permis moto A2 ?
        - paragraph [ref=e83]:
          - text: Le permis A2 est accessible dès 18 ans. Il autorise la conduite de motos dont la puissance ne dépasse pas 35 kW (soit 47,5 chevaux) et de trois-roues limités à 15 kW. Après deux ans de pratique et une formation complémentaire de 7 heures, vous pouvez obtenir
          - link "le permis A" [ref=e84] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-moto/assurance-moto-permis-a/
          - text: ", qui donne accès à toutes les motos sans restriction de puissance. Le permis A2 s'adresse à tous les profils, quel que soit l'âge : il représente souvent la première étape avant de prendre la route sur des véhicules plus puissants."
        - heading "H3 Les conditions d'accès au permis A2" [level=3] [ref=e85]:
          - generic [ref=e86]: H3
          - text: Les conditions d'accès au permis A2
        - paragraph [ref=e87]: "Pour obtenir le permis A2 : avoir au moins 18 ans, réussir l'examen du code de la route, puis passer deux épreuves pratiques (plateau et circulation). La formation en moto-école comprend un minimum de 20 heures de conduite, dont 8 heures en plateau et 12 heures en circulation. Le coût total varie selon les régions et les moto-écoles."
        - heading "H3 Quelles motos peut-on conduire avec un permis A2 ?" [level=3] [ref=e88]:
          - generic [ref=e89]: H3
          - text: Quelles motos peut-on conduire avec un permis A2 ?
        - paragraph [ref=e90]: "Le permis A2 autorise les motos dont la puissance ne dépasse pas 35 kW et dont le rapport puissance/poids reste inférieur à 0,2 kW par kilogramme. De nombreux modèles populaires sont compatibles :"
        - list [ref=e91]:
          - listitem [ref=e92]:
            - link "Yamaha MT-07" [ref=e93] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-yamaha/
          - listitem [ref=e94]:
            - link "Kawasaki Z650" [ref=e95] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-kawasaki/
          - listitem [ref=e96]:
            - link "Honda CB500F" [ref=e97] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-honda/
          - listitem [ref=e98]:
            - link "KTM 390 Duke" [ref=e99] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-ktm/
          - listitem [ref=e100]:
            - link "Suzuki SV 650" [ref=e101] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-suzuki/
        - paragraph [ref=e102]: Certaines motos plus puissantes existent en version bridée A2, ce qui permet de les débrider une fois le permis A obtenu. Les trois-roues motorisés sont, quant à eux, limités à 15 kW en permis A2.
        - 'heading "H3 Permis A2, permis A : quelle différence ?" [level=3] [ref=e103]':
          - generic [ref=e104]: H3
          - text: "Permis A2, permis A : quelle différence ?"
        - paragraph [ref=e105]: Le permis A2 limite la puissance du deux-roues à 35 kW. Le permis A, obtenu après deux ans de pratique sous permis A2 et une formation de 7 heures, donne accès à toutes les motos sans restriction. Pour la majorité des trajets quotidiens, un deux-roues de moins de 35 kW peut suffire.
        - heading "H2 Combien coûte une assurance moto avec un permis A2 ?" [level=2] [ref=e106]:
          - generic [ref=e107]: H2
          - text: Combien coûte une assurance moto avec un permis A2 ?
        - paragraph [ref=e108]: "Le prix d'une assurance moto A2 dépend du modèle de la moto, de la zone géographique, du niveau de couverture et de l'expérience du conducteur. Les jeunes conducteurs paient plus cher en raison de la surprime jeune conducteur. Le tarif peut varier du simple au triple selon les compagnies d'assurance et les offres proposées. Pour un jeune motard, comparer les contrats est important : c'est le meilleur moyen de trouver la meilleure assurance moto A2 au tarif le moins cher."
        - heading "H3 La surprime jeune conducteur" [level=3] [ref=e109]:
          - generic [ref=e110]: H3
          - text: La surprime jeune conducteur
        - paragraph [ref=e111]: Tout conducteur débutant se voit appliquer une surprime. La première année, cette majoration peut atteindre jusqu'à 100 %. La deuxième année, en l'absence de sinistre responsable, elle est limitée à 50 %, puis à 25 % la troisième année. Après trois ans sans sinistre, la surprime disparaît. Le coefficient bonus-malus continue ensuite de baisser en l'absence de sinistre responsable, même si la cotisation finale dépend aussi de l'évolution tarifaire décidée par l'assureur.
        - heading "H3 Quel est le prix moyen d'une assurance moto A2 ?" [level=3] [ref=e112]:
          - generic [ref=e113]: H3
          - text: Quel est le prix moyen d'une assurance moto A2 ?
        - paragraph [ref=e114]: Le prix d'une assurance moto A2 dépend du profil du conducteur, du modèle de la moto et de la formule choisie. La formule au tiers reste la moins chère, la formule tous risques la plus protectrice. Le prix diminue chaque année grâce au bonus-malus, à condition de ne pas déclarer de sinistre responsable. Seul un devis personnalisé en ligne donne le tarif exact pour votre situation.
        - heading "H3 Comment réduire le prix de votre assurance moto A2" [level=3] [ref=e115]:
          - generic [ref=e116]: H3
          - text: Comment réduire le prix de votre assurance moto A2
        - paragraph [ref=e117]: "Plusieurs leviers permettent de diminuer votre cotisation en permis A2 :"
        - list [ref=e118]:
          - listitem [ref=e119]: choisir une formule au tiers pour une première moto d'occasion de faible valeur
          - listitem [ref=e120]:
            - link "faire valoir votre bonus automobile si vous possédez déjà une voiture" [ref=e121] [cursor=pointer]:
              - /url: https://www.amv.fr/auto/assurance-auto/assurance-auto-en-ligne.aspx
        - heading "H2 Nos formules d'assurance pour les permis A2" [level=2] [ref=e122]:
          - generic [ref=e123]: H2
          - text: Nos formules d'assurance pour les permis A2
        - paragraph [ref=e124]:
          - text: AMV propose des formules adaptées aux détenteurs du permis A2. Chaque
          - link "contrat assurance moto" [ref=e125] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance/moto/
          - text: peut être complété par des options pour ajuster votre couverture selon votre budget et votre usage. Un devis en ligne vous aide à trouver la formule adaptée en quelques clics.
        - generic [ref=e126]:
          - generic [ref=e127]:
            - generic [ref=e128] [cursor=pointer]:
              - generic [ref=e129]:
                - generic [ref=e130]: H3
                - text: Formule au tiers
              - generic [ref=e131]: ▾
            - paragraph [ref=e132]: L'assurance au tiers couvre la responsabilité civile obligatoire et la défense pénale. C'est le choix le plus fréquent pour un jeune conducteur avec une première moto d'occasion de faible valeur marchande. Son tarif est le moins cher de nos formules, ce qui répond au besoin des jeunes motards soucieux de leur budget.
          - generic [ref=e133]:
            - generic [ref=e134] [cursor=pointer]:
              - generic [ref=e135]:
                - generic [ref=e136]: H3
                - text: Formule vol et incendie
              - generic [ref=e137]: ▾
            - paragraph [ref=e138]: En complément du tiers, cette formule ajoute la prise en charge en cas de vol, tentative de vol ou incendie. Si vous stationnez votre moto en extérieur ou en zone urbaine, cette couverture complémentaire est recommandée.
          - generic [ref=e139]:
            - generic [ref=e140] [cursor=pointer]:
              - generic [ref=e141]:
                - generic [ref=e142]: H3
                - text: Formule tous risques
              - generic [ref=e143]: ▾
            - paragraph [ref=e144]: La formule tous risques couvre l'ensemble des dommages subis par votre moto, y compris en cas d'accident responsable. Elle est recommandée pour une moto neuve ou récente, ou un véhicule financé à crédit. Un conducteur novice, plus exposé aux risques de chute, bénéficie avec cette formule d'une indemnisation dans la grande majorité des situations.
        - heading "H2 Les garanties essentielles pour un jeune motard" [level=2] [ref=e145]:
          - generic [ref=e146]: H2
          - text: Les garanties essentielles pour un jeune motard
        - paragraph [ref=e147]: Les accidents de moto provoquent des blessures corporelles plus fréquentes et plus graves que les accidents auto. Certaines garanties méritent une attention particulière pour un conducteur novice en permis A2. Nos conseils pour bien vous protéger dès le départ.
        - heading "H3 Protection corporelle du conducteur" [level=3] [ref=e148]:
          - generic [ref=e149]: H3
          - text: Protection corporelle du conducteur
        - paragraph [ref=e150]: "Cette garantie indemnise le conducteur en cas d'accident corporel, même responsable : capital en cas de décès, indemnisation en cas d'invalidité permanente. Les frais de soins et d'hospitalisation, eux, relèvent de la Sécurité sociale et de votre mutuelle. Elle intervient dans les situations où l'assurance du tiers adverse ne vous couvre pas : accident seul, accident responsable."
        - heading "H3 Équipement et accessoires moto" [level=3] [ref=e151]:
          - generic [ref=e152]: H3
          - text: Équipement et accessoires moto
        - paragraph [ref=e153]: "Casque, gants, blouson, bottes : l'équipement d'un motard représente un budget conséquent. Cette garantie couvre le remplacement de vos équipements en cas de sinistre. Elle s'étend aux accessoires installés sur votre véhicule (top case, sacoches, échappement…), à hauteur de 5 000 €."
        - heading "H3 Assistance 24h/24" [level=3] [ref=e154]:
          - generic [ref=e155]: H3
          - text: Assistance 24h/24
        - paragraph [ref=e156]: "Le service d'assistance AMV intervient 24h/24 et 7j/7 en cas de panne, d'accident ou de vol :"
        - list [ref=e157]:
          - listitem [ref=e158]: remorquage jusqu'à la concession la plus proche
          - listitem [ref=e159]: rapatriement à domicile
        - paragraph [ref=e160]: Ce service couvre la France métropolitaine et la plupart des pays d'Europe.
        - heading "H2 Le détail des garanties de votre assurance moto A2" [level=2] [ref=e161]:
          - generic [ref=e162]: H2
          - text: Le détail des garanties de votre assurance moto A2
        - paragraph [ref=e163]: Quelle que soit la formule choisie en permis A2, votre contrat AMV repose sur un socle de garanties précises. Dépliez chaque garantie pour voir le détail des montants et des prises en charge.
        - generic [ref=e164]:
          - generic [ref=e165]:
            - generic [ref=e166] [cursor=pointer]:
              - generic [ref=e167]:
                - generic [ref=e168]: H3
                - text: Responsabilité civile
              - generic [ref=e169]: ▾
            - paragraph [ref=e170]: Prise en charge des conséquences pécuniaires de la responsabilité civile que vous pouvez encourir en raison des dommages matériels et corporels causés à autrui, y compris à votre passager. Dommages corporels illimités, dommages matériels jusqu'à 100 000 000 € en cas d'accident et 1 300 000 € en cas d'incendie.
