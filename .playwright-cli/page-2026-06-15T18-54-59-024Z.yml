            - generic [ref=e99]: Nouveau contenu optimisé
            - generic [ref=e100]:
              - generic [ref=e101]: H2
              - text: Questions fréquentes sur l'assurance moto de collection
            - generic [ref=e102]:
              - generic [ref=e103]: H3
              - text: Comment bien choisir son assurance moto de collection ?
            - paragraph [ref=e104]: "Commencez par évaluer la valeur réelle de votre véhicule ancien, pour bénéficier d'une couverture adéquate. Privilégiez un assureur spécialiste comme AMV, qui propose une offre dédiée, et lisez attentivement les garanties au-delà du seul tarif : vol, incendie, tous accidents, assistance, protection juridique. Comparez les garanties et tenez compte des spécificités du véhicule de collection, comme l'usage limité ou la possibilité de regrouper plusieurs véhicules dans un contrat flotte."
            - generic [ref=e105]:
              - generic [ref=e106]: H3
              - text: Quelle est la meilleure assurance moto de collection au meilleur prix ?
            - paragraph [ref=e107]: "Il n'existe pas de réponse unique : le prix dépend de l'âge du véhicule, des garanties choisies et du profil de l'assuré. Généralement, la formule au tiers est la moins chère car elle offre une couverture essentielle. Pour trouver la meilleure offre, un devis personnalisé en ligne vous donne le tarif adapté en quelques clics, avec des cotisations dégressives selon l'âge et le nombre de véhicules."
            - generic [ref=e108]:
              - generic [ref=e109]: H3
              - text: Combien coûte ce type de contrat ?
            - paragraph [ref=e110]: Le coût dépend de la valeur et de la cylindrée du véhicule, de son usage (loisir, rassemblements, courts trajets), de l'âge et de l'expérience du conducteur, de son bonus, de la zone géographique et du niveau de garanties choisi. Les véhicules de collection, peu roulés et bien entretenus, bénéficient souvent de primes réduites par rapport à une moto classique.
            - generic [ref=e111]:
              - generic [ref=e112]: H3
              - text: Quel avantage à passer une moto en carte grise de collection ?
            - paragraph [ref=e113]: Une moto de 30 ans et plus passée en carte grise de collection donne droit à un contrôle technique espacé, à l'usage des plaques noires d'époque, à la circulation sur tout le territoire et, souvent, à un tarif d'assurance réduit. Cette démarche valorise aussi le caractère patrimonial du véhicule.
            - generic [ref=e114]:
              - generic [ref=e115]: H3
              - text: Comment changer ou résilier son assurance ?
            - paragraph [ref=e116]: "Depuis la loi Hamon, après un an d'engagement vous pouvez procéder à la résiliation à tout moment, sans frais ni justification. Ne résiliez pas avant d'avoir souscrit ailleurs : demandez d'abord votre devis chez AMV Légende, puis mandatez AMV pour effectuer les démarches à votre place."
            - generic [ref=e117]:
              - generic [ref=e118]: H3
              - text: Faut-il une carte grise de collection pour assurer une moto ancienne chez AMV ?
            - paragraph [ref=e119]: La carte grise de collection n'est pas obligatoire pour assurer une moto ancienne, mais elle ouvre droit à des avantages spécifiques et à l'offre AMV Légende. AMV couvre aussi bien les motos anciennes immatriculées normalement que celles en collection. Un conseiller vous oriente vers la formule la plus adaptée à votre situation.
          - heading " Comment bien choisir son assurance moto / auto pour véhicule(s) ancien(s) ou de collection ?" [level=3] [ref=e120] [cursor=pointer]:
            - generic [ref=e121]: 
            - text: Comment bien choisir son assurance moto / auto pour véhicule(s) ancien(s) ou de collection ?
          - generic [ref=e122]:
            - paragraph [ref=e123]: Pour bien choisir son assurance moto / auto pour véhicules anciens ou de collection, il est primordial de se poser les bonnes questions en fonction de ses besoins et de son véhicule.
            - paragraph [ref=e124]: "Voici quelques étapes à suivre :"
            - paragraph [ref=e125]: "Évaluer la valeur de votre véhicule : un véhicule de collection peut avoir une valeur très différente d'un véhicule standard. Il est donc essentiel d'avoir une évaluation juste pour bénéficier d'une couverture adéquate."
            - paragraph [ref=e126]: Privilégier un assureur spécialisé dans les véhicules anciens ou de collection qui propose une offre spécifique comme AMV Légende.
            - paragraph [ref=e127]: "Lire attentivement les garanties proposées : au-delà du tarif, il est essentiel de comprendre les garanties du contrat. Certains couvriront par exemple les dommages tous accidents, tandis que d'autres offriront une protection en cas de vol ou d'incendie."
            - paragraph [ref=e128]: "Tenir compte des spécificités : les véhicules anciens ou de collection ont des particularités comme l'usage ou la possibilité de regrouper plusieurs véhicules dans un contrat flotte"
          - heading " Comment changer d'assurance moto / auto pour véhicule(s) ancien(s) ou de collection ?" [level=3] [ref=e129] [cursor=pointer]:
            - generic [ref=e130]: 
            - text: Comment changer d'assurance moto / auto pour véhicule(s) ancien(s) ou de collection ?
          - generic [ref=e131]:
            - paragraph [ref=e132]: "Renseignez-vous sur vos droits : depuis l'entrée en vigueur de la loi Hamon, il est plus simple de résilier son contrat d'assurance. Après un an d'engagement, vous pouvez changer d'assurance à tout moment."
            - paragraph [ref=e133]: "Recherchez un nouvel assureur et ne résiliez pas votre contrat avant de souscrire : vous pouvez demander un devis chez AMV Légende qui propose des contrats spécifiques pour les véhicules anciens et de collection."
            - paragraph [ref=e134]: Une fois votre souscription validée, mandatez votre nouvel assureur pour effectuer les démarches de résiliation à votre place. Il s'occupera de toutes les formalités.
          - heading " Comment résilier son assurance moto / auto de véhicule(s) ancien(s) ou de collection ?" [level=3] [ref=e135] [cursor=pointer]:
            - generic [ref=e136]: 
            - text: Comment résilier son assurance moto / auto de véhicule(s) ancien(s) ou de collection ?
          - generic [ref=e137]:
            - paragraph [ref=e138]: "Respectez le délai d'un an : suite à la loi Hamon, après une année de souscription, la résiliation est possible à tout moment sans frais ni justification."
            - paragraph [ref=e139]: C'est votre nouvel assureur qui s'occupera des démarches de résiliation.
          - heading " Quelle est l'assurance moto / auto pour véhicule(s) ancien(s) ou de collection la moins chère ?" [level=3] [ref=e140] [cursor=pointer]:
            - generic [ref=e141]: 
            - text: Quelle est l'assurance moto / auto pour véhicule(s) ancien(s) ou de collection la moins chère ?
          - generic [ref=e142]:
            - paragraph [ref=e143]: Il n'existe pas de réponse unique à cette question car les tarifs dépendent de nombreux facteurs (âge du véhicule, garanties choisies, profil de l'assuré...).
            - paragraph [ref=e144]: Cependant, généralement, les assurances au tiers sont les moins chères car elles offrent une couverture minimale.
          - heading " Quel avantage de passer une moto en carte grise de collection?" [level=3] [ref=e145] [cursor=pointer]:
            - generic [ref=e146]: 
            - text: Quel avantage de passer une moto en carte grise de collection?
          - generic [ref=e147]:
            - paragraph [ref=e148]: "Passer une moto en carte grise collection présente plusieurs avantages :"
            - paragraph [ref=e149]: "Tarif de l'assurance : les motos de collection ont souvent des primes d'assurance réduites car elles sont généralement moins utilisées et mieux entretenues."
