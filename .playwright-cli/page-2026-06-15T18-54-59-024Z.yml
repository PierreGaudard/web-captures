          - img "AMV Légende" [ref=e54]
          - generic [ref=e55]:
            - heading "L'assurance auto et moto de collection chez AMV" [level=2] [ref=e56]
            - text: AMV Légende est une offre d'assurance auto et moto anciennes, spécialement conçue pour les véhicules de collection. Notre équipe de conseillers d’assurance met à votre service son expertise pour vous garantir une qualité de service privilégiée et vous assurer une gestion personnalisée de vos contrats pour tous vos modèles. Vous pouvez construire votre contrat sur-mesure avec le niveau de garanties qui convient à chacun de vos véhicules et bénéficier de tarifs très avantageux, et dégressifs en fonction de l’âge et du nombre de véhicules à assurer.
            - text: Pour toujours plus de facilité, vous pouvez obtenir
            - strong [ref=e57]: votre devis AMV Légende
            - text: et souscrire
            - strong [ref=e58]: une assurance véhicules anciens et de collection en ligne
            - generic [ref=e59]:
              - generic [ref=e60]: Nouveau contenu optimisé
              - generic [ref=e61]:
                - generic [ref=e62]: H2
                - text: Pourquoi choisir AMV pour votre assurance moto de collection ?
              - paragraph [ref=e63]: AMV est l'assureur spécialiste des deux-roues et des véhicules anciens. Plus d'1 million d'assurés lui font confiance, avec une note de 4,7/5 selon Avis Vérifiés. Plus de 350 conseillers basés à Bordeaux vous accompagnent, et un interlocuteur dédié suit votre dossier en cas de sinistre. Un assureur généraliste connaît mal les besoins d'un motard collectionneur. AMV, lui, protège votre patrimoine roulant comme il le mérite, et vous gérez tout depuis l'espace client Mon Espace AMV.
              - generic [ref=e64]:
                - generic [ref=e65]: H2
                - text: Les formules d'assurance moto de collection
              - paragraph [ref=e66]: "AMV décline plusieurs formules, de la couverture essentielle à la protection tous risques. Vous choisissez le niveau de garanties selon la valeur de votre véhicule, son usage et votre budget. Trois piliers restent toujours présents : la responsabilité civile obligatoire, l'assistance et la protection juridique."
              - paragraph [ref=e67]: "La formule au tiers vous couvre en responsabilité civile : c'est la garantie minimale obligatoire, qui indemnise les dommages causés à un tiers. Elle peut convenir aux motos anciennes de faible valeur ou utilisées ponctuellement pour le loisir, et reste l'option la moins chère car elle offre une couverture essentielle."
              - paragraph [ref=e68]: "La formule intermédiaire ajoute la prise en charge du vol, de la tentative de vol et de l'incendie. Elle est recommandée si vous garez votre deux-roues en extérieur ou dans un lieu non clos : le risque de vol est réel, en particulier pour les modèles anciens recherchés."
              - paragraph [ref=e69]: La formule tous risques indemnise les dommages subis par votre véhicule assuré, même lors d'un sinistre responsable, et couvre le vandalisme. C'est la protection la plus complète, conseillée pour un modèle de valeur, restauré ou financé à crédit. À ces formules s'ajoutent l'assistance (dépannage, remorquage, rapatriement) et la protection juridique, qui défend vos intérêts en cas de litige.
              - paragraph [ref=e70]: "En cas de sinistre, l'indemnisation tient compte de la nature du véhicule : une moto ancienne se répare avec des pièces parfois rares, et son estimation relève d'une expertise spécifique. Selon la formule et l'option choisies, une franchise peut s'appliquer. C'est pourquoi le choix des garanties mérite réflexion, en lien avec la cote du modèle, son état et la fréquence de vos sorties."
              - generic [ref=e71]:
                - generic [ref=e72]: H2
                - text: Les garanties spécifiques aux véhicules de collection
              - paragraph [ref=e73]: "Un véhicule de collection ne se couvre pas comme un modèle classique. Usage limité (sorties, rassemblements, balades), faible kilométrage, entretien soigné : ces spécificités justifient des garanties adaptées et des tarifs préférentiels. Avec AMV Légende, les cotisations sont dégressives selon l'ancienneté et le nombre de motos ou autos assurées. Plusieurs deux-roues anciens ? Le contrat flotte de collection les regroupe sous une seule police. Les garanties se modulent véhicule par véhicule, selon vos trajets et la valeur de chaque modèle."
              - generic [ref=e74]:
                - generic [ref=e75]: H2
                - text: "La carte grise de collection : conditions et avantages"
              - paragraph [ref=e76]: "Passer votre moto en carte grise de collection ouvre droit à un statut spécifique et à une assurance dédiée. Voici les conditions à remplir :"
              - list [ref=e77]:
                - listitem [ref=e78]: Le véhicule doit avoir au moins 30 ans.
                - listitem [ref=e79]: Son type ne doit plus être produit.
                - listitem [ref=e80]: Il doit être conservé dans son état d'origine, sans modification majeure des caractéristiques techniques.
                - listitem [ref=e81]: Une attestation de datation et de caractéristiques délivrée par la FFVE (Fédération Française des Véhicules d'Époque) est nécessaire pour demander le certificat d'immatriculation auprès de l'ANTS.
              - paragraph [ref=e82]: "Ce statut de carte grise collection présente plusieurs avantages concrets pour le motard :"
              - list [ref=e83]:
                - listitem [ref=e84]: "Contrôle technique allégé : pour les deux-roues concernés, il est espacé (tous les 5 ans), et les modèles mis en circulation avant 1960 en sont exemptés."
                - listitem [ref=e85]: "Circulation sur tout le territoire : la carte grise de collection autorise à rouler partout en France."
                - listitem [ref=e86]: "Plaques noires autorisées : le format d'époque est admis."
                - listitem [ref=e87]: "Prime réduite : peu utilisés et bien entretenus, ces véhicules bénéficient souvent d'un tarif avantageux."
                - listitem [ref=e88]: "Dérogations possibles en ZFE : selon les collectivités, ces véhicules peuvent circuler en zone à faibles émissions."
              - paragraph [ref=e89]: "Bon à savoir : la valeur patrimoniale d'un deux-roues ancien peut augmenter avec le temps. Une couverture adaptée protège donc à la fois votre passion et votre investissement."
              - generic [ref=e90]:
                - generic [ref=e91]: H2
                - text: Comment souscrire une assurance moto de collection en ligne ?
              - paragraph [ref=e92]: Pour assurer votre moto ancienne, la souscription chez AMV est rapide et entièrement en ligne. Munissez-vous de votre permis de conduire et de la carte grise du véhicule, renseignez les informations sur votre moto (marque, modèle, cylindrée, année, usage prévu) et sur votre profil de conducteur, puis obtenez votre devis gratuit en quelques minutes. Si le tarif vous convient, finalisez en quelques clics et recevez votre attestation d'assurance par e-mail. Vous choisissez la formule qui répond le mieux à vos besoins, avant de prendre la route en toute sérénité.
            - text: sur amv.fr.
