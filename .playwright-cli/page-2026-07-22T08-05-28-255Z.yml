      - generic [ref=e182]:
        - generic [ref=e183]: Nouveau contenu optimise
        - heading "Questions fréquentes sur l'assurance moto KTM" [level=2] [ref=e184]
        - heading "Quel est le prix d'une assurance pour une KTM 125 Duke ou une EXC ?" [level=3] [ref=e185]
        - paragraph [ref=e186]: "Il n'existe pas de tarif unique : chaque cotisation est calculée selon le modèle, sa date de première mise en circulation, le lieu de stationnement, le niveau de couverture et la sinistralité déclarée. Une 125 Duke, accessible dès le permis A1, se situe en général sur des niveaux de tarif plus abordables qu'une Adventure ou une Super Duke R. Le devis en ligne vous donne un tarif personnalisé pour votre KTM en quelques minutes."
        - heading "Quelle assurance choisir pour une KTM ?" [level=3] [ref=e187]
        - paragraph [ref=e188]: Le choix dépend surtout de la valeur de votre moto. Pour une KTM de faible valeur, la formule Responsabilité civile peut suffire. Pour un modèle neuf, récent ou financé à crédit, la formule Tous risques offrirait la protection la plus complète. Entre les deux, la formule Vol / Incendie serait pertinente si votre moto stationne dehors, et la formule Dommages collision renforce votre couverture en cas d'accident avec un tiers identifié, tout en maîtrisant votre budget.
        - heading "Peut-on assurer une KTM en jeune permis ?" [level=3] [ref=e189]
        - paragraph [ref=e190]:
          - text: Oui, selon le modèle. La 125 Duke se conduit dès le permis A1, et la 390 Duke est compatible avec le
          - link "permis A2" [ref=e191] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-moto/assurance-moto-permis-a2/
          - text: ". En revanche, un jeune permis ne pourrait pas être assuré sur une sportive : jusqu'à la passerelle vers le permis A, la moto reste d'ailleurs bridée à 35 kW. Le tarif reste personnalisé, sans formule spécifique aux jeunes conducteurs : les mêmes garanties s'appliquent à tous les assurés."
        - heading "Une KTM EXC utilisée en tout-terrain est-elle couverte ?" [level=3] [ref=e192]
        - paragraph [ref=e193]: Les enduros EXC homologuées route sont assurables comme toute moto de la gamme, et restent couvertes sur les chemins ouverts à la circulation publique. Le roulage libre sur circuit est également assuré. En revanche, la compétition, entraînements chronométrés et courses, n'est couverte par aucune garantie. Si vous pratiquez l'enduro en loisir, votre conseiller AMV peut vous orienter vers la formule la plus adaptée à votre usage.
      - generic [ref=e194]:
        - heading "Questions fréquentes" [level=2] [ref=e195]
        - generic [ref=e196]:
          - generic [ref=e197] [cursor=pointer]:
            - generic [ref=e198]:
              - generic [ref=e199]: Quand KTM a-t-elle été fondée et par qui ?
              - img [ref=e200]
            - paragraph [ref=e202]: KTM a été fondée en 1934 par l'ingénieur autrichien Johann (Hans) Trunkenpolz, établissant ainsi les bases de la marque sous le nom de Kronreif & Trunkenpolz Mattighofen.
          - generic [ref=e203] [cursor=pointer]:
            - generic [ref=e204]:
              - generic [ref=e205]: Quels événements ont marqué le tournant dans l'histoire de KTM dans les années 1990 ?
              - img [ref=e206]
            - paragraph [ref=e208]: "Les années 1990 ont été marquées par une restructuration majeure, conduisant à la division de l'entreprise en quatre entités distinctes : KTM Sportmotorcycle GmbH (motos), KTM Fahrrad GmbH (vélos), KTM Kühler GmbH (radiateurs) et KTM Werkzeugbau GmbH (outillage)."
          - generic [ref=e209] [cursor=pointer]:
            - generic [ref=e210]:
              - generic [ref=e211]: Quelles acquisitions stratégiques ont contribué à l'expansion internationale de KTM ?
              - img [ref=e212]
            - paragraph [ref=e214]: En 2007, Bajaj Auto a acquis une participation importante dans KTM Power Sports AG, renforçant ainsi la présence internationale de KTM. De plus, les acquisitions de Husaberg AB et Husqvarna Motorcycles ont élargi la portée de la marque sur le marché mondial des deux-roues.
        - generic [ref=e215]:
          - generic [ref=e216] [cursor=pointer]:
            - generic [ref=e217]:
              - generic [ref=e218]: Quelle assurance moto choisir ?
              - img [ref=e219]
            - paragraph [ref=e221]: Pour choisir avec soin votre assurance moto, il est primordial de comparer les tarifs, les garanties et les franchises proposées. AMV, assureur spécialisé dans le domaine de la moto, est une option à prendre en sérieuse considération. Fort de son expertise, AMV offre des solutions adaptées aux besoins spécifiques des motards, assurant ainsi une couverture complète et fiable pour leurs deux-roues. Grâce à son expertise du secteur, AMV peut offrir des services sur mesure et des conseils avisés, assurant la tranquillité d'esprit des motocyclistes tout au long de leurs aventures sur la route.
          - generic [ref=e222] [cursor=pointer]:
            - generic [ref=e223]:
              - generic [ref=e224]: Quel est le prix d'une assurance moto ?
              - img [ref=e225]
            - paragraph [ref=e227]: Le coût d'une assurance moto chez AMV intègre plusieurs facteurs tels que le modèle de la moto, l'expérience du conducteur (permis, sinistres, bonus), le lieu de stationnement habituel et le niveau de garanties désiré. Chez AMV, nous offrons des tarifs compétitifs adaptés à chaque profil de conducteur et à chaque type de moto. Nos conseillers spécialisés sont là pour vous aider à choisir la couverture qui répond le mieux à vos besoins et à votre budget. N'hésitez pas à nous contacter pour obtenir un devis personnalisé et découvrez comment nous pouvons protéger au mieux votre moto. Chez AMV, nous sommes fiers d'accompagner les motards depuis près de 50 ans et de leur proposer une assurance sur mesure pour rouler en toute sérénité.
          - generic [ref=e228] [cursor=pointer]:
            - generic [ref=e229]:
              - generic [ref=e230]: Quelle formule assurance moto choisir ?
              - img [ref=e231]
            - paragraph [ref=e233]: Le choix de la formule d'assurance moto dépend entièrement de vos besoins spécifiques ainsi que de votre budget. Si vous possédez une moto récente, il est fortement recommandé de souscrire à une garantie dommages tous risques, cela vous permettra de couvrir les frais de réparation en cas d'accident responsable. AMV, en tant qu'assureur spécialisé dans l'assurance moto, propose différentes garanties et options adaptées à chaque profil. N'hésitez pas à réaliser un devis sur amv.fr ou nous contacter pour obtenir des informations détaillées sur les formules d'assurance moto proposées afin de trouver celle qui répond le mieux à vos besoins personnels
          - generic [ref=e234] [cursor=pointer]:
            - generic [ref=e235]:
              - generic [ref=e236]: Comment obtenir un devis d'assurance moto ?
              - img [ref=e237]
            - paragraph [ref=e239]: Pour obtenir un devis d'assurance moto rapidement, AMV est votre partenaire de confiance. Spécialiste de l'assurance moto depuis 50 ans, AMV propose des solutions adaptées à vos besoins. Rendez-vous sur amv.fr et complétez simplement notre formulaire pour découvrir votre tarif en seulement 3 minutes. Faites confiance à AMV et roulez en toute sérénité avec la protection dont vous avez besoin.
