        - paragraph [ref=e97]: La Défense pénale et recours suite à accident, associée à la Protection juridique, vous accompagne en cas de litige lié à un accident, jusqu'à 20 000 € au total.
        - heading "Les options pour une protection sur-mesure" [level=2] [ref=e98]
        - paragraph [ref=e99]: Votre contrat se complète d'options dédiées au pilote et aux équipements, pour ajuster la protection à votre KTM et à votre pratique.
        - paragraph [ref=e100]: L'Option Individuelle Pilote verse un capital, jusqu'à 800 000 euros, en cas d'invalidité permanente, ou à vos ayants droit en cas de décès, même lors d'un accident responsable. Sur des motos au tempérament sportif, cette protection du pilote lui-même mérite une vraie réflexion.
        - paragraph [ref=e101]: "Avec l'Option Plus, votre deux-roues acheté neuf, volé ou détruit suite à un sinistre est remboursé à sa valeur d'achat pendant un an et demi à compter de la date d'achat. L'ensemble de votre équipement moto est couvert en vol comme en dommages, mais également les accessoires hors-série et top case, dans la limite de 5 000 € : un vrai plus pour les Adventure équipées de valises ou les Duke personnalisées (échappement, protections)."
        - paragraph [ref=e102]: "AMV propose aussi une assistance en option, pour un dépannage sur mesure : votre moto est dépannée ou remorquée jusqu'à la concession la plus proche, le pilote et son passager sont rapatriés. La crevaison est incluse."
        - heading "Quel est le prix d'une assurance moto KTM ?" [level=2] [ref=e103]
        - paragraph [ref=e104]: Le tarif d'une assurance KTM est personnalisé. Il est établi à partir du modèle assuré, de sa date de première mise en circulation, du lieu de stationnement, du niveau de couverture choisi et de la sinistralité déclarée. À profil identique, une 125 Duke ne s'assurerait donc pas au même tarif qu'une Super Duke R, dont la valeur est nettement supérieure.
        - paragraph [ref=e105]: Le devis en ligne AMV, gratuit et sans engagement, vous donne en quelques minutes le tarif de chaque formule pour votre modèle, avant de choisir la couverture qui correspond à votre budget.
        - heading "Pourquoi assurer votre KTM chez AMV ?" [level=2] [ref=e106]
        - paragraph [ref=e107]: AMV, spécialiste de l'assurance deux-roues fondée en 1974 par un passionné de moto, pour les motards, compte plus d'1 million d'assurés et affiche une note de satisfaction de 4,7 sur 5 via Avis Vérifiés. Nos plus de 350 conseillers, basés à Bordeaux, connaissent les spécificités de la gamme KTM, du monocylindre de la 125 Duke aux gros trails Adventure.
        - paragraph [ref=e108]:
          - text: "La souscription se veut simple et rapide : un devis en ligne en quelques clics, peu de justificatifs là où d'autres assureurs réclament davantage de pièces, et une couverture qui peut prendre effet immédiatement, sous réserve de certaines conditions. Vous gérez ensuite votre contrat en toute autonomie depuis Mon Espace AMV. Découvrez également notre"
          - link "assurance moto" [ref=e109] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance/moto/
          - text: pour l'ensemble des
          - link "constructeurs" [ref=e110] [cursor=pointer]:
