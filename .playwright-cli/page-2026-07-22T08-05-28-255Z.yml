        - generic [ref=e41]: Nouveau contenu optimise
        - paragraph [ref=e42]: "En résumé : AMV, spécialiste de l'assurance deux-roues, assure l'ensemble de la gamme KTM, de la 125 Duke à la Super Duke R en passant par les trails Adventure et les enduros EXC. Un seul contrat, quatre formules et des options au choix, avec le casque, les gants et le gilet airbag couverts dès la première formule. Le devis en ligne prend quelques minutes."
        - list [ref=e43]:
          - listitem [ref=e44]: "Toute la gamme KTM est assurable : roadsters Duke, sportives RC, trails Adventure, enduros EXC et supermotards SMC."
          - listitem [ref=e45]: Quatre formules au choix, de la Responsabilité civile à la formule Tous risques.
          - listitem [ref=e46]: La garantie Dommages collision permet une couverture renforcée en maîtrisant votre budget.
          - listitem [ref=e47]: "Le tarif est personnalisé : modèle, date de mise en circulation, lieu de stationnement, niveau de couverture et sinistralité déclarée."
          - listitem [ref=e48]: Devis en ligne gratuit, souscription rapide avec peu de justificatifs.
        - heading "KTM, la marque autrichienne du \"Ready to Race\"" [level=2] [ref=e49]
        - paragraph [ref=e50]: "Fondée en 1934 à Mattighofen, en Autriche, KTM s'est d'abord illustrée dans le tout-terrain : enduro, motocross et supermoto ont forgé sa réputation et son palmarès en compétition. Depuis la fin des années 1990, la marque autrichienne s'est imposée sur la route avec des motos au caractère affirmé, reconnaissables à leur orange emblématique. Roadsters nerveux, trails taillés pour l'aventure et sportives de pointe : la gamme KTM cultive les performances et les sensations fortes, avec des innovations issues de la course."
        - paragraph [ref=e51]: "Ce tempérament sportif a une conséquence directe pour vous : une KTM mérite une assurance à la hauteur de sa valeur et de son usage, choisie avec soin plutôt que par défaut."
        - heading "Quelle assurance selon votre modèle KTM ?" [level=2] [ref=e52]
        - paragraph [ref=e53]: "Chaque famille de modèles répond à des besoins différents, et le choix de la formule dépend surtout de la valeur de votre moto :"
        - list [ref=e54]:
          - listitem [ref=e55]:
            - text: Les roadsters Duke, de la
            - link "125 Duke" [ref=e56] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-ktm/assurance-125-duke/
            - text: accessible dès le permis A1 à la
            - link "Super Duke R" [ref=e57] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-ktm/assurance-super-duke-r/
            - text: ", en passant par la"
            - link "390 Duke" [ref=e58] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-ktm/assurance-390-duke/
            - text: "compatible A2 : des motos utilisées au quotidien, souvent stationnées en ville."
          - listitem [ref=e59]:
            - text: Les trails Adventure, comme la
            - link "890 Adventure R" [ref=e60] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-ktm/assurance-890-adventure-r/
            - text: ", équipés pour les longs trajets et les voyages."
          - listitem [ref=e61]:
            - text: Les enduros
            - link "EXC" [ref=e62] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-ktm/assurance-exc/
            - text: ", homologuées route, qui alternent chemins et bitume."
          - listitem [ref=e63]:
            - text: Les sportives, comme la
            - link "RC 8C" [ref=e64] [cursor=pointer]:
              - /url: https://www.amv.fr/assurance-moto/assurance-moto-ktm/assurance-rc-8c/
            - text: ", dont la valeur élevée justifierait en général la couverture la plus complète."
        - paragraph [ref=e65]: "Un point à connaître si vous roulez sur piste : le roulage libre sur circuit est assuré, la compétition n'est en revanche couverte par aucune garantie. Et pour les modèles les plus puissants de la gamme, l'assurance est accessible si vous avez plus de 30 ans ou des antécédents d'assurance."
        - heading "Les formules d'assurance moto KTM" [level=2] [ref=e66]
        - paragraph [ref=e67]: "AMV propose les formules de garanties et options adaptées à votre KTM et à l'usage que vous en faites. Un seul contrat, quatre formules : à vous de choisir selon la valeur de votre moto, sa fréquence d'utilisation et votre budget."
        - paragraph [ref=e68]: La formule Responsabilité civile, couverture minimale obligatoire, couvre les dommages causés aux tiers lors d'un sinistre responsable. Elle peut suffire pour une KTM de faible valeur.
        - paragraph [ref=e69]: "La formule Vol / Incendie protège en plus votre moto contre le vol et l'incendie, avec une indemnisation à la valeur de remplacement à dire d'expert ou à la valeur à neuf durant les 6 premiers mois. Elle serait à envisager si votre KTM stationne majoritairement sur la voie publique. Bon à savoir : le gravage de votre deux-roues divise la franchise vol par 2 chez AMV."
        - paragraph [ref=e70]: La formule Dommages collision, la garantie distinctive d'AMV, couvre les dommages causés à votre moto lors d'une collision avec un tiers identifié, déduction faite, en cas de sinistre responsable, de la franchise prévue au contrat. Elle permet une meilleure couverture tout en maîtrisant votre budget.
        - paragraph [ref=e71]: La formule Tous risques couvre les dommages subis par votre deux-roues quelles que soient les circonstances. Elle serait recommandée pour une KTM neuve, récente ou financée à crédit.
        - paragraph [ref=e72]: "Quelle que soit la formule, votre équipement de pilote est couvert dès la première : casque, gants et gilet airbag sont garantis s'ils sont détériorés lors d'un événement couvert."
