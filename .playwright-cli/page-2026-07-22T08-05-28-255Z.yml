          - text: .
      - generic [ref=e112]:
        - paragraph [ref=e114]: KTM, marque autrichienne de motos, de vélos et de sports mécaniques, trouve ses origines en 1934 sous la dénomination de Kronreif & Trunkenpolz Mattighofen. Aujourd'hui, Pierer Mobility AG opère en tant que fabricant de motos sous la marque KTM, tandis que KTM Fahrrad AG fabrique des vélos estampillés KTM.
        - generic [ref=e115]:
          - 'heading "KTM : une épopée mécanique autrichienne, de ses origines humble à la conquête mondiale" [level=4] [ref=e116]':
            - strong [ref=e117]: "KTM : une épopée mécanique autrichienne, de ses origines humble à la conquête mondiale"
          - paragraph [ref=e118]
          - paragraph [ref=e119]: La renommée de KTM repose principalement sur ses motos tout-terrain (enduro, motocross et supermoto). Depuis la fin des années 1990, la marque s'est diversifiée en produisant des motos de route et en développant des voitures de sport, notamment la X-Bow. En 2015, KTM a vendu presque autant de motos de route que de motos tout-terrain.
          - paragraph [ref=e120]
          - paragraph [ref=e121]: "Histoire :"
          - paragraph [ref=e122]
          - paragraph [ref=e123]:
            - text: Les débuts
            - text: En 1934, l'ingénieur autrichien Johann (Hans) Trunkenpolz (1909-1962) a créé un atelier de montage et de réparation automobile à Mattighofen. En 1937, il a commencé à vendre des motos DKW et des voitures Opel l'année suivante. Son atelier était connu sous le nom de Kraftfahrzeug Trunkenpolz Mattighofen, mais le nom n'était pas enregistré. Pendant la Seconde Guerre mondiale, sa femme gérait l'entreprise, prospérant principalement grâce aux réparations de moteurs diesel.
          - paragraph [ref=e124]
          - paragraph [ref=e125]: Après la guerre, la demande de travaux de réparation a chuté, incitant Trunkenpolz à envisager la production de ses propres motos. Le prototype de sa première moto, la R100, a été fabriqué en 1951. Les composants de la moto étaient usinés en interne, à l'exception des moteurs Rotax produits par Fichtel & Sachs. La production en série de la R100 a commencé en 1953, avec seulement 20 employés produisant trois motos par jour.
          - paragraph [ref=e126]
          - paragraph [ref=e127]:
            - text: KTM de 1953 à 1991
            - text: En 1953, l'homme d'affaires Ernst Kronreif est devenu un important actionnaire de l'entreprise, et qui a dès lors été renommée Kronreif & Trunkenpolz Mattighofen. En 1954, la R125 Tourist a été introduite, suivie par la Grand Tourist et le scooter Mirabell en 1955.
          - paragraph [ref=e128]
          - paragraph [ref=e129]: En 1954, KTM remporte son premier titre de champion autrichien en 125cm³. En 1956, KTM fait sa première apparition aux International Six Days Trials, où Egon Dornauer remporte une médaille d'or sur une machine KTM. En 1957, KTM construit sa première moto sportive, la Trophy 125cm³. Le premier cyclomoteur de KTM, nommé Mecky, est lancé en 1957, suivi de Ponny I en 1960 et Ponny II en 1962, puis Comet en 1963. Les années 1960 voient également le début de la production de vélos à Mattighofen.
          - paragraph [ref=e130]
          - paragraph [ref=e131]: Ernst Kronreif décède en 1960. Deux ans plus tard, en 1962, Hans Trunkenpolz décède également d'une crise cardiaque. Son fils, Erich Trunkenpolz, prend la direction de l'entreprise.
          - paragraph [ref=e132]
          - paragraph [ref=e133]: À mesure que l'entreprise continue de se développer, la main-d'œuvre atteint 400 personnes en 1971, et quarante ans après sa fondation, KTM propose 42 modèles différents. De plus, KTM est en mesure de produire des motos pour l'industrie de la compétition. Au cours des années 1970 et 1980, KTM commence également à développer et produire des moteurs et des radiateurs. Les radiateurs vendus aux constructeurs automobiles européens constituent une part importante des activités de l'entreprise dans les années 1980.
          - paragraph [ref=e134]
          - paragraph [ref=e135]: En 1978, la filiale américaine KTM North America Inc. est fondée à Lorain, Ohio. En 1980, l'entreprise est renommée KTM Motor-Fahrzeugbau KG. Un an plus tard, KTM compte environ 700 employés et un chiffre d'affaires de 750 millions de schillings (environ 54,5 millions d'euros). Les activités internationales représentent alors 76% du chiffre d'affaires de l'entreprise.
          - paragraph [ref=e136]
          - paragraph [ref=e137]: Le chiffre d'affaires des scooters et cyclomoteurs a chuté rapidement, et la production a dû être interrompue en 1988. Erich Trunkenpolz décède en 1989. La prise de contrôle de 51% de l'entreprise par le trust d'investissement autrichien GIT Trust Holding, contrôlé par l'homme politique autrichien Josef Taus en 1989, a été suivie de tentatives infructueuses pour redresser une entreprise endettée. En 1991, la direction de KTM est transférée à un consortium de banques créancières.
          - paragraph [ref=e138]
          - paragraph [ref=e139]:
            - text: KTM après 1991
            - text: "En 1991, l'entreprise est scindée en quatre entités distinctes : KTM Sportmotorcycle GmbH (division motos), KTM Fahrrad GmbH (division vélos), KTM Kühler GmbH (division radiateurs) et KTM Werkzeugbau GmbH (division outillage)."
          - paragraph [ref=e140]
          - paragraph [ref=e141]: Désormais propriété de KTM Motorradholding GmbH, formée par Cross Holding (une filiale de Cross Industries), et d'autres investisseurs, KTM Sportmotorcycle GmbH a commencé ses opérations en 1992 et a ensuite repris la division outillage KTM Werkzeugbau. Au fil des années, tout en augmentant régulièrement sa production et son chiffre d'affaires, en investissant dans de nouvelles installations de production et de R&D, en introduisant de nouveaux modèles et en sponsorisant avec succès divers événements sportifs, l'entreprise a subi une série de restructurations et de changements d'actionnaires dirigés par Stefan Pierer, directeur général de KTM et propriétaire de Cross Industries. En 1994, KTM a lancé la production de la série Duke de motos de route, en 1996, les motos tout-terrain KTM ont été habillées pour la première fois de la couleur orange caractéristique de la marque, et en 1997, ce fut l'introduction des motos Supermoto et Adventure à deux cylindres refroidies par liquide. En 2007, l'entreprise a présenté la voiture de sport KTM X-Bow.
          - paragraph [ref=e142]
          - paragraph [ref=e143]: En 1995, KTM Motorradholding GmbH a acquis le fabricant suédois de motos Husaberg AB et pris le contrôle de la société néerlandaise White Power Suspension.
          - paragraph [ref=e144]: En 2007, le fabricant indien de motos Bajaj Auto a acquis une participation de 14,5% dans KTM Power Sports AG. Après 2013, Bajaj Auto détenait une participation de 47,97% dans l'entreprise.
          - paragraph [ref=e145]
          - paragraph [ref=e146]: En 2013, KTM a racheté le fabricant de motos suédois Husqvarna Motorcycles à BMW Motorrad AG. La même année, KTM a réintégré la marque Husaberg dans Husqvarna Motorcycles, à partir de laquelle elle avait été détachée dans les années 1990 lors de la vente de Husqvarna à la société italienne Cagiva.
          - paragraph [ref=e147]
          - paragraph [ref=e148]: "En tant que résultat final du processus de restructuration, KTM Motorradholding GmbH est devenue KTM AG en 2012. En 2015, KTM a généré un chiffre d'affaires de plus de 1 milliard d'euros et employait 2515 personnes à la fin de cette année-là. Parmi les quatre sociétés distinctes restées après la scission de 1992, trois faisaient à nouveau partie du groupe KTM : KTM Sportmotorcycle GmbH, KTM Werkzeugbau GmbH et KTM Kühler GmbH (aujourd'hui WP Radiators). KTM Fahrrad GmbH (KTM Bike Industries) reste une entreprise indépendante, détenue par des investisseurs chinois. Aujourd'hui, le groupe KTM englobe les marques KTM, Husqvarna Motorcycles et GasGas Motorcycles."
          - paragraph [ref=e149]
          - paragraph [ref=e150]: En 2021, Bajaj Auto a vendu 46,5% des actions de KTM à Pierer Mobility AG en échange de 49% des actions de cette dernière, devenant ainsi un actionnaire indirect de KTM. Cette transaction a consolidé davantage la position de KTM sur le marché, illustrant sa capacité à s'adapter et à prospérer dans l'industrie du deux-roues. L'histoire de KTM est marquée par une ingénierie innovante, un engagement dans la compétition et une expansion stratégique, ce qui en fait une marque emblématique dans le monde des motos et des sports mécaniques.
        - generic [ref=e151]:
          - heading "Conclusion sur la KTM" [level=4] [ref=e152]:
            - strong [ref=e153]: Conclusion sur la KTM
          - paragraph [ref=e154]
          - paragraph [ref=e155]: En conclusion, l'histoire de KTM est une saga captivante qui dévoile une progression remarquable depuis ses modestes débuts dans un petit atelier autrichien en 1934. Des pionniers visionnaires tels que Hans Trunkenpolz et Ernst Kronreif ont jeté les bases d'une entreprise qui, au fil des décennies, est devenue un géant mondial des deux-roues. Les défis rencontrés, tels que la crise après la Seconde Guerre mondiale et les changements de direction, n'ont fait que renforcer la détermination de KTM à innover et à prospérer. L'évolution de la production, des motos tout-terrain aux motos de route emblématiques et aux voitures de sport, témoigne d'une adaptabilité exceptionnelle.
          - paragraph [ref=e156]
          - paragraph [ref=e157]: La restructuration de l'entreprise dans les années 1990 a été un tournant crucial, donnant naissance à des entités spécialisées qui ont continué à contribuer au succès global de la marque. Les partenariats stratégiques avec des acteurs majeurs de l'industrie, tels que Bajaj Auto, ont renforcé la position de KTM sur la scène internationale.
          - paragraph [ref=e158]
          - paragraph [ref=e159]: Aujourd'hui, en tant que KTM AG, la marque est à la tête d'un groupe prospère comprenant des noms prestigieux tels que Husqvarna Motorcycles et GasGas Motorcycles. Avec une présence mondiale, un engagement continu dans la compétition et une gamme diversifiée de produits, KTM reste un symbole d'excellence autrichienne dans le monde des deux-roues et des sports mécaniques. L'avenir s'annonce prometteur pour cette entreprise emblématique, continuant de marquer l'histoire avec son ingénierie audacieuse et son esprit de compétition inébranlable.
