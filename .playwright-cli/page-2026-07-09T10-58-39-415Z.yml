        - heading "L'équipement du motard sportif, un poste à ne pas négliger" [level=2] [ref=e90]
        - paragraph [ref=e91]: "Sur une sportive, l'équipement n'est pas un accessoire de confort : casque intégral, blouson ou combinaison, gants homologués et bottes protègent le motard à chaque sortie. Dès la première formule, AMV couvre le casque, les gants et le gilet airbag en cas de sinistre. Avec l'Option plus, la couverture s'étend à l'ensemble de l'équipement vestimentaire moto et aux accessoires (top case, sacoches, échappement), jusqu'à 5 000 euros. Un vrai plus, cette garantie étant souvent réservée aux formules haut de gamme ailleurs sur le marché."
        - 'heading "Jeune conducteur et moto sportive : ce qu''il faut savoir" [level=2] [ref=e92]'
        - paragraph [ref=e93]:
          - text: "Le permis A2 limite la puissance à 35 kW (47,5 ch) : certaines sportives existent en version bridée compatible A2, comme la Yamaha YZF-R7 ou la RS 660 d'Aprilia, et les hypersportives exigent le permis A, accessible après la passerelle. L'assurance d'une sportive en début de permis reste toutefois soumise à conditions : selon le modèle et les antécédents du conducteur, elle pourrait ne pas être proposée. Le plus simple est d'en parler à un conseiller AMV. Retrouvez aussi nos conseils sur la page"
          - link "assurance moto jeune conducteur" [ref=e94] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance-moto/assurance-moto-jeune-conducteur/
          - text: . Pour rappel, une surprime jeune conducteur peut atteindre jusqu'à 100 % la première année ; en l'absence de sinistre responsable, elle est limitée à 50 % la deuxième année, puis 25 % la troisième.
        - heading "Pourquoi choisir AMV pour assurer votre sportive ?" [level=2] [ref=e95]
        - paragraph [ref=e96]:
          - text: "AMV, leader de l'assurance deux-roues en France, a plus d'1 million d'assurés. Avec une note de 4,7/5 via Avis Vérifiés, AMV est recommandé par ses assurés (9 sur 10). Depuis 1974, AMV assure toutes les motos, de la 125cc sportive à l'hypersportive, et connaît les besoins spécifiques de leurs pilotes : équipement coûteux, valeur de la machine, réparations particulières. Plus de 350 conseillers basés à Bordeaux vous accompagnent par téléphone ou en ligne, et un conseiller dédié suit votre dossier en cas de sinistre. Découvrez aussi notre"
          - link "assurance moto" [ref=e97] [cursor=pointer]:
            - /url: https://www.amv.fr/assurance/moto/
          - text: pour tous les autres types de machines.
        - heading "Comment souscrire votre assurance moto sportive ?" [level=2] [ref=e98]
        - paragraph [ref=e99]: Munissez-vous de votre permis de conduire et de votre relevé d'information, renseignez les informations sur votre sportive (marque, modèle, année) et votre profil pour obtenir votre devis en ligne en quelques minutes. Vous pouvez alors comparer les formules et choisir celle qui vous correspond. Si le coût vous convient, finalisez la souscription en quelques clics et recevez votre attestation d'assurance par e-mail.
      - generic [ref=e102]:
        - heading "Les critères d’une bonne assurance moto sportive" [level=2] [ref=e103]
        - paragraph [ref=e104]
        - paragraph [ref=e105]: "Comme pour les autres typologies d’assurance moto, le tarif d’une assurance pour moto sportive dépendra d’une multitude de facteurs : garantie choisie, type de sportive à assurer, date de mise sur le marché, profil du conducteur, ou encore lieu de résidence."
        - paragraph [ref=e106]
        - paragraph [ref=e107]: La loi vous impose de souscrire à minima une assurance au tiers. Néanmoins, selon la valeur et votre usage de la moto sportive, cette couverture peut s’avérer insuffisante. En effet, vous ne serez pas protégé en cas de vol, d’incendie, de dégâts matériels sur votre machine ou encore en cas d’accident. Selon le prix d’achat de votre moto sportive, il sera judicieux de privilégier l’assurance Vol/Incendie, voire la garantie Tous Risques, pour rouler plus sereinement.
        - paragraph [ref=e108]
        - paragraph [ref=e109]: Selon les caractéristiques de votre moto et les garanties souhaitées, AMV vous propose des offres d’assurance pour moto sportive adaptées à vos besoins réels.
