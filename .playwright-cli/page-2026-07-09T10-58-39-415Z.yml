      - generic [ref=e43]:
        - generic [ref=e44]: Nouveau contenu optimise
        - 'heading "Assurer une moto sportive : ce qui change vraiment" [level=2] [ref=e45]'
        - paragraph [ref=e46]: "Une moto sportive ne s'assure pas comme un roadster de moyenne cylindrée. Machine de puissance aux performances taillées pour la piste, elle se distingue surtout par une valeur d'achat importante et des pièces et carénages coûteux à réparer : autant d'éléments qui pèsent sur le choix de la couverture et, in fine, sur le prix de l'assurance. AMV, spécialiste de l'assurance deux-roues depuis 1974, assure les sportives et hypersportives de toutes les marques, de la Yamaha YZF-R7 à la BMW S1000RR en passant par les Honda CBR, Suzuki GSX-R, Kawasaki ZX et Ducati Panigale. Comparez les formules et obtenez votre devis en ligne en quelques clics, sans engagement."
        - heading "Quelle formule d'assurance pour votre moto sportive ?" [level=2] [ref=e47]
        - paragraph [ref=e48]: AMV propose quatre formules, du tiers au tous risques. Pour bien choisir, raisonnez à partir de la valeur de votre sportive et de son exposition au risque.
        - heading "Formule Responsabilité civile" [level=3] [ref=e49]
        - paragraph [ref=e50]: "La formule de base, au tiers, couvre les dommages causés aux tiers lors d'un sinistre responsable (dommages corporels illimités et dommages matériels jusqu'à 100 millions d'euros), inclut une assistance juridique et garantit vos équipements de protection : casque, gants et gilet airbag. Elle peut convenir à une sportive de faible valeur marchande, mais laisse votre machine sans couverture propre en cas de dommages."
        - heading "Formule Vol / Incendie" [level=3] [ref=e51]
        - paragraph [ref=e52]: "Cette formule couvre le vol, la tentative de vol et l'incendie, avec une indemnisation à la valeur de remplacement à dire d'expert ou à la valeur à neuf durant les 6 premiers mois. Elle est particulièrement adaptée si votre sportive est stationnée majoritairement en extérieur ou sur la voie publique, où le risque de vol est plus élevé. Bon à savoir : chez AMV, le gravage de votre deux-roues divise la franchise vol par deux."
        - heading "Formule Dommages collision" [level=3] [ref=e53]
        - paragraph [ref=e54]: En cas de collision avec un tiers identifié, les dommages causés à votre sportive sont pris en charge et indemnisés à la valeur de remplacement à dire d'expert ou à la valeur à neuf, sous déduction, en cas de sinistre responsable, de la franchise prévue au contrat. Sur une machine dont les carénages et périphériques coûtent cher, cette prise en charge fait la différence.
        - heading "Formule Tous risques" [level=3] [ref=e55]
        - paragraph [ref=e56]: "La formule la plus complète : elle couvre les dommages subis par votre moto sportive quelles que soient les circonstances, y compris en cas de sinistre responsable ou de vandalisme. C'est la formule particulièrement recommandée pour une sportive neuve, récente ou financée à crédit, dont la valeur justifie une couverture maximale."
        - heading "Les options utiles pour une sportive" [level=2] [ref=e57]
        - heading "Individuelle pilote" [level=3] [ref=e58]
        - paragraph [ref=e59]: Cette option vous verse un capital pouvant atteindre 800 000 euros en cas d'invalidité permanente, ou à vos ayants droit en cas de décès, même lors d'un accident responsable. Sur une moto aux performances élevées, cette option mérite toute votre attention.
        - heading "Assistance 0 km" [level=3] [ref=e60]
        - paragraph [ref=e61]: "Assistance sans franchise kilométrique, 24h/24 et 7j/7 : panne, accident, vol ou tentative de vol, crevaison, perte ou casse de clés, fourrière. Votre sportive est dépannée ou remorquée, et vous êtes rapatrié avec votre passager, en France et dans la plupart des pays d'Europe."
        - heading "Option plus" [level=3] [ref=e62]
        - paragraph [ref=e63]: Étend la couverture aux accessoires hors-série et à l'équipement vestimentaire moto, à concurrence de 5 000 euros, et prolonge la valeur à neuf jusqu'à 18 mois. Pour un pilote de sportive, dont le blouson, le casque et la combinaison représentent un vrai budget, cette option peut se révéler particulièrement pertinente.
        - heading "Le détail des garanties de votre assurance moto sportive" [level=2] [ref=e64]
        - paragraph [ref=e65]: Quelle que soit la formule choisie, elle repose sur un socle de garanties solides. Les plafonds d'indemnisation sont détaillés ci-dessous.
