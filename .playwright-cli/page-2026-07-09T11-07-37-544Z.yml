      - generic [ref=e42]:
        - heading "Les critères d’une bonne assurance moto sportive" [level=2] [ref=e43]
        - paragraph [ref=e44]
        - paragraph [ref=e45]: "Comme pour les autres typologies d’assurance moto, le tarif d’une assurance pour moto sportive dépendra d’une multitude de facteurs : garantie choisie, type de sportive à assurer, date de mise sur le marché, profil du conducteur, ou encore lieu de résidence."
        - paragraph [ref=e46]
        - paragraph [ref=e47]: La loi vous impose de souscrire à minima une assurance au tiers. Néanmoins, selon la valeur et votre usage de la moto sportive, cette couverture peut s’avérer insuffisante. En effet, vous ne serez pas protégé en cas de vol, d’incendie, de dégâts matériels sur votre machine ou encore en cas d’accident. Selon le prix d’achat de votre moto sportive, il sera judicieux de privilégier l’assurance Vol/Incendie, voire la garantie Tous Risques, pour rouler plus sereinement.
        - paragraph [ref=e48]
        - paragraph [ref=e49]: Selon les caractéristiques de votre moto et les garanties souhaitées, AMV vous propose des offres d’assurance pour moto sportive adaptées à vos besoins réels.
      - generic [ref=e50]:
        - heading "Comment assurer sa moto ?" [level=2] [ref=e51]
        - paragraph [ref=e52]
        - paragraph [ref=e53]:
          - text: Bien
          - link "assurer votre moto" [ref=e54] [cursor=pointer]:
            - /url: /assurance/moto/
          - text: est essentiel pour prendre la route en toute sérénité. Pour cela, pourquoi ne pas opter pour l'assurance en ligne proposée par AMV, un assureur de confiance spécialiste de l'assurance moto depuis 50 ans.
        - paragraph [ref=e55]
        - paragraph [ref=e56]: AMV propose la souscription simple et rapide en ligne vous permettant de bénéficier d'une couverture immédiate, sous réserve de certaines conditions. Plus besoin de vous déplacer en agence, quelques clics suffisent pour être assuré.
        - paragraph [ref=e57]
        - paragraph [ref=e58]:
          - text: AMV propose une
          - link "gamme complète de formules d'assurance moto" [ref=e59] [cursor=pointer]:
            - /url: /assurance/moto/
          - text: ", adaptées à vos besoins et à votre budget. Quel que soit le type de moto que vous possédez, que ce soit une sportive, une routière, ou encore un scooter, AMV vous propose des solutions sur mesure pour une protection optimale."
        - paragraph [ref=e60]
        - paragraph [ref=e61]: En cas de sinistre, AMV met à votre disposition un service d'assistance réactif, disponible 24 heures sur 24 et 7 jours sur 7, si vous avez opté pour cette option. Vous pouvez ainsi compter sur une assistance en toutes circonstances, qu'il s'agisse d'un accident, d'un vol ou d'une panne.
        - paragraph [ref=e62]
        - paragraph [ref=e63]: Experts de l'assurance moto, les conseillers AMV sont des passionnés de deux-roues, appréhendant ainsi aisément vos besoins spécifiques en tant que motard. Ils sauront vous accompagner et vous conseiller au mieux tout au long de votre contrat.
        - paragraph [ref=e64]
        - paragraph [ref=e65]:
          - text: En choisissant
          - link "AMV comme assureur pour votre moto" [ref=e66] [cursor=pointer]:
            - /url: https://www.amv.fr/
          - text: ", vous bénéficiez d'une assurance fiable et de qualité, sans perte de temps. N'attendez plus, rendez-vous sur amv.fr pour souscrire votre assurance moto en ligne et prendre la route en toute tranquillité dès maintenant !"
        - generic [ref=e67]:
          - link "Testez notre tarif d'assurance pour votre moto" [ref=e69] [cursor=pointer]:
