      - generic [ref=e763]:
        - heading "H2 Comment obtenir votre devis assurance moto ?" [level=2] [ref=e764]:
          - generic [ref=e765]: H2
          - text: Comment obtenir votre devis assurance moto ?
        - paragraph [ref=e766]: "Obtenir votre devis assurance moto en ligne se fait en quelques étapes simples. Renseignez les informations sur votre véhicule (modèle, puissance, année) et votre profil (expérience, bonus-malus, région) via le formulaire pour recevoir votre tarif en quelques minutes. Si le prix vous convient, vous pouvez souscrire en quelques clics et recevez votre attestation d'assurance par mail. La souscription est sans engagement : vous restez libre de votre décision, à votre rythme. Que vous cherchiez l'assurance moto la moins chère ou la couverture la plus complète, nos conseillers vous accompagnent aussi par téléphone à chaque étape."
        - generic [ref=e767]:
          - generic [ref=e768]: Questions fréquentes
          - heading "Des questions sur votre assurance moto ? Nous y répondons ici" [level=2] [ref=e769]:
            - text: Des questions sur votre assurance moto ?
            - text: Nous y répondons ici
        - generic [ref=e771]:
          - generic [ref=e772] [cursor=pointer]:
            - generic [ref=e773]:
              - generic [ref=e774]: Quelle assurance moto choisir ?
              - img [ref=e775]
            - generic [ref=e776]:
              - paragraph [ref=e777]: Pour choisir avec soin votre assurance moto, il est primordial de scruter attentivement les tarifs, les garanties et les franchises proposées. AMV, un assureur spécialisé dans le domaine de la moto, se présente comme une option à prendre en sérieuse considération. Fort de son expertise, AMV offre des solutions adaptées aux besoins spécifiques des motards, assurant ainsi une couverture complète et fiable pour leurs deux-roues. Grâce à son expérience dans le secteur, AMV peut offrir des services sur mesure et des conseils avisés, assurant la tranquillité d'esprit des motocyclistes tout au long de leurs aventures sur la route.
              - paragraph [ref=e778]: Le choix dépend de la valeur de votre véhicule, de votre usage et de votre budget. Une formule Responsabilité civile pourrait suffire pour une moto ancienne ou de faible valeur. Pour une moto récente ou financée à crédit, la formule Tous risques avec dommages tous accidents offre la meilleure protection. Si vous stationnez en extérieur en zone urbaine, la formule Vol / Incendie mérite d'être envisagée. Comparez les garanties, les franchises et les plafonds proposés avant de vous décider.
          - generic [ref=e779] [cursor=pointer]:
            - generic [ref=e780]:
              - generic [ref=e781]: Quel est le prix d'une assurance moto ?
              - img [ref=e782]
            - generic [ref=e783]:
              - paragraph [ref=e784]: Le coût d'une assurance moto chez AMV prend en compte plusieurs facteurs, tels que le modèle de la moto, l'expérience du conducteur (permis, sinistres, bonus), le lieu de stationnement habituel et le niveau de garanties désiré. Chez AMV, nous offrons des tarifs compétitifs adaptés à chaque profil de conducteur et à chaque type de moto. Nos conseillers spécialisés sont là pour vous aider à choisir la couverture qui répond le mieux à vos besoins et à votre budget. N'hésitez pas à nous contacter pour obtenir un devis personnalisé et découvrez comment nous pouvons protéger au mieux votre moto. Chez AMV, nous sommes fiers d'accompagner les motards depuis 50 ans et de leur proposer une assurance sur mesure pour rouler en toute sérénité.
              - paragraph [ref=e785]: "Le prix varie fortement d'un profil à l'autre. Il dépend de plusieurs critères :"
              - list [ref=e786]:
                - listitem [ref=e787]: le type de moto, sa cylindrée et sa puissance
                - listitem [ref=e788]: l'âge et l'expérience du conducteur
                - listitem [ref=e789]: la zone géographique et le lieu de stationnement
                - listitem [ref=e790]: le niveau de couverture choisi
              - paragraph [ref=e791]: Chez AMV, un devis personnalisé en ligne vous donne un tarif adapté en quelques clics.
          - generic [ref=e792] [cursor=pointer]:
            - generic [ref=e793]:
              - generic [ref=e794]: Quelle formule assurance moto choisir ?
              - img [ref=e795]
            - paragraph [ref=e797]: Le choix de la formule d'assurance moto dépend entièrement de vos besoins spécifiques ainsi que de votre budget. Si vous possédez une moto récente, il est fortement recommandé de souscrire à une garantie dommages Tous Risques, cela vous permettra de couvrir les frais de réparation en cas d'accident responsable. AMV, en tant qu'assureur spécialisé dans l'assurance moto, propose différentes garanties et options adaptées à chaque profil. N'hésitez pas à faire un devis sur amv.fr ou les contacter pour obtenir des informations détaillées sur les formules d'assurance moto qu'ils proposent, afin de trouver celle qui répond le mieux à vos besoins spécifiques.
          - generic [ref=e798] [cursor=pointer]:
            - generic [ref=e799]:
              - generic [ref=e800]: Puis-je modifier mon devis moto ou auto sur amv.fr ?
              - img [ref=e801]
            - paragraph [ref=e803]: Oui, sur amv.fr, vous avez la possibilité de modifier votre devis d'assurance moto à tout moment depuis la rubrique "Retrouver vos tarifs/devis". Les devis que vous établissez sont conservés pendant une période d'un mois. Vous pouvez souscrire à effet immédiat ou différé.
          - generic [ref=e804] [cursor=pointer]:
            - generic [ref=e805]:
              - generic [ref=e806]: Comment obtenir un devis d'assurance moto ?
              - img [ref=e807]
            - paragraph [ref=e809]: Pour obtenir un devis d'assurance moto rapidement, AMV est votre partenaire de confiance. Spécialiste de l'assurance moto depuis 50 ans, cet assureur propose des solutions adaptées à vos besoins. Rendez-vous sur amv.fr et complétez simplement notre formulaire pour découvrir votre tarif en seulement 3 minutes. Faites confiance à AMV et roulez en toute sérénité avec la protection dont vous avez besoin.
          - generic [ref=e810] [cursor=pointer]:
            - generic [ref=e811]:
              - generic [ref=e812]: Comment assurer sa moto ?
              - img [ref=e813]
            - generic [ref=e814]:
              - paragraph [ref=e815]: Bien assurer votre moto est essentiel pour prendre la route en toute sérénité. Pour cela, pourquoi ne pas opter pour l'assurance en ligne proposée par AMV, un assureur de confiance spécialiste de l'assurance moto depuis 50 ans.
              - paragraph [ref=e816]: AMV met à votre disposition un processus de souscription simple et rapide, vous permettant de bénéficier d'une couverture immédiate, sous réserve de certaines conditions bien entendu. Plus besoin de vous déplacer en agence, quelques clics suffisent pour obtenir votre contrat d'assurance.
              - paragraph [ref=e817]: L'avantage de choisir AMV réside également dans sa gamme complète de formules d'assurance moto, adaptées à vos besoins et à votre budget. Quel que soit le type de moto que vous possédez, que ce soit une sportive, une routière, ou encore un scooter, AMV vous propose des solutions sur mesure pour une protection optimale.
              - paragraph [ref=e818]: En cas de sinistre, AMV met à votre disposition un service d'assistance réactif, disponible 24 heures sur 24 et 7 jours sur 7, si vous avez souscrit cette garantie. Vous pouvez ainsi compter sur eux en toutes circonstances, qu'il s'agisse d'un accident, d'un vol ou d'une panne.
              - paragraph [ref=e819]: En tant qu'expert de l'assurance moto, les conseillers AMV sont des passionnés de deux-roues et comprennent parfaitement vos besoins spécifiques en tant que motard. Ils sauront vous accompagner et vous conseiller au mieux tout au long de votre contrat.
              - paragraph [ref=e820]: En choisissant AMV comme assureur pour votre moto, vous bénéficiez d'une assurance fiable et de qualité, sans tracas et sans perte de temps. N'attendez plus, rendez-vous sur amv.fr pour souscrire votre assurance moto en ligne et prendre la route en toute tranquillité dès maintenant !
          - generic [ref=e821] [cursor=pointer]:
            - generic [ref=e822]:
              - generic [ref=e823]: Quelles sont les garanties incluses dans une assurance moto AMV ?
              - img [ref=e824]
            - paragraph [ref=e826]: AMV propose 4 formules d’assurance moto. L'offre inclut dès sa première formule la Responsabilité civile, l'Assistance juridique et la garantie des équipements de protection (gants jusqu’à 70 €, casque jusqu’à 250 €, gilet airbag jusqu’à 500 € s'ils sont détériorés à la suite d'un sinistre, sous conditions). Selon la formule, vous pouvez bénéficier en plus des garanties Vol/Incendie, Dommages collision, et Dommages tous accidents (Tous Risques). D'autres garanties comme l’Assistance 0 km, l’Individuelle Pilote ou l’Option Plus (extension de garantie aux accessoires et équipements jusqu’à 5 000 €) sont également proposées en option.
          - generic [ref=e827] [cursor=pointer]:
            - generic [ref=e828]:
              - generic [ref=e829]: Quand prennent effet les garanties de mon assurance moto ?
              - img [ref=e830]
            - paragraph [ref=e832]: Les garanties prennent effet immédiatement à la souscription ou à la date choisie (qui peut être différée jusqu’à deux mois).
          - generic [ref=e833] [cursor=pointer]:
            - generic [ref=e834]:
              - generic [ref=e835]: Comment savoir si ma demande d’assurance moto a bien été enregistrée ?
              - img [ref=e836]
            - paragraph [ref=e838]: À la fin de votre souscription en ligne, un numéro de souscription vous est communiqué et une confirmation vous est envoyée par e-mail.
          - generic [ref=e839] [cursor=pointer]:
            - generic [ref=e840]:
              - generic [ref=e841]: Qu’est-ce qu’une franchise en assurance moto AMV ?
              - img [ref=e842]
            - paragraph [ref=e844]: En cas de sinistre, la franchise est la part de l'indemnité qui reste à la charge de l'assuré suite à la mise en jeu d'une garantie dommages. Chez AMV, elle est plafonnée, avec un minimum et un maximum variable selon la cylindrée. Le détail des franchises est précisé dans les Dispositions Particulières
          - generic [ref=e845] [cursor=pointer]:
            - generic [ref=e846]:
              - generic [ref=e847]: AMV propose-t-elle une assurance moto pour les jeunes conducteurs ?
              - img [ref=e848]
            - paragraph [ref=e850]: Oui, AMV propose des formules adaptées à tous les profils, y compris les jeunes conducteurs (sous réserve d'acceptation des conditions de souscription). AMV a des conditions de souscription parmi les plus larges du marché. La tarification prend en compte de nombreux critères notamment l’âge, l’expérience et l’historique de conduite, le lieu de stationnement. Vous pouvez obtenir un devis personnalisé en ligne.
          - generic [ref=e851] [cursor=pointer]:
            - generic [ref=e852]:
              - generic [ref=e853]: Peut-on modifier ses garanties d’assurance moto en ligne ?
              - img [ref=e854]
            - paragraph [ref=e856]: Oui, il est possible de modifier ses garanties et options à tout moment via votre espace client (Mon Espace AMV) sur amv.fr, selon les conditions de votre contrat.
          - generic [ref=e857] [cursor=pointer]:
            - generic [ref=e858]:
              - generic [ref=e859]: Comment déclarer un sinistre moto avec AMV ?
              - img [ref=e860]
            - generic [ref=e861]:
              - paragraph [ref=e862]: Vous pouvez déclarer un sinistre directement depuis votre espace client (Mon Espace AMV) sur le site amv.fr. Un gestionnaire dédié s'occupe de la gestion de votre dossier.
              - paragraph [ref=e863]: Déclaration directement depuis Mon Espace AMV sur amv.fr, 24h/24. Un gestionnaire dédié prend en charge votre dossier et vous accompagne dans toutes les démarches d'indemnisation.
          - generic [ref=e864] [cursor=pointer]:
            - generic [ref=e865]:
              - generic [ref=e866]: AMV propose-t-elle une assistance 0 km moto ?
              - img [ref=e867]
            - paragraph [ref=e869]: Oui, l’option Assistance 0 km est proposée dès la formule 2. Elle inclut une assistance sans franchise kilométrique, en cas de panne, accident, vol, tentative de vol, crevaison, perte de clés ou mise en fourrière, pour votre moto, le pilote et le passager.
          - generic [ref=e870] [cursor=pointer]:
