            - text: AMV Légende est une offre d'assurance auto et moto anciennes, spécialement conçue pour les véhicules de collection. Notre équipe de conseillers d’assurance met à votre service son expertise pour vous garantir une qualité de service privilégiée et vous assurer une gestion personnalisée de vos contrats pour tous vos modèles. Vous pouvez construire votre contrat sur-mesure avec le niveau de garanties qui convient à chacun de vos véhicules et bénéficier de tarifs très avantageux, et dégressifs en fonction de l’âge et du nombre de véhicules à assurer.
