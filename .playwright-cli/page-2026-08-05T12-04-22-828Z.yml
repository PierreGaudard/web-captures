        - generic [ref=e54]:
          - heading " Comment bien choisir son assurance moto / auto pour véhicule(s) ancien(s) ou de collection ?" [level=3] [ref=e55] [cursor=pointer]:
            - generic [ref=e56]: 
            - text: Comment bien choisir son assurance moto / auto pour véhicule(s) ancien(s) ou de collection ?
          - generic [ref=e57]:
            - paragraph [ref=e58]: Pour bien choisir son assurance moto / auto pour véhicules anciens ou de collection, il est primordial de se poser les bonnes questions en fonction de ses besoins et de son véhicule.
            - paragraph [ref=e59]: "Voici quelques étapes à suivre :"
            - paragraph [ref=e60]: "Évaluer la valeur de votre véhicule : un véhicule de collection peut avoir une valeur très différente d'un véhicule standard. Il est donc essentiel d'avoir une évaluation juste pour bénéficier d'une couverture adéquate."
            - paragraph [ref=e61]: Privilégier un assureur spécialisé dans les véhicules anciens ou de collection qui propose une offre spécifique comme AMV Légende.
            - paragraph [ref=e62]: "Lire attentivement les garanties proposées : au-delà du tarif, il est essentiel de comprendre les garanties du contrat. Certains couvriront par exemple les dommages tous accidents, tandis que d'autres offriront une protection en cas de vol ou d'incendie."
            - paragraph [ref=e63]: "Tenir compte des spécificités : les véhicules anciens ou de collection ont des particularités comme l'usage ou la possibilité de regrouper plusieurs véhicules dans un contrat flotte"
          - heading " Comment changer d'assurance moto / auto pour véhicule(s) ancien(s) ou de collection ?" [level=3] [ref=e64] [cursor=pointer]:
            - generic [ref=e65]: 
            - text: Comment changer d'assurance moto / auto pour véhicule(s) ancien(s) ou de collection ?
          - generic [ref=e66]:
            - paragraph [ref=e67]: "Renseignez-vous sur vos droits : depuis l'entrée en vigueur de la loi Hamon, il est plus simple de résilier son contrat d'assurance. Après un an d'engagement, vous pouvez changer d'assurance à tout moment."
            - paragraph [ref=e68]: "Recherchez un nouvel assureur et ne résiliez pas votre contrat avant de souscrire : vous pouvez demander un devis chez AMV Légende qui propose des contrats spécifiques pour les véhicules anciens et de collection."
            - paragraph [ref=e69]: Une fois votre souscription validée, mandatez votre nouvel assureur pour effectuer les démarches de résiliation à votre place. Il s'occupera de toutes les formalités.
          - heading " Comment résilier son assurance moto / auto de véhicule(s) ancien(s) ou de collection ?" [level=3] [ref=e70] [cursor=pointer]:
            - generic [ref=e71]: 
            - text: Comment résilier son assurance moto / auto de véhicule(s) ancien(s) ou de collection ?
          - generic [ref=e72]:
            - paragraph [ref=e73]: "Respectez le délai d'un an : suite à la loi Hamon, après une année de souscription, la résiliation est possible à tout moment sans frais ni justification."
            - paragraph [ref=e74]: C'est votre nouvel assureur qui s'occupera des démarches de résiliation.
          - heading " Quelle est l'assurance moto / auto pour véhicule(s) ancien(s) ou de collection la moins chère ?" [level=3] [ref=e75] [cursor=pointer]:
            - generic [ref=e76]: 
            - text: Quelle est l'assurance moto / auto pour véhicule(s) ancien(s) ou de collection la moins chère ?
          - generic [ref=e77]:
            - paragraph [ref=e78]: Il n'existe pas de réponse unique à cette question car les tarifs dépendent de nombreux facteurs (âge du véhicule, garanties choisies, profil de l'assuré...).
            - paragraph [ref=e79]: Cependant, généralement, les assurances au tiers sont les moins chères car elles offrent une couverture minimale.
          - heading " Quel avantage de passer une moto en carte grise de collection?" [level=3] [ref=e80] [cursor=pointer]:
            - generic [ref=e81]: 
            - text: Quel avantage de passer une moto en carte grise de collection?
          - generic [ref=e82]:
            - paragraph [ref=e83]: "Passer une moto en carte grise collection présente plusieurs avantages :"
            - paragraph [ref=e84]: "Tarif de l'assurance : les motos de collection ont souvent des primes d'assurance réduites car elles sont généralement moins utilisées et mieux entretenues."
            - paragraph [ref=e85]: "Carte grise collection : disponible pour les motos âgées de 30 ans ou plus, elle est souvent moins chère et offre certaines facilités, par exemple pour la circulation dans des zones restreintes."
            - paragraph [ref=e86]: "Valeur patrimoniale : une moto de collection peut prendre de la valeur avec le temps, ce qui représente un avantage pour le propriétaire."
