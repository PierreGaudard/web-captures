      - generic [ref=e41]:
        - paragraph [ref=e43]: Honda Motor Co. Ltd, communément appelé Honda, occupe une place prépondérante dans le monde automobile japonais. Fondé en 1948 par Soichiro Honda et Takeo Fujisawa, l'entreprise a évolué pour devenir non seulement un constructeur automobile renommé, mais aussi un acteur majeur dans la production de motocyclettes, quads, scooters, avions d'affaires, générateurs électriques, moteurs de bateaux, ainsi que d'équipements de jardinage et de bricolage.
        - generic [ref=e44]:
          - 'heading "De la bicyclette économique à l''innovation motorisée : l''épopée de Honda dans l''industrie automobile et motocycliste" [level=4] [ref=e45]':
            - strong [ref=e46]: "De la bicyclette économique à l'innovation motorisée : l'épopée de Honda dans l'industrie automobile et motocycliste"
          - paragraph [ref=e47]
          - paragraph [ref=e48]: Seiki Heavy Industry, une entreprise produisant des segments de pistons. Pendant la Seconde Guerre mondiale, cette entreprise a été absorbée par Toyota. Après la guerre, Soichiro Honda s'est associé à Takeo Fujisawa pour fonder Honda Motor Company Limited, le 24 septembre 1948. Leur premier succès a été le Type A, un véhicule économique équipé d'un moteur de générateur monté sur une bicyclette.
          - paragraph [ref=e49]
          - paragraph [ref=e50]: La renommée de Honda a continué de croître avec l'introduction de motocyclettes dans les années 1960, suivie d'une incursion réussie dans la production automobile en 1963 avec des modèles tels que la S360 et la S600. Actuellement, le siège social de l'entreprise est situé à Tokyo, dans le quartier de Minato, et son président-directeur général est Takahiro Hachigō depuis juin 2015, succédant à Takanobu Itō.
          - paragraph [ref=e51]
          - paragraph [ref=e52]: Honda a marqué l'histoire de la compétition automobile, remportant tous les titres mondiaux « constructeur » en 1967 avec ses machines multicylindres. Dans les années 1970, la domination de Honda en endurance a été consolidée par des victoires à Daytona aux États-Unis. La moto de tourisme VT 500 E a également marqué un tournant dans l'industrie, témoignant de l'innovation constante de Honda.
          - paragraph [ref=e53]
          - paragraph [ref=e54]: La gamme de motos Honda dans les années 1980, avec notamment des modèles tels que la CB 99F, la VT 500 E et la CB 450 avec double arbre à cames en tête, a contribué à asseoir la réputation de la marque. La CB 750 Four, surnommée « Quatre pattes », a été un véritable succès commercial des années 1970, dotée du premier frein à disque hydraulique.
          - paragraph [ref=e55]
          - paragraph [ref=e56]: La Gold Wing, lancée au milieu des années 1970 avec un moteur de 1 000cm³, a été suivie de diverses déclinaisons, y compris une version 6-cylindres à 1 500cm³ et jusqu'à 1 800cm³. Honda a continué d'innover avec la commercialisation en série de la moto turbocompressée 500 CX Turbo en 1982, suivi de la 650 Turbo.
          - paragraph [ref=e57]
          - paragraph [ref=e58]: Les années suivantes ont vu l'arrivée des Honda VFR en 1986, avec des solutions technologiques éprouvées en compétition. Cependant, confronté à la nécessité d'améliorer sa compétitivité, Honda a fini par commercialiser des engins tout-terrain équipés de moteurs deux-temps.
          - paragraph [ref=e59]
          - paragraph [ref=e60]: Parmi les réalisations les plus marquantes de Honda, mentionnons le moteur à pistons oblongs de la gamme NR, un V4 à 32 soupapes tournant à 14 000 tr/min. Ce moteur, initialement conçu pour la compétition, a été monté sur la machine homologable 750 NR.
          - paragraph [ref=e61]
          - paragraph [ref=e62]: En octobre 2019, Honda a entrepris une fusion avec Hitachi Automotive Systems, Keihin, Showa Corporation et Nissin Kogyo, renforçant ainsi sa position dans l'industrie automobile. Ainsi, avec son riche héritage et une culture d'innovation, Honda continue d'être un leader mondial dans le domaine de l'automobile et de la moto.
        - generic [ref=e63]:
          - heading "Conclusion" [level=4] [ref=e64]:
            - strong [ref=e65]: Conclusion
          - paragraph [ref=e66]
          - paragraph [ref=e67]: En conclusion, l'histoire de Honda est une saga fascinante de détermination, d'innovation et de réussite. De ses modestes débuts en tant que fabricant de segments de pistons aux sommets de l'industrie automobile et motocycliste mondiale, Honda a su évoluer avec agilité et constance. La marque a laissé une empreinte incontestable dans le monde du deux-roues, introduisant des technologies révolutionnaires et remportant des victoires éclatantes sur les circuits internationaux. En perpétuelle quête d'excellence, Honda continue de tracer sa route, marquant l'industrie de son esprit novateur et son engagement pour la qualité et la performance.
