        - paragraph [ref=e73]
        - paragraph [ref=e74]: AMV propose la souscription simple et rapide en ligne vous permettant de bénéficier d'une couverture immédiate, sous réserve de certaines conditions. Plus besoin de vous déplacer en agence, quelques clics suffisent pour être assuré.
        - paragraph [ref=e75]
        - paragraph [ref=e76]:
          - text: AMV propose une
          - link "gamme complète de formules d'assurance moto" [ref=e77] [cursor=pointer]:
